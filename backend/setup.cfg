[mutmut]
# ST-15 (BLG-QA-184, EPIC-03, v9.8) mutation-testing pilot.
# Run with cwd=backend/ so mutmut's key computation (path relative to cwd)
# matches this repo's bare `services.X`/`utils.X` import convention -- see
# docs/testing/mutation_testing_pilot_sizing_and_stop_ratchet.md and
# BLG-QA-198 for why source_paths=["backend"] from the repo root does not
# work here. Invoke as (from repo root):
#   cd backend && /tmp/mutmut_pilot_venv/venv/bin/python3 -m mutmut run
source_paths =
    .
only_mutate =
    services/sizing_service.py
    utils/calculations.py
pytest_add_cli_args_test_selection =
    mutmut_pilot_tests/test_pilot.py
