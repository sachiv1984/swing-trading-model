# gitleaks configuration for swing-trading-model
# ST-10 (BLG-OPS-58, v5.3) — CI secret scanning allowlist
# Authority: Cybersecurity & Trust Lead

title = "swing-trading-model gitleaks config"

[extend]
# Use the default gitleaks ruleset as the base
useDefault = true

[[allowlists]]
description = "Test fixture synthetic credentials — obvious test stubs, not real secrets"
paths = [
  "tests/.*\\.py",
  "tests/conftest\\.py",
]
regexes = [
  # Generic short test token stubs used in unit tests: "tok", "test-token", "test-secret"
  '''(TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|API_KEY)['":\s]+['"](tok|test-token|test-secret|test-chat|123|key|secret)['"]\s''',
  # Synthetic DB URL used in conftest.py stub
  '''postgresql://test:test@localhost:5432/test_stub''',
]

# NOTE: gitleaks' schema only permits array-of-tables allowlists ([[rules.allowlists]])
# nested under a specific [[rules]] block, or a single global [allowlist] (singular,
# not an array). A bare top-level [[allowlists]] (plural, unnested) as used elsewhere
# in this file is not a recognised key in gitleaks v8.21 and is silently ignored — see
# BLG-SEC-26. This entry uses the correct rule-scoped form, verified locally against
# gitleaks v8.21.2 to actually suppress the finding (both rules that fire on this
# secret: github-pat and generic-api-key).
[[rules]]
id = "github-pat"

  [[rules.allowlists]]
  description = "Secrets-scanning hook regression test — deliberately-planted fake PAT (ST-05, EPIC-02, v7.10)"
  condition = "AND"
  regexTarget = "match"
  paths = [
    "tests/test_secrets_scanning_hook\\.py",
  ]
  regexes = [
    '''ghp_16C7e42F292c6912E7710c838347Ae178B4a''',
  ]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Secrets-scanning hook regression test — deliberately-planted fake PAT (ST-05, EPIC-02, v7.10)"
  condition = "AND"
  regexTarget = "match"
  paths = [
    "tests/test_secrets_scanning_hook\\.py",
  ]
  regexes = [
    '''ghp_16C7e42F292c6912E7710c838347Ae178B4a''',
  ]

[[allowlists]]
description = "Alpaca test stubs — short placeholder values in integration tests"
paths = [
  "tests/test_alpaca_integration\\.py",
]
regexes = [
  # "key" and "secret" are obviously synthetic test values
  '''"key"''',
  '''"secret"''',
]

[[allowlists]]
description = "localStorage key strings in governance docs — not secrets, UI state keys"
paths = [
  "claude/cycles/.*\\.md",
  "docs/.*\\.md",
]
regexes = [
  # localStorage versioned keys such as 'ai-briefing-collapsed-sections-v1' are
  # UI state identifiers, not credentials. The variable name STORAGE_KEY triggers
  # the generic-api-key rule on entropy alone.
  '''STORAGE_KEY\s*=\s*['"][a-z][a-z0-9-]+-v\d+['"]''',
]
