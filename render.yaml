# Render Blueprint — Staging Environment
# Provisions two services: staging API (Web Service) + staging frontend (Static Site)
# Production services are managed separately in the Render dashboard — this file only defines staging.
#
# HUMAN ACTION REQUIRED before deploying:
#   1. Create the Supabase staging project and obtain DATABASE_URL (see docs/infrastructure/staging_setup.md)
#   2. Deploy via Render dashboard: New → Blueprint → point to this repo
#   3. Set the DATABASE_URL secret on trading-assistant-api-staging (see §3 of runbook)
#
# NOTE: Render service names must be globally unique. If 'trading-assistant-api-staging'
# or 'trading-assistant-staging' are taken, choose alternative names and update:
#   - backend/config.py ALLOWED_ORIGINS (replace the staging frontend URL)
#   - This file (update both service names and the REACT_APP_API_URL value)

services:

  # ──────────────────────────────────────────────────────────
  # Staging API — FastAPI on Render Web Service
  # ──────────────────────────────────────────────────────────
  - type: web
    name: trading-assistant-api-staging
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # Human must set this in Render dashboard — see runbook §3
      - key: BREVO_API_KEY
        sync: false          # Human must set — API key from Brevo dashboard → SMTP & API → API Keys
      - key: ALERT_FROM_EMAIL
        sync: false          # Human must set — verified sender address in Brevo
      - key: ALERT_TO_EMAIL
        sync: false          # Human must set — email address to receive alerts
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ──────────────────────────────────────────────────────────
  # Staging Frontend — React static site on Render
  # ──────────────────────────────────────────────────────────
  - type: web
    name: trading-assistant-staging
    runtime: static
    buildCommand: CI=false npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://trading-assistant-api-staging.onrender.com
      - key: REACT_APP_APP_ID
        value: staging-app-id
      - key: REACT_APP_DEV_FAKE_AUTH
        value: "true"
      - key: PUBLIC_URL
        value: "/"             # Overrides homepage in package.json so asset paths resolve at root
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # Required for client-side routing fallback
