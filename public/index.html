<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Swing Trading Position Manager" />
    <!-- style-src 'unsafe-inline' exception (BLG-SEC-12, ST-18, EPIC-04, v8.4): src/components/ui/chart.js's
         ChartStyle renders a <style> element via dangerouslySetInnerHTML with per-render, per-chart-config CSS
         custom properties (--color-<key>), scoped under [data-chart=<id>] and conditionally under .dark for
         theme-reactive colours. Content is dynamic (varies per chart config), so a static sha256/nonce source
         is not viable; script-src carries no such exception. The SPA redirect is an external file
         (spa-redirect.js, BLG-FE-325), so script-src is 'self' only: no inline <script> in this document. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data: blob:; font-src 'self' data:;" />
    <title>Position Manager</title>
    <script defer src="%PUBLIC_URL%/spa-redirect.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
