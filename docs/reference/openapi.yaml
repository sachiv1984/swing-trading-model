                          $ref: "#/components/schemas/PriceAlert"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Alerts]
      summary: Create custom price alert
      description: >
        Create a user-defined ticker/condition/threshold price alert. Returns 400 if the
        per-portfolio active-alert cap (50) is exceeded. Canonical contract:
        docs/specs/api_contracts/alerts_endpoints.md v0.5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePriceAlertRequest"
