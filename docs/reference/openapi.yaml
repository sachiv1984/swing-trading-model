          schema: { type: integer }
      responses:
        "200":
          description: Reconciliation report
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      tax_year_label:
                        type: string
                        example: "2025/26"
                      total_closed_trades:
                        type: integer
                        example: 12
                      system_total_pnl_gbp:
                        type: number
                        example: 1500.00
                      export_total_pnl_gbp:
                        type: number
                        example: 1500.00
                      matched:
                        type: boolean
                        example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

