      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagsRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkUpdateTags"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/mark-reviewed:
    patch:
      tags: [Positions]
      summary: Mark a position as reviewed
      description: |
        Sets last_reviewed_at = NOW() for the given position — the confirm
        action for the position review cadence nudge (v7.0, ST-15, BLG-FEAT-68).
        Display-only; no automated action beyond the explicit user-triggered
        timestamp update. No request body.
        Canonical contract: docs/specs/api_contracts/position_endpoints.md v2.5.0
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Position marked as reviewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      last_reviewed_at: { type: string, format: date-time, nullable: true }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/tags:
    get:
      tags: [Positions]
      summary: Get all tags
      description: Returns all unique tags in use across open positions.
      responses:
        "200":
          $ref: "#/components/responses/OkTagsList"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/compliance-recheck:
    get:
      tags: [Positions]
      summary: Re-apply SI-01 pre-entry checks against current position state
      description: |
        Re-applies the 5 existing SI-01 pre-entry deterministic rule checks against an
        open position's current state (current regime, current signal conditions,
        current heat/sizing) rather than its entry-time snapshot. Manual, on-demand,
        single-position check. §13 display-only — no new statistical model, scoring,
        or prediction; no automated action. Does not replace SI-02 (drift detection).
        (v6.9 ST-01, BLG-FEAT-64)
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
          description: Position UUID
      responses:
        "200":
          description: Compliance recheck result returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      overall_status:
                        type: string
                        enum: [pass, warn, fail]
                      checks:
                        type: array
                        items:
                          type: object
                          properties:
                            rule_key:
                              type: string
                              enum: [regime_gate, cash_constraint, sector_concentration, earnings_proximity, sizing_validity]
                            status:
                              type: string
                              enum: [pass, warn, fail, skipped]
                            detail:
                              type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/gap-risk:
    get:
      tags: [Positions]
      summary: Overnight/weekend gap risk flag for a position
      description: |
        Returns the overnight/weekend gap risk flag for a single open position,
        combining the DS-04 earnings calendar with historical OHLCV gap statistics.
        §13 display-only — surfaces a known calendar event and historical statistic,
        no gap direction/magnitude prediction. (v6.9 ST-02, BLG-FEAT-65)
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
          description: Position UUID
      responses:
        "200":
          description: Gap risk flag returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      flagged:
                        type: boolean
                      reasons:
                        type: array
                        items:
                          type: string
                          enum: [earnings, weekend_hold]
                      avg_gap_pct:
                        type: number
                        nullable: true
                      event_count:
                        type: integer
                      insufficient_history:
                        type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/search/tags:
    get:
      tags: [Positions]
      summary: Search positions by tags
      description: Search open and closed positions by one or more tags (OR match, case-insensitive).
      parameters:
        - in: query
          name: tags
          required: true
          schema:
            type: string
          description: Comma-separated list of tags to search for.
      responses:
        "200":
          description: Array of matching position objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Position"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/grace-period-alerts:
    get:
      tags: [Positions]
      summary: Grace period alerts
      description: >
        Returns positions in GRACE lifecycle state where days_in_state >= 8 (nearing end of grace
        period). Includes linked trade plan summary if available.
        §13 display-only — system surfaces context; human decides next action.
        Spec: docs/specs/api_contracts/grace_period_alert_endpoint.md
      responses:
        "200":
          description: Array of grace period alert objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        position_id:
                          type: string
                          format: uuid
                        ticker:
                          type: string
                        market:
                          type: string
                          enum: [US, UK]
                        days_in_state:
                          type: integer
                        trade_plan_id:
                          type: string
                          format: uuid
                          nullable: true
                        trade_plan_summary:
                          type: object
                          nullable: true
                          properties:
                            setup_thesis:
                              type: string
                              nullable: true
                            entry_rationale:
                              type: string
                              nullable: true
                            stop_level:
                              type: number
                              nullable: true
                            r_target:
                              type: number
                              nullable: true
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/stop-trail:
    get:
      tags: [Positions]
      summary: ATR trail stop recommendation
      description: >
        Returns ATR-based trail stop calculation for a single open position.
        trail_multiplier defaults to 2.0.
        §13 display-only — recommendation is informational; human must confirm any stop change.
        Spec: docs/specs/api_contracts/stop_trail_endpoint.md
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stop trail calculation result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      position_id:
                        type: string
                        format: uuid
                      ticker:
                        type: string
                      current_price:
                        type: number
                      current_stop:
                        type: number
                        nullable: true
                      atr_trail_stop:
                        type: number
                      trail_difference:
                        type: number
                        nullable: true
                      trail_r_terms:
                        type: number
                        nullable: true
                      recommendation:
                        type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: ATR not available for position.
        "503":
          description: Live price unavailable.
        "500":
          $ref: "#/components/responses/InternalError"

  /trades:
    get:
      tags: [Trades]
      summary: Get trade history
      description: Retrieve all closed trades with statistics.
      responses:
        "200":
          $ref: "#/components/responses/OkTrades"
        "500":
          $ref: "#/components/responses/InternalError"

  /trades/{trade_id}/reflection:
    get:
      tags: [Trades]
      summary: Get trade reflection
      description: "Retrieve saved reflection for a closed trade. Returns 404 if no reflection saved yet. Spec: trade_reflection.md §7."
      parameters:
        - name: trade_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reflection retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkReflection"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Trades]
      summary: Save trade reflection
      description: "Create or update (upsert) the reflection for a closed trade. All fields optional. Idempotent. Spec: trade_reflection.md §7."
      parameters:
        - name: trade_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReflectionRequest"
      responses:
        "200":
          description: Reflection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkReflection"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /trades/{trade_id}/plan-vs-reality:
    get:
      tags: [Trades]
      summary: Get plan vs reality comparison
      description: "Returns the plan vs reality comparison for a closed trade with a linked trade plan. Returns {status: trade_open} if position is still open. Returns 404 if no trade plan is linked. PO-01 — ST-05 (EPIC-02, v3.5). Spec: docs/specs/api_contracts/trades_endpoints.md"
      parameters:
        - name: trade_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Plan vs reality comparison or trade_open status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, trade_open]
                  data:
                    type: object
                    properties:
                      plan_linked: { type: boolean }
                      trade_plan_id: { type: string, format: uuid }
                      r_achieved: { type: number, nullable: true }
                      r_target: { type: number, nullable: true }
                      r_delta: { type: number, nullable: true }
                      entry_delta_pct: { type: number, nullable: true }
                      stop_discipline: { type: string, enum: [on_plan, minor_deviation, deviation, not_captured] }
                      exit_reason_actual: { type: string, nullable: true }
                      exit_reason_planned: { type: string, nullable: true }
                      lifecycle_state_at_exit: { type: string, nullable: true }
                      plan_adherence_flag: { type: string, enum: [on_plan, entry_deviation, stop_deviation, early_exit] }
                      deviation_note: { type: string, nullable: true }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /trades/{trade_id}/costs:
    patch:
      tags: [Trades]
      summary: Record trade costs
      description: "Record or update commission and spread costs (GBP) for a closed trade. Both fields optional. Populates net_r_multiple on GET /trades. ST-03 (EPIC-02, v6.0) — BLG-FEAT-20. Spec: docs/specs/api_contracts/trade_endpoints.md"
      parameters:
        - name: trade_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commission_gbp: { type: number, nullable: true, description: Total commission paid in GBP }
                spread_cost_gbp: { type: number, nullable: true, description: Estimated bid-ask spread cost in GBP }
      responses:
        "200":
          description: Costs recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      trade_id: { type: string, format: uuid }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /trades/export/csv:
    get:
      tags: [Trades]
      summary: Export trade history as CSV
      description: "Export full closed trade history as a downloadable CSV file. Returns all trades; no date filter in v1.6.1. Response is text/csv with attachment disposition. Canonical contract: docs/specs/api_contracts/trade_endpoints.md"
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                description: "UTF-8 CSV with header row. Columns: ticker, market, entry_date, exit_date, shares, entry_price, exit_price, pnl, pnl_pct, holding_days, exit_reason, tags (semicolon-separated), entry_note, exit_note."
        "500":
          $ref: "#/components/responses/InternalError"

  /cash/transaction:
    post:
      tags: [Cash]
      summary: Record cash transaction
      description: Record deposit or withdrawal for accurate P&L.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransactionRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkCashTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /cash/transactions:
    get:
      tags: [Cash]
      summary: List cash transactions
      parameters:
        - in: query
          name: order
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        "200":
          $ref: "#/components/responses/OkCashTransactions"
        "500":
          $ref: "#/components/responses/InternalError"

  /cash/summary:
    get:
      tags: [Cash]
      summary: Get cash flow summary
      responses:
        "200":
          $ref: "#/components/responses/OkCashSummary"
        "500":
          $ref: "#/components/responses/InternalError"

  /signals/generate:
    post:
      tags: [Signals]
      summary: Generate momentum signals
      parameters:
        - in: query
          name: lookback_days
          schema:
            type: integer
            default: 252
            minimum: 1
        - in: query
          name: top_n
          schema:
            type: integer
            default: 5
            minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/OkSignalsGenerate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /signals:
    get:
      tags: [Signals]
      summary: List signals
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [new, entered, dismissed, expired, already_held, allocation_insufficient]
      responses:
        "200":
          $ref: "#/components/responses/OkSignalsList"
        "500":
          $ref: "#/components/responses/InternalError"

  /signals/{signal_id}:
    patch:
      tags: [Signals]
      summary: Update signal status
      parameters:
        - in: path
          name: signal_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [entered, dismissed, expired, watchlisted]
      responses:
        "200":
          $ref: "#/components/responses/OkSignal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Signals]
      summary: Delete signal
      description: |
        Hard delete a signal record. Non-idempotent:
        a second call returns 404.
      parameters:
        - in: path
          name: signal_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/OkDelete"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/metrics:
    get:
      tags: [Analytics]
      summary: Get analytics metrics
      description: |
        Unified analytics endpoint returning all analytics data for a given period.
        All monetary values in analytics are GBP.
        When insufficient data exists (total_trades < min_required), the API returns 200
        with has_enough_data=false and empty metric objects.
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: string
            enum: [all_time, last_7_days, last_month, last_quarter, last_year, ytd]
            default: all_time
      responses:
        "200":
          $ref: "#/components/responses/OkAnalyticsMetrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/cohort:
    get:
      tags: [Analytics]
      summary: Get cohort analysis
      description: |
        Groups all closed trades by entry period (month/quarter/year) and returns
        per-cohort performance metrics: trade count, win rate, avg R-multiple (server-side),
        and total P&L in GBP. Fewer than 3 distinct periods returns has_enough_data=false.
        Canonical contract: docs/specs/api_contracts/analytics_endpoints.md §GET /analytics/cohort
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: string
            enum: [month, quarter, year]
            default: month
      responses:
        "200":
          description: Cohort analysis data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      period:
                        type: string
                        example: month
                      has_enough_data:
                        type: boolean
                      cohorts:
                        type: array
                        items:
                          type: object
                          properties:
                            period_label:
                              type: string
                              example: "Mar 2026"
                            trade_count:
                              type: integer
                            win_rate:
                              type: number
                              format: float
                            avg_r_multiple:
                              type: number
                              format: float
                              nullable: true
                            total_pnl:
                              type: number
                              format: float
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/r-multiple-distribution:
    get:
      tags: [Analytics]
      summary: Get canonical R-multiple distribution
      description: |
        Returns server-side R-multiple distribution across all closed trades.
        Formula: R = (exit_price - entry_price) / (entry_price - initial_stop_price).
        Requires positions.initial_stop via LEFT JOIN. Minimum 5 qualifying trades.
        Canonical contract: docs/specs/api_contracts/analytics_endpoints.md §GET /analytics/r-multiple-distribution
      responses:
        "200":
          description: R-multiple distribution data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      has_enough_data:
                        type: boolean
                      total_qualifying_trades:
                        type: integer
                      buckets:
                        type: array
                        items:
                          type: object
                          properties:
                            range:
                              type: string
                              example: "0R to 1R"
                            count:
                              type: integer
                      median_r:
                        type: number
                        format: float
                        nullable: true
                      pct_above_1r:
                        type: number
                        format: float
                        nullable: true
                      avg_winner_r:
                        type: number
                        format: float
                        nullable: true
                      avg_loser_r:
                        type: number
                        format: float
                        nullable: true
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/market-correlation:
    get:
      tags: [Analytics]
      summary: Get per-position Pearson correlation vs benchmark
      description: |
        Returns Pearson correlation coefficients between each open position and its
        relevant benchmark (SPY for US, ^FTSE for UK) over a configurable lookback.
        Also returns a portfolio-level equal-weighted average correlation.
        Results are cached with an 8-hour TTL. Yahoo Finance data source — graceful
        partial response if data unavailable for individual tickers.
        Canonical contract: docs/specs/api_contracts/analytics_endpoints.md §GET /analytics/market-correlation
      parameters:
        - name: lookback
          in: query
          required: false
          schema:
            type: integer
            default: 252
            minimum: 30
            maximum: 756
          description: Lookback window in trading days (default 252)
      responses:
        "200":
          description: Market correlation data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      correlations:
                        type: array
                        items:
                          type: object
                          properties:
                            ticker:
                              type: string
                            market:
                              type: string
                              enum: [UK, US]
                            benchmark:
                              type: string
                              enum: [SPY, FTSE]
                            correlation:
                              type: number
                              format: float
                              nullable: true
                            severity:
                              type: string
                              enum: [high, moderate, low, unknown]
                            lookback_days:
                              type: integer
                            data_points:
                              type: integer
                      portfolio_correlation:
                        type: object
                        properties:
                          value:
                            type: number
                            format: float
                            nullable: true
                          severity:
                            type: string
                          method:
                            type: string
                            example: equal_weighted_average
                      lookback_days:
                        type: integer
                      computed_at:
                        type: string
                        format: date-time
                      cached:
                        type: boolean
                      data_source:
                        type: string
                        example: Yahoo Finance
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/compliance-metrics:
    get:
      tags: [Analytics]
      summary: Get discipline and compliance scalars
      description: |
        Returns journal completion rate, stop exit rate, average position size,
        and closed trade count for the portfolio. Canonical contract:
        docs/specs/api_contracts/analytics_endpoints.md v2.3.0 §GET /analytics/compliance-metrics
      responses:
        "200":
          description: Compliance metrics returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      journal_completion_rate: { type: number, description: "% trades with notes" }
                      stop_exit_rate: { type: number, description: "% trades exited via stop" }
                      avg_position_size_pct: { type: number }
                      trade_count: { type: integer }
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/arc5-compliance:
    get:
      tags: [Analytics]
      summary: Get Arc 5 signal compliance metrics
      description: |
        Returns Arc 5 compliance metrics: validation pass/fail rate per rule,
        red flag event frequency, override rate, top rule breach, and trade plan
        adherence rate. Validation metrics from pre_entry_validation_log; event
        metrics from red_flag_events. period=7d (default) or 30d.
        Canonical contract: docs/specs/api_contracts/arc5_compliance_analytics.md
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d]
            default: 7d
          description: Rolling window for validation and event metrics
      responses:
        "200":
          description: Arc 5 compliance metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      period:
                        type: string
                        enum: [7d, 30d]
                      validation_pass_rate_by_rule:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            pass_rate:
                              type: number
                              format: float
                              nullable: true
                            pass_count:
                              type: integer
                            fail_count:
                              type: integer
                      events_per_week:
                        type: number
                        format: float
                      override_rate:
                        type: number
                        format: float
                        nullable: true
                      top_rule_breach:
                        type: string
                        nullable: true
                      trade_plan_adherence_rate:
                        type: number
                        format: float
                        nullable: true
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/tag-performance:
    get:
      tags: [Analytics]
      summary: Get win rate and average R-multiple per trade-plan tag
      description: |
        Returns per-tag performance (win rate, average R-multiple, trade count)
        for the requested trade-plan tags. Reads only trade_plans.trade_tags and
        existing closed-trade linkage — no dependency on trade_annotations/PO-02.
        ST-05, BLG-FEAT-52, v6.8.
        Canonical contract: docs/specs/api_contracts/analytics_endpoints.md
      parameters:
        - name: tags
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated trade-plan tags (e.g. "breakout,earnings-play")
      responses:
        "200":
          description: Per-tag performance
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tag:
                          type: string
                        win_rate:
                          type: number
                          format: float
                        avg_r_multiple:
                          type: number
                          format: float
                          nullable: true
                        trade_count:
                          type: integer
        "400":
          description: Missing tags parameter
        "404":
          description: Portfolio not found
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/trade-plan-completion-rate:
    get:
      tags: [Analytics]
      summary: Get trade plan completion rate
      description: |
        Returns plans_created, plans_completed, plans_abandoned, and
        completion_rate for the Performance Analytics page §21.
        plans_completed is derived via the
        trade_plans.position_id = trade_history.position_id equijoin
        (a closed trade exists for the plan's linked position).
        ST-01, BLG-FEAT-32, EPIC-01, v8.6.
        Canonical contract: docs/specs/api_contracts/analytics_endpoints.md
      responses:
        "200":
          description: Trade plan completion rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      plans_created:
                        type: integer
                      plans_completed:
                        type: integer
                      plans_abandoned:
                        type: integer
                      completion_rate:
                        type: number
                        format: float
                        nullable: true
        "404":
          description: Portfolio not found
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/behavioural-drift:
    get:
      tags: [Analytics]
      summary: Get SI-02 behavioural drift detection metrics
      description: |
        Returns 4 deterministic drift metrics over a 90-day rolling window:
        entry_timing_drift, sizing_adherence, consecutive_loss_sizing, regime_context.
        Requires ≥10 closed trades; returns status: "insufficient_data" otherwise.
        §13 PASS: display-only output, no automated recommendations, no ML inference.
        Canonical contract: docs/specs/api_contracts/behavioural_drift_contract.md
      responses:
        "200":
          description: SI-02 behavioural drift metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [insufficient_data, no_drift, drift_detected, error]
                      analysis_window_days:
                        type: integer
                        example: 90
                      trade_count_in_window:
                        type: integer
                      metrics:
                        type: array
                        items:
                          type: object
                          properties:
                            metric_id:
                              type: string
                              enum: [entry_timing_drift, sizing_adherence, consecutive_loss_sizing, regime_context]
                            label:
                              type: string
                            measured_value:
                              type: number
                              format: float
                              nullable: true
                            unit:
                              type: string
                              enum: [days, pct_of_portfolio, pct]
                            status:
                              type: string
                              enum: [ok, approaching, breached, insufficient_data]
                            threshold_value:
                              type: number
                              format: float
                            deviation_pct:
                              type: number
                              format: float
                              nullable: true
                            advisory_note:
                              type: string
                              nullable: true
                      computed_at:
                        type: string
                        format: date-time
                      insufficient_data_streak_days:
                        type: integer
                        description: Present only when status is insufficient_data (v1.1, ST-05, BLG-FEAT-86).
                      streak_capped:
                        type: boolean
                        description: Present only when status is insufficient_data.
                      trade_count_trend:
                        type: string
                        enum: [increasing, decreasing, flat]
                        description: Present only when status is insufficient_data.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ai/journal-summary:
    post:
      tags: [AI]
      summary: Summarise trade journal notes via LLM
      description: |
        Accepts trade IDs or a date range; retrieves entry/exit journal notes from
        closed trades and calls an external LLM API (Anthropic) to produce a plain-text
        summary of themes and patterns. AI output is display-only and must NOT be used
        in any signal, scoring, or recommendation calculation. SRB-v1.7 CONDITIONALLY COMPLIANT.
        Returns summary=null with informational message when LLM unavailable (no 500).
        Canonical contract: docs/specs/api_contracts/ai_endpoints.md v1.0 §POST /ai/journal-summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trade_ids:
                  type: array
                  items:
                    type: integer
                  nullable: true
                  description: Closed trade IDs to summarise. If provided, date range is ignored.
                date_from:
                  type: string
                  format: date
                  nullable: true
                  description: Start date for trade filter (inclusive).
                date_to:
                  type: string
                  format: date
                  nullable: true
                  description: End date for trade filter (inclusive).
      responses:
        "200":
          description: AI journal summary (or null if unavailable/no notes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                    nullable: true
                    description: LLM-generated summary text. Null if unavailable or no notes.
                  trade_count:
                    type: integer
                    description: Number of closed trades whose notes were included.
                  model:
                    type: string
                    nullable: true
                    description: LLM model identifier used.
                  cached:
                    type: boolean
                    description: Reserved for future caching; always false in v1.0.
                  message:
                    type: string
                    nullable: true
                    description: Informational message when summary is null.
        "422":
          description: Neither trade_ids nor a date range provided.
        "500":
          $ref: "#/components/responses/InternalError"

  /ai/journal-summary/history:
    get:
      tags: [AI]
      summary: Query AI journal summary audit log
      description: |
        Returns metadata records for past POST /ai/journal-summary calls.
        No summary text stored — audit metadata only. Canonical contract:
        docs/specs/api_contracts/ai_endpoints.md v1.3 §GET /ai/journal-summary/history
      parameters:
        - name: trade_id
          in: query
          schema: { type: integer }
          description: Filter by trade ID
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Audit records returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      records: { type: array, items: { type: object } }
                      count: { type: integer }
        "422":
          description: limit out of range

  /ai/check-daily-cost:
    post:
      tags: [AI]
      summary: Check daily Claude API spend against threshold and alert via Telegram
      description: |
        Checks today's Claude API spend (from gemini_audit_log) against the configured
        AI_DAILY_COST_THRESHOLD (default $1.00/day). Sends Telegram alert if exceeded.
        Intended for daily scheduler invocation (Render cron / external scheduler).
        Canonical contract: docs/specs/api_contracts/ai_endpoints.md v1.1 §POST /ai/check-daily-cost
      responses:
        "200":
          description: Daily cost check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_cost_usd:
                    type: number
                    format: float
                    description: Sum of estimated_cost_usd in gemini_audit_log for today.
                  request_count:
                    type: integer
                    description: Number of Claude API requests logged today.
                  threshold_usd:
                    type: number
                    format: float
                    description: Configured daily cost threshold.
                  threshold_exceeded:
                    type: boolean
                    description: true when total_cost_usd >= threshold_usd.
                  alert_sent:
                    type: boolean
                    description: true when threshold exceeded and Telegram alert was delivered.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /ai/claude-audit-log:
    get:
      tags: [AI]
      summary: Query the Claude API audit trail
      description: |
        Returns the most recent entries from the claude_audit_log table — the immutable
        audit trail of all Claude API calls made by the application. Intended for
        compliance monitoring and cost review.
        Canonical contract: docs/specs/api_contracts/ai_endpoints.md v1.6 §GET /ai/claude-audit-log
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of records to return (newest first).
        - name: endpoint
          in: query
          required: false
          schema:
            type: string
          description: v7.0 ST-11 (BLG-BE-51) — exact-match filter on the endpoint field (e.g. "POST /ai/daily-briefing"). Combines with date_from/date_to.
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: v7.0 ST-11 (BLG-BE-51) — inclusive lower bound (YYYY-MM-DD) applied to generated_at. Combines with date_to/endpoint.
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: v7.0 ST-11 (BLG-BE-51) — inclusive upper bound (YYYY-MM-DD) applied to generated_at. Combines with date_from/endpoint.
      responses:
        "200":
          description: Claude API audit log records
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            endpoint:
                              type: string
                              description: API endpoint that triggered the Claude call.
                            model_id:
                              type: string
                              description: Claude model ID used.
                            prompt_version:
                              type: string
                              description: Internal prompt version tag.
                            input_tokens:
                              type: integer
                              nullable: true
                            output_tokens:
                              type: integer
                              nullable: true
                            cost_usd:
                              type: number
                              format: float
                              nullable: true
                            generated_at:
                              type: string
                              format: date-time
                      count:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: limit parameter out of range.
        "500":
          $ref: "#/components/responses/InternalError"

  /ai/monthly-cost:
    get:
      tags: [AI]
      summary: Current calendar month's Claude API spend total
      description: |
        Returns the current calendar month's Claude API spend, aggregated from
        claude_audit_log. Read-only, no side effects — unlike POST
        /ai/check-daily-cost, which sends a Telegram alert as a side effect
        and is not suitable for a page-load fetch. Claude is the only AI
        provider integrated in this codebase.
        Canonical contract: docs/specs/api_contracts/ai_endpoints.md v1.7 §GET /ai/monthly-cost
      responses:
        "200":
          description: Current month's Claude API cost total
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total_cost_usd:
                            type: number
                            format: float
                          request_count:
                            type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /ai/spend-trend:
    get:
      tags: [AI]
      summary: Claude API spend for the last 6 release cycles (ST-06, EPIC-06, v7.8)
      description: |
        Returns Claude API spend bucketed by release-cycle date window, oldest
        to newest, for the Settings page's AI spend trend chart. Sourced from
        existing claude_audit_log data (no new data collection) -- cycle
        boundaries parsed from docs/product/changelog.md's version headings.
        Returns fewer than 6 entries if fewer release cycles exist; no
        zero-padding.
        Canonical contract: docs/specs/api_contracts/ai_endpoints.md v1.8 §GET /ai/spend-trend
      responses:
        "200":
          description: Per-release-cycle Claude API spend array
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            version:
                              type: string
                              example: v7.8
                            spend_usd:
                              type: number
                              format: float
                              example: 1.45
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /ai/daily-briefing:
    post:
      tags: [AI]
      summary: Generate AI daily portfolio briefing
      description: |
        Assembles live portfolio context (positions, signals, regime, trailing stops) and
        calls claude-sonnet-4-6 to produce a plain-English summary and ordered action list.
        Advisory-only — display-only, not integrated with trade execution. §13 PASS.
        Rate limit: 10 requests/minute/IP; 429 + Retry-After returned when exceeded.
        Canonical contract: docs/specs/api_contracts/ai_endpoints.md v1.5 §POST /ai/daily-briefing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: AI daily briefing response
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                    nullable: true
                    description: Plain-English portfolio summary (2-4 sentences).
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [EXIT, ENTER, MONITOR, HOLD]
                        ticker:
                          type: string
                        description:
                          type: string
                  generated_at:
                    type: string
                    format: date-time
                  advisory:
                    type: boolean
                    description: Always true. Client must verify.
                  model:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Rate limit exceeded (10 req/min/IP). Retry-After header present.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "Rate limit exceeded. Try again later."
        "500":
          $ref: "#/components/responses/InternalError"

  /ai/chat:
    post:
      tags: [AI]
      summary: Stateless AI trade advisor chat
      description: |
        Accepts a user question and returns a response grounded in live portfolio and
        signal state. Stateless per request — no session history stored server-side.
        Advisory-only — display-only, not integrated with trade execution. §13 PASS.
        Rate limit: 30 requests/minute/IP; 429 + Retry-After returned when exceeded.
        Canonical contract: docs/specs/api_contracts/ai_endpoints.md v1.5 §POST /ai/chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  description: The user's question.
                context:
                  type: object
                  nullable: true
                  properties:
                    ticker:
                      type: string
                    position_id:
                      type: string
                      format: uuid
      responses:
        "200":
          description: AI advisor response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: AI-generated answer grounded in live portfolio state.
                  advisory:
                    type: boolean
                    description: Always true.
                  model:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: question field missing.
        "429":
          description: Rate limit exceeded (30 req/min/IP). Retry-After header present.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "Rate limit exceeded. Try again later."
        "500":
          $ref: "#/components/responses/InternalError"

  /digest/weekly:
    get:
      tags: [Digest]
      summary: Get 7-day weekly trading digest
      description: |
        Returns a 7-day summary of realised P&L, unrealised P&L delta, alert counts,
        compliance score (current and 7-day baseline), and data staleness.
        All fields are raw numeric or boolean values — no generated text or interpretation.
        Canonical contract: docs/specs/api_contracts/digest_endpoints.md v0.1
      responses:
        "200":
          description: Weekly digest data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      realised_pnl_7d:
                        type: number
                        format: float
                        description: Sum of P&L for trades closed in the last 7 days (GBP)
                      unrealised_pnl_delta_7d:
                        type: number
                        format: float
                        nullable: true
                        description: Change in unrealised P&L over 7 days from portfolio snapshots
                      alerts_fired_7d:
                        type: integer
                        description: Count of notifications created in the last 7 days
                      alerts_dismissed_7d:
                        type: integer
                        description: Count of notifications marked read in the last 7 days
                      compliance_score_current:
                        type: number
                        format: float
                        description: Journal completion rate across all closed trades (0-100)
                      compliance_score_7d_ago:
                        type: number
                        format: float
                        description: Journal completion rate for trades closed before the 7-day window (0-100)
                      staleness_hours:
                        type: number
                        format: float
                        nullable: true
                        description: Hours since last portfolio snapshot; null if no snapshots
                      as_of_utc:
                        type: string
                        format: date-time
                        description: UTC timestamp this response was computed
        "500":
          $ref: "#/components/responses/InternalError"

  /digest/si05/send:
    post:
      tags: [Digest]
      summary: Trigger SI-05 Phase 1 strategy integrity Telegram digest
      description: |
        Sends the weekly SI-05 strategy integrity digest via Telegram.
        Fetches arc5-compliance data (SI-01 pre-entry validation + SI-03 red flag journal)
        and delivers a MarkdownV2-formatted message per BLG-GOV-86.
        Intended for weekly cron/scheduled invocation. Safe to retry.
        Canonical contract: docs/specs/api_contracts/digest_endpoints.md v0.2
        ST-01 (SI-05 Phase 1, EPIC-01, v5.1)
      requestBody:
        required: false
      responses:
        "200":
          description: Digest send result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  sent:
                    type: boolean
                    description: Whether the Telegram message was delivered
                  message_length:
                    type: integer
                    description: Length of the formatted message in characters
                  error:
                    type: string
                    nullable: true
                    description: Error description if not sent; null on success

  /validate/calculations:
    post:
      tags: [Analytics]
      summary: Validate analytics calculations
      description: |
        Smoke-tests analytics calculations against a fixed internal test dataset.
        Does not write to business data.
        Each validation result includes a severity field (critical/high/medium/low).
        The summary includes a by_severity breakdown.
        Canonical contract: docs/specs/api_contracts/analytics_endpoints.md
      responses:
        "200":
          $ref: "#/components/responses/OkValidation"
        "500":
          $ref: "#/components/responses/InternalError"

  /market/status:
    get:
      tags: [Market]
      summary: Get market regime status
      description: |
        Returns current market regime (SPY and FTSE vs 200-day MA) and live GBP/USD FX rate.
        Canonical contract: docs/specs/api_contracts/market_endpoints.md v0.1
      responses:
        "200":
          $ref: "#/components/responses/OkMarketStatus"
        "500":
          $ref: "#/components/responses/InternalError"

  /settings:
    get:
      tags: [Settings]
      summary: Get strategy settings
      responses:
        "200":
          $ref: "#/components/responses/OkSettings"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Settings]
      summary: Create settings record
      description: |
        Creates a new settings record. Used to initialise settings if none exist.
        Canonical contract: docs/specs/api_contracts/settings_endpoints.md v1.1.0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkUpdateSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /settings/{settings_id}:
    patch:
      tags: [Settings]
      summary: Update strategy settings by ID
      description: |
        Updates one or more settings fields on an existing record.
        Fields not provided remain unchanged.
        Canonical contract: docs/specs/api_contracts/settings_endpoints.md v1.1.0
      parameters:
        - in: path
          name: settings_id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the settings record to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkUpdateSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /changelog/latest:
    get:
      tags: [Changelog]
      summary: Most recent release's changelog summary (ST-01, EPIC-01, v7.8)
      description: |
        Returns the most recent release's version label and curated
        User Impact copy, parsed server-side from docs/product/changelog.md.
        `data` is null if no parseable version section (or no populated
        User Impact cell in it) exists.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    nullable: true
                    type: object
                    properties:
                      version:
                        type: string
                        example: v7.8
                      changes:
                        type: array
                        items:
                          type: string

  /health:
    get:
      tags: [Health]
      summary: Operational health check (v2.2)
      description: |
        Returns DB connectivity and timestamps of last market status check and
        last alert evaluation. Schema updated in v2.2 (ST-08).
      security: []
      responses:
        "200":
          $ref: "#/components/responses/OkOperationalHealth"
        "500":
          $ref: "#/components/responses/InternalError"

  /health/detailed:
    get:
      tags: [Health]
      summary: Detailed health check
      responses:
        "200":
          $ref: "#/components/responses/OkHealthDetailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /health/scheduler:
    get:
      tags: [Health]
      summary: Nightly computation job health (ST-13, BLG-OPS-79)
      description: |
        Returns last-run status, timestamps, and any error details for each nightly
        computation job: trailing_stop, rebalance_exit, inv_vol_sizing.
        Trigger mechanism: GitHub Actions external cron (not an in-process scheduler).
        Status is in-memory and resets on process restart.
        Contract: docs/specs/api_contracts/health_endpoints.md
      security:
        - ApiKey: []
      responses:
        "200":
          description: Scheduler health status
          content:
            application/json:
              schema:
                type: object
                required: [scheduler_type, overall_status, jobs]
                properties:
                  scheduler_type:
                    type: string
                    example: github_actions_external_cron
                  overall_status:
                    type: string
                    enum: [ok, degraded]
                  jobs:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        last_run_utc:
                          type: string
                          format: date-time
                          nullable: true
                        last_status:
                          type: string
                          enum: [ok, error, never_run]
                        last_error:
                          type: string
                          nullable: true
                        detail:
                          type: object
                          nullable: true
                  note:
                    type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /health/database:
    get:
      tags: [Health]
      summary: Database size monitoring (BLG-OPS-09)
      description: |
        Returns current database size, percentage of Render free tier limit (256 MB) used,
        and configured alert threshold. Triggers a Telegram notification (notification-only,
        no automated cleanup) if usage is at or above the threshold.
        Contract: docs/specs/api_contracts/health_endpoints.md v1.2
      responses:
        "200":
          $ref: "#/components/responses/OkDatabaseSize"
        "500":
          $ref: "#/components/responses/InternalError"

  /test/endpoints:
    post:
      tags: [Health]
      summary: Test all endpoints
      description: Runs a smoke test against all registered endpoints and returns results.
      responses:
        "200":
          $ref: "#/components/responses/OkEndpointTest"
        "500":
          $ref: "#/components/responses/InternalError"

  /test/quick-health:
    get:
      tags: [Health]
      summary: Quick health check
      description: |
        Tests only critical endpoints (Health, Settings, Portfolio). Faster than
        the full POST /test/endpoints suite. Canonical contract:
        docs/specs/api_contracts/health_endpoints.md §GET /test/quick-health
      responses:
        "200":
          description: Quick health check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [healthy, degraded] }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        healthy: { type: boolean }
                        response_time_ms: { type: number }
                        status_code: { type: integer }
                        error: { type: string }

  /test/rate-limit-scenarios:
    post:
      tags: [Health]
      summary: Verify AI endpoint rate-limiting logic
      description: |
        Verifies rate limiting logic for POST /ai/daily-briefing (limit=10) and
        POST /ai/chat (limit=30) using isolated test keys — does not affect live
        traffic. Canonical contract:
        docs/specs/api_contracts/health_endpoints.md §POST /test/rate-limit-scenarios
      responses:
        "200":
          description: Rate-limit scenario results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        endpoint: { type: string }
                        status: { type: string, enum: [pass, fail] }
                        error: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"

  /news/{ticker}:
    get:
      tags: [News]
      summary: Get recent news headlines for a ticker
      description: |
        Fetches up to 10 recent news headlines from Alpaca for US tickers.
        Display-only — no sentiment scoring. UK tickers return empty headlines.
        Canonical contract: docs/specs/api_contracts/news_endpoints.md v1.0 §GET /news/{ticker}
      parameters:
        - name: ticker
          in: path
          required: true
          schema: { type: string }
          description: Ticker symbol (e.g. AAPL)
        - name: market
          in: query
          schema: { type: string, enum: [US, UK], default: US }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 10 }
      responses:
        "200":
          description: News headlines returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      ticker: { type: string }
                      market: { type: string }
                      headlines: { type: array, items: { type: object } }
                      count: { type: integer }
        "500":
          $ref: "#/components/responses/InternalError"

  /watchlist:
    get:
      tags: [Watchlist]
      summary: List all watchlist entries
      description: |
        Returns all watchlist entries for the portfolio with computed signal_status.
        Canonical contract: docs/specs/api_contracts/watchlist_endpoints.md v1.2 §GET /watchlist
      responses:
        "200":
          description: Watchlist entries returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data: { type: array, items: { type: object } }
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Watchlist]
      summary: Add a ticker to the watchlist
      description: |
        Adds a ticker to the portfolio watchlist. Returns 409 if already present.
        Canonical contract: docs/specs/api_contracts/watchlist_endpoints.md v1.0 §POST /watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker, market]
              properties:
                ticker: { type: string }
                market: { type: string, enum: [US, UK] }
                target_entry_price: { type: number }
                initial_stop_price: { type: number }
                current_stop_price: { type: number }
      responses:
        "201":
          description: Watchlist entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data: { type: object }
        "400":
          description: Invalid request
        "409":
          description: Ticker already in watchlist
        "500":
          $ref: "#/components/responses/InternalError"

  /watchlist/tags:
    get:
      tags: [Watchlist]
      summary: List unique watchlist tags (autocomplete)
      description: |
        Returns unique tags across all watchlist entries, for the Bulk Tag autocomplete.
        Canonical contract: docs/specs/api_contracts/watchlist_endpoints.md v1.1 §GET /watchlist/tags
      responses:
        "200":
          description: Unique tags list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data: { type: array, items: { type: string } }
        "500":
          $ref: "#/components/responses/InternalError"

  /watchlist/bulk-tag:
    post:
      tags: [Watchlist]
      summary: Bulk-tag watchlist entries
      description: |
        Adds tags to each selected watchlist entry's existing tag set (union, not replace).
        Canonical contract: docs/specs/api_contracts/watchlist_endpoints.md v1.1 §POST /watchlist/bulk-tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTagRequest"
      responses:
        "200":
          description: Bulk-tag result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BulkActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /watchlist/bulk:
    delete:
      tags: [Watchlist]
      summary: Bulk-delete watchlist entries
      description: |
        Removes each selected watchlist entry in a single call.
        Canonical contract: docs/specs/api_contracts/watchlist_endpoints.md v1.1 §DELETE /watchlist/bulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIdsRequest"
      responses:
        "200":
          description: Bulk-delete result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BulkActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /watchlist/{entry_id}:
    delete:
      tags: [Watchlist]
      summary: Remove a watchlist entry
      description: |
        Removes a watchlist entry by ID. Not idempotent — returns 404 on second call.
        Canonical contract: docs/specs/api_contracts/watchlist_endpoints.md v1.0 §DELETE /watchlist/{entry_id}
      parameters:
        - name: entry_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Entry deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data: { type: object }
        "404":
          description: Entry not found
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Watchlist]
      summary: Update watchlist entry price fields, or reset its staleness clock
      description: |
        Updates price fields on a watchlist entry, or resets its staleness clock
        via added_at (the "Keep" action). ticker and market are read-only.
        Canonical contract: docs/specs/api_contracts/watchlist_endpoints.md v1.2 §PATCH /watchlist/{entry_id}
      parameters:
        - name: entry_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_entry_price: { type: number }
                initial_stop_price: { type: number }
                current_stop_price: { type: number }
                added_at:
                  type: boolean
                  description: Reset trigger, not a client-supplied timestamp — any non-null value resets the server-side staleness clock to now.
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data: { type: object }
        "404":
          description: Entry not found
        "500":
          $ref: "#/components/responses/InternalError"

  # ─── External: Alpaca Markets API (BLG-SPEC-22 / ST-02) ───────────────────────
  # These paths document outbound calls FROM this system TO Alpaca.
  # Canonical contract: docs/specs/api_contracts/alpaca_integration_contract.md
  # Base URL override: https://data.alpaca.markets (not served by this system's backend)
  /v2/stocks/{symbol}/bars:
    get:
      tags:
        - External - Alpaca
      summary: Get OHLCV bars for a US ticker (Alpaca Markets API v2)
      description: |
        **External API call.** Fetches historical daily OHLCV bars from Alpaca Markets.
        Used by DS-05 to replace Yahoo Finance for US market tickers.
        Canonical contract: docs/specs/api_contracts/alpaca_integration_contract.md
        Base URL: https://data.alpaca.markets (not this system's backend)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: US ticker symbol (e.g. NVDA, AAPL)
        - name: timeframe
          in: query
          required: true
          schema:
            type: string
            enum: ["1Day"]
          description: Bar timeframe. Use "1Day" for daily bars.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 30
          description: Number of bars to return. 30 recommended for ATR calculation.
      responses:
        "200":
          description: OHLCV bars response
          content:
            application/json:
              schema:
                type: object
                properties:
                  bars:
                    type: array
                    items:
                      type: object
                      properties:
                        t: { type: string, format: date-time, description: "Bar open timestamp (UTC)" }
                        o: { type: number, description: "Open price (USD)" }
                        h: { type: number, description: "High price (USD)" }
                        l: { type: number, description: "Low price (USD)" }
                        c: { type: number, description: "Close price (USD)" }
                        v: { type: integer, description: "Volume" }
                        vw: { type: number, description: "VWAP" }
                        n: { type: integer, description: "Trade count" }
                  symbol: { type: string }
                  next_page_token: { type: string, nullable: true }
        "403":
          description: Invalid credentials
        "404":
          description: Symbol not found — apply fallback to Yahoo Finance
        "429":
          description: Rate limit exceeded — retry with exponential backoff

  /v1beta1/news:
    get:
      tags:
        - External - Alpaca
      summary: Get news headlines for US tickers (Alpaca News API v1beta1)
      description: |
        **External API call.** Fetches recent news headlines from Alpaca News API.
        Used by DS-06 for display-only ticker-level news panel.
        §13 COMPLIANT — display-only, no sentiment scoring, no advisory.
        Canonical contract: docs/specs/api_contracts/alpaca_integration_contract.md
        Base URL: https://data.alpaca.markets (not this system's backend)
      parameters:
        - name: symbols
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated ticker symbols (e.g. "NVDA,AAPL")
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
          description: Maximum headlines per symbol
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: ["desc", "asc"]
            default: "desc"
          description: Sort order (newest first by default)
      responses:
        "200":
          description: News headlines response
          content:
            application/json:
              schema:
                type: object
                properties:
                  news:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        headline: { type: string }
                        author: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                        summary: { type: string, nullable: true }
                        url: { type: string, nullable: true }
                        symbols: { type: array, items: { type: string } }
                        source: { type: string, nullable: true }
                  next_page_token: { type: string, nullable: true }
        "403":
          description: Invalid credentials
        "429":
          description: Rate limit exceeded — serve empty news panel

  # ─── Ticker Universe API (DS-01 / ST-01) ────────────────────────────────────
  # Manages the set of tickers eligible for screener runs.
  # Canonical contract: docs/specs/api_contracts/screener_api_contract.md
  /ticker-universe:
    get:
      tags:
        - Screener
      summary: List tickers in screener universe
      description: |
        Returns tickers eligible for screener runs.
        Filterable by market (UK|US) and active status.
      parameters:
        - name: market
          in: query
          required: false
          schema:
            type: string
            enum: [UK, US]
          description: Filter by market
        - name: active_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Return only active tickers (default true)
      responses:
        "200":
          description: List of tickers
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ticker: { type: string }
                        market: { type: string, enum: [UK, US] }
                        active: { type: boolean }
                        sector: { type: string, nullable: true }
                        industry: { type: string, nullable: true }
                        company_name: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
        "400":
          description: Invalid market value
    post:
      tags:
        - Screener
      summary: Add a ticker to the screener universe
      description: |
        Adds a ticker. Re-activates soft-deleted tickers on conflict.
        Returns 400 if market is not UK or US, or ticker is blank.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker, market]
              properties:
                ticker: { type: string, maxLength: 20 }
                market: { type: string, enum: [UK, US] }
                sector: { type: string, nullable: true }
                industry: { type: string, nullable: true }
      responses:
        "201":
          description: Ticker added or re-activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      ticker: { type: string }
                      market: { type: string }
                      active: { type: boolean }
                      sector: { type: string, nullable: true }
                      industry: { type: string, nullable: true }
                      company_name: { type: string, nullable: true }
                      created_at: { type: string, format: date-time }
        "400":
          description: Invalid ticker or market
  /ticker-universe/{ticker}:
    delete:
      tags:
        - Screener
      summary: Remove a ticker from the screener universe
      description: Soft-deletes a ticker (sets active=FALSE). Returns 404 if not found or already inactive.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          description: Ticker symbol (e.g. AAPL, HSBA.L)
      responses:
        "200":
          description: Ticker deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "404":
          description: Ticker not found or already inactive

  # ─── Screener API (BLG-SPEC-23 / ST-03) ────────────────────────────────────
  # Internal screener endpoints served by this system's backend.
  # Canonical contract: docs/specs/api_contracts/screener_api_contract.md
  /screener/results:
    get:
      tags:
        - Screener
      summary: Get latest screener results
      description: |
        Returns the results of the most recent completed screener run.
        Results are ordered by signal_score descending.
        Canonical contract: docs/specs/api_contracts/screener_api_contract.md
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Number of results to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Pagination offset
        - name: market
          in: query
          required: false
          schema:
            type: string
            enum: ["US", "UK", "all"]
            default: "all"
          description: Filter by market
        - name: run_id
          in: query
          required: false
          schema:
            type: string
          description: Return results from a specific run (UUID). Omit for latest run.
      responses:
        "200":
          description: Screener results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        description: Screener result records (see screener_results_schema.md)
                      run_id: { type: string }
                      run_timestamp: { type: string, format: date-time }
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                      degraded_run: { type: boolean, description: "true when >20% of tickers returned no OHLCV data" }
                      failure_rate: { type: number, format: float, description: "Fraction of tickers with no OHLCV data (0.0–1.0)" }
                      tickers_requested: { type: integer, description: "Number of tickers the screener attempted to evaluate" }
                      tickers_loaded: { type: integer, description: "Number of tickers that successfully returned OHLCV data" }
                      tickers_failed: { type: array, items: { type: string }, description: "Tickers that failed to load OHLCV data" }
                      run_quality: { type: string, enum: [FULL, DEGRADED, FAILED], description: "FULL (≤20% failure), DEGRADED (>20%), FAILED (no tickers loaded)" }
                      last_full_run_utc: { type: string, format: date-time, nullable: true, description: "Timestamp of most recent FULL run. null if no FULL run recorded yet" }

  /screener/run:
    post:
      tags:
        - Screener
      summary: Trigger a new screener run
      description: |
        Triggers a new screener run against the configured ticker universe.
        Returns the run_id immediately; results available via GET /screener/results?run_id={run_id}.
        Canonical contract: docs/specs/api_contracts/screener_api_contract.md
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ticker_universe:
                  type: array
                  items:
                    type: string
                  description: Optional override of ticker universe. If omitted, uses configured default universe.
      responses:
        "202":
          description: Screener run accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      run_id: { type: string, description: "UUID of the initiated run" }
                      status: { type: string, enum: ["accepted", "running"] }
        "409":
          description: A screener run is already in progress

  /screener/regime-distribution:
    get:
      tags:
        - Screener
      summary: Get aggregate market regime distribution over screener run history
      description: |
        Returns the aggregate risk-on/risk-off regime distribution over screener run
        history for the requested rolling window (30d / 60d / all). Sourced from
        screener_runs.regime_us/regime_uk (one row per run), not screener_results
        (one row per ticker), to avoid weighting by ticker count per market.
        ST-21 (BLG-FEAT-29, EPIC-06, v8.5).
        Canonical contract: docs/specs/api_contracts/screener_api_contract.md
      parameters:
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: ["30d", "60d", "all"]
            default: "30d"
      responses:
        "200":
          description: Regime distribution for the requested window
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      window: { type: string, enum: ["30d", "60d", "all"] }
                      run_count: { type: integer, description: "Number of screener_runs rows within the window" }
                      total_observations: { type: integer, description: "Total per-market regime observations counted (up to 2 per run)" }
                      risk_on_count: { type: integer }
                      risk_off_count: { type: integer }
                      risk_on_pct: { type: number, nullable: true, description: "Percentage, 1 decimal place. Null when total_observations is 0" }
                      risk_off_pct: { type: number, nullable: true }
        "400":
          description: Invalid window parameter

  /trade-plans:
    post:
      summary: Create a new trade plan
      tags: [Trade Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker, market]
              properties:
                ticker: { type: string }
                market: { type: string, enum: [US, UK] }
                position_id: { type: string, format: uuid, nullable: true }
                setup_type: { type: string, nullable: true, enum: [Breakout, "Pullback to MA", "Momentum Continuation", "Mean Reversion", "Catalyst-driven", Other] }
                setup_thesis: { type: string, nullable: true }
                entry_rationale: { type: string, nullable: true }
                regime_context_at_entry: { type: string, nullable: true }
                r_target: { type: number, nullable: true }
                early_exit_conditions: { type: string, nullable: true }
                confirmation_criteria: { type: string, nullable: true }
                checklist_completed: { type: boolean, default: false }
                checklist_items: { type: array, items: { type: object } }
                status: { type: string, enum: [draft, active, closed], default: draft }
                pre_entry_override_acknowledged: { type: boolean, nullable: true }
                idempotency_key: { type: string, maxLength: 200, nullable: true }
      responses:
        "201":
          description: Trade plan created
    get:
      summary: List trade plans
      tags: [Trade Plans]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [draft, active, closed] }
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a prior response's next_cursor. Additive/opt-in — omit for unpaginated behaviour (backend_engineering_patterns.md §Cursor-based pagination pattern).
          schema: { type: string, nullable: true }
        - name: limit
          in: query
          required: false
          description: Page size. When provided, response includes next_cursor (null when no further page).
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: List of trade plans. When `limit` is supplied, includes `next_cursor` (string | null).

  /trade-plans/{id}:
    get:
      summary: Get trade plan by ID
      tags: [Trade Plans]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Trade plan
        "404":
          description: Not found
    put:
      summary: Update trade plan
      tags: [Trade Plans]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                setup_type: { type: string, nullable: true, enum: [Breakout, "Pullback to MA", "Momentum Continuation", "Mean Reversion", "Catalyst-driven", Other] }
                setup_thesis: { type: string, nullable: true }
                entry_rationale: { type: string, nullable: true }
                status: { type: string, enum: [draft, active, closed] }
                pre_entry_override_acknowledged: { type: boolean, nullable: true }
      responses:
        "200":
          description: Updated trade plan
    delete:
      summary: Delete trade plan
      tags: [Trade Plans]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted

  /trade-plans/by-position/{position_id}:
    get:
      summary: Get trade plans linked to a position
      tags: [Trade Plans]
      parameters:
        - name: position_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Trade plans for position

  /trade-plans/generate-plan:
    post:
      summary: Generate a full trade plan via Claude Haiku 4.5
      description: |
        Calls Claude Haiku 4.5 to generate all plan fields (setup_thesis, entry_rationale,
        confirmation_criteria, early_exit_conditions, regime_context_at_entry, r_target)
        from a ticker and optional signal data. No existing plan record required.
        Returns available=true with fields on success; available=false with error on
        graceful degradation (no API key or API failure).
        Canonical contract: docs/specs/api_contracts/ai_thesis_generation.md v2.1.0
      tags: [Trade Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker]
              properties:
                ticker:
                  type: string
                  description: Ticker symbol (e.g. AAPL, BARC.L)
                market:
                  type: string
                  enum: [US, UK]
                  default: US
                setup_type:
                  type: string
                  nullable: true
                signal_data:
                  type: object
                  nullable: true
                  properties:
                    signal_type: { type: string }
                    momentum_percent: { type: number }
                    atr_multiple: { type: number }
                    r_target: { type: number }
                    price_vs_50d_ma: { type: number }
                    regime: { type: string }
                    signal_score: { type: number }
      responses:
        "200":
          description: Generated plan fields (available=true) or graceful error (available=false when key absent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  fields:
                    type: object
                    properties:
                      setup_thesis: { type: string }
                      entry_rationale: { type: string }
                      confirmation_criteria: { type: string }
                      early_exit_conditions: { type: string }
                      regime_context_at_entry: { type: string }
                      r_target: { type: number, nullable: true }
                  model_version: { type: string }
                  prompt_version: { type: string }
                  error: { type: string }
        "500":
          description: Unexpected server error

  /trade-plans/{plan_id}/generate-thesis:
    post:
      summary: Generate a setup thesis via Claude Haiku 4.5
      description: |
        Calls Claude Haiku 4.5 to generate a concise setup thesis for an existing trade plan.
        Returns available=true with thesis text on success; available=false with error
        on graceful degradation (no API key or API failure).
        Canonical contract: docs/specs/api_contracts/ai_thesis_generation.md v2.1.0
      tags: [Trade Plans]
      parameters:
        - name: plan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Generated thesis (available=true) or graceful error (available=false when key absent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: object
                    properties:
                      available: { type: boolean }
                      thesis: { type: string }
                      model_version: { type: string }
                      prompt_version: { type: string }
                      input_hash: { type: string }
                      output_hash: { type: string }
                      error: { type: string }
        "404":
          description: Trade plan not found

  /trade-plans/tags:
    get:
      tags: [Trade Plans]
      summary: Get all unique trade-plan tags for autocomplete
      description: |
        Returns unique tags used across trade_plans.trade_tags for the portfolio.
        Mirrors GET /positions/tags. Data-independent from the existing
        position/journal tags. ST-05, BLG-FEAT-52, v6.8.
      responses:
        "200":
          description: List of unique trade-plan tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /trade-plans/bulk-tag:
    post:
      tags: [Trade Plans]
      summary: Bulk-tag trade plans
      description: |
        Adds tags to each selected trade plan's existing trade_tags (union, not replace).
        Canonical contract: docs/specs/api_contracts/trade_plan_endpoints.md v0.7 §POST /trade-plans/bulk-tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTagRequest"
      responses:
        "200":
          description: Bulk-tag result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BulkActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /trade-plans/bulk-archive:
    put:
      tags: [Trade Plans]
      summary: Bulk-archive (abandon) trade plans
      description: |
        Abandons each selected trade plan, reusing the existing single-plan abandonment
        transition (§8). Plans with status='active' are excluded and reported in `failed`
        with reason 'active_status_excluded'.
        Canonical contract: docs/specs/api_contracts/trade_plan_endpoints.md v0.7 §PUT /trade-plans/bulk-archive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIdsRequest"
      responses:
        "200":
          description: Bulk-archive result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BulkActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /trade-plans/bulk:
    delete:
      tags: [Trade Plans]
      summary: Bulk-delete trade plans
      description: |
        Deletes each selected trade plan in a single call.
        Canonical contract: docs/specs/api_contracts/trade_plan_endpoints.md v0.7 §DELETE /trade-plans/bulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIdsRequest"
      responses:
        "200":
          description: Bulk-delete result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BulkActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /trade-plans/setup-quality-score:
    get:
      tags: [Trade Plans]
      summary: Get setup quality score from closed trade history
      description: >
        Returns a 0-100 setup quality score derived from closed trade history.
        Returns gate_not_met=true when fewer than 20 closed trades exist.
        Score formula: clamp(win_rate*0.6 + max(avg_pnl_pct,0)*0.4, 0, 100).
        Contract: ST-08, EPIC-04, v6.1.
      parameters:
        - name: ticker
          in: query
          required: true
          schema: { type: string }
          description: Ticker symbol
      responses:
        "200":
          description: Score or gate_not_met response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      gate_not_met:
                        type: boolean
                      min_trades_required:
                        type: integer
                      current_trades:
                        type: integer
                        nullable: true
                      ticker:
                        type: string
                        nullable: true
                      score:
                        type: integer
                        nullable: true
                      matching_trades:
                        type: integer
                        nullable: true
                      win_rate:
                        type: number
                        nullable: true
                      average_pnl_pct:
                        type: number
                        nullable: true
                      score_explanation:
                        type: string
                        nullable: true

  /earnings/{ticker}:
    get:
      summary: Get next earnings date for a ticker
      tags: [Earnings]
      parameters:
        - name: ticker
          in: path
          required: true
          schema: { type: string }
          description: Ticker symbol
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [US, UK], default: US }
          description: Market (US or UK)
      responses:
        "200":
          description: Earnings date data (next_earnings_date may be null if unavailable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticker: { type: string }
                  next_earnings_date: { type: string, nullable: true, description: "ISO 8601 date or null" }
                  days_until_earnings: { type: integer, nullable: true }
                  fiscal_quarter: { type: string, nullable: true }
                  data_source: { type: string, example: "yahoo_finance" }

  /research/{ticker}:
    get:
      summary: Aggregated pre-trade research snapshot
      tags: [Research]
      parameters:
        - name: ticker
          in: path
          required: true
          schema: { type: string }
          description: Ticker symbol (e.g. AAPL, BARC.L)
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [US, UK], default: US }
      responses:
        "200":
          description: Research snapshot; sub-source failures return null fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data:
                    type: object
                    properties:
                      ticker: { type: string }
                      market: { type: string }
                      signal: { type: object, nullable: true }
                      regime: { type: object, nullable: true }
                      sector: { type: object }
                      screener: { type: object, nullable: true }
                      earnings: { type: object, nullable: true }
        "404":
          description: Ticker not found — Yahoo Finance returned no result for the given ticker symbol
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: "Ticker 'INVALID' not found." }
        "503":
          description: Yahoo Finance entirely unavailable — connection error or HTTP error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: "Market data service is currently unavailable. Please try again later." }

  /analytics/strategy-version-comparison:
    get:
      tags: [Analytics]
      summary: Get strategy version performance comparison
      description: |
        Compares trade performance metrics across two strategy version labels.
        Requires: version_from, version_to query params; optional date_range filter.
        Returns: trade_count, win_rate, avg_R, compliance_rate, performance_delta per
        version plus comparison_summary. Trades are attributed to a version by
        entry_date within that version's date window (see backend/strategy_version_registry.py),
        not a stored per-trade column.
        §13 binding conditions: 6 conditions cleared v4.7 (read-only, closed trades, no execution feedback).
        Canonical contract: docs/specs/api_contracts/strategy_version_comparison_contract.md v0.2.0
      parameters:
        - name: version_from
          in: query
          required: true
          schema:
            type: string
          description: Baseline strategy version label
        - name: version_to
          in: query
          required: true
          schema:
            type: string
          description: Comparison strategy version label (must be later than version_from)
        - name: date_range
          in: query
          required: false
          schema:
            type: string
          description: "ISO 8601 date range filter: YYYY-MM-DD/YYYY-MM-DD"
      responses:
        "200":
          description: Strategy version comparison metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  version_from: { type: string }
                  version_to: { type: string }
                  date_range: { type: string, nullable: true }
                  version_from_metrics:
                    type: object
                    properties:
                      trade_count: { type: integer }
                      win_rate: { type: number }
                      avg_R: { type: number }
                      performance_delta: { type: number, nullable: true }
                      compliance_rate: { type: number, nullable: true }
                  version_to_metrics:
                    type: object
                    properties:
                      trade_count: { type: integer }
                      win_rate: { type: number }
                      avg_R: { type: number }
                      performance_delta: { type: number }
                      compliance_rate: { type: number, nullable: true }
                  comparison_summary:
                    type: object
                    properties:
                      win_rate_delta: { type: number }
                      avg_R_delta: { type: number }
                      trade_count_delta: { type: integer }
                      assessment: { type: string, enum: [Improved, Degraded, "Insufficient data"] }
        "404":
          description: Strategy version not found in version registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  code: { type: string, example: version_not_found }
                  message: { type: string }
                  missing_version: { type: string }
        "400":
          description: version_to is not chronologically after version_from
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  code: { type: string, example: version_order_error }
                  message: { type: string }
        "422":
          description: Insufficient data or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  code: { type: string, enum: [insufficient_data, invalid_date_range] }
                  message: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"

  /strategy/benchmark/import:
    post:
      summary: Import backtest data from production_strategy.py CSV outputs
      description: |
        Upserts trade-level and yearly performance records produced by production_strategy.py
        into backtest_trades and backtest_yearly_performance tables. Called by import_backtest.py.
        ST-11 (BLG-FEAT-53, EPIC-03, v6.3)
      tags: [Strategy Benchmark]
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trades, yearly_performance]
              properties:
                trades:
                  type: array
                  items:
                    type: object
                    required: [ticker, entry_date, exit_date, entry_year]
                    properties:
                      ticker: { type: string }
                      entry_date: { type: string, format: date }
                      exit_date: { type: string, format: date }
                      holding_days: { type: integer, nullable: true }
                      entry_price: { type: number, nullable: true }
                      exit_price: { type: number, nullable: true }
                      pnl_gbp: { type: number, nullable: true }
                      pnl_pct: { type: number, nullable: true }
                      market: { type: string, default: US }
                      exit_reason: { type: string, nullable: true }
                      was_profitable: { type: boolean, nullable: true }
                      entry_year: { type: integer }
                yearly_performance:
                  type: array
                  items:
                    type: object
                    required: [entry_year]
                    properties:
                      entry_year: { type: integer }
                      num_trades: { type: integer, nullable: true }
                      avg_pnl_gbp: { type: number, nullable: true }
                      total_pnl_gbp: { type: number, nullable: true }
                      avg_hold_days: { type: number, nullable: true }
                      win_rate_pct: { type: number, nullable: true }
      responses:
        "200":
          description: Import complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  trades_imported: { type: integer }
                  years_imported: { type: integer }
                  open_positions_imported: { type: integer }
                  trades_deleted: { type: integer }
                  years_deleted: { type: integer }
                  open_positions_deleted: { type: integer }
                  imported_at: { type: string, format: date-time }
                  previous_total_pnl_gbp: { type: number, nullable: true }
                  total_pnl_gbp_delta: { type: number, nullable: true }
                  previous_total_unrealized_pnl_gbp: { type: number, nullable: true }

  /strategy/benchmark/summary:
    get:
      summary: Panel 1 stats and Panel 2 yearly breakdown for the Strategy Benchmark page
      description: |
        Returns backtest stats and actual live trade stats side-by-side for Panel 1,
        and per-year rows for Panel 2. actual_stats is null if no live trades match
        the filter (frontend displays '—' per AC-03). ST-11 (BLG-FEAT-53, EPIC-03, v6.3)
      tags: [Strategy Benchmark]
      security:
        - ApiKey: []
      parameters:
        - name: year
          in: query
          required: false
          schema: { type: integer }
          description: Filter to a specific entry year; omit for all years
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [US, UK, ALL] }
          description: Filter by market; omit or ALL for all markets
      responses:
        "200":
          description: Benchmark summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    type: object
                    properties:
                      year: { type: integer, nullable: true }
                      market: { type: string }
                  last_imported_at: { type: string, format: date-time, nullable: true }
                  available_years:
                    type: array
                    items: { type: integer }
                  backtest_stats:
                    nullable: true
                    type: object
                    properties:
                      total_trades: { type: integer }
                      win_rate_pct: { type: number }
                      avg_pnl_gbp: { type: number }
                      total_pnl_gbp: { type: number }
                      avg_hold_days: { type: number }
                  actual_stats:
                    nullable: true
                    type: object
                    properties:
                      total_trades: { type: integer }
                      win_rate_pct: { type: number }
                      avg_pnl_gbp: { type: number }
                      total_pnl_gbp: { type: number }
                      avg_hold_days: { type: number }
                  yearly_breakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        entry_year: { type: integer }
                        num_trades: { type: integer }
                        avg_pnl_gbp: { type: number }
                        total_pnl_gbp: { type: number }
                        avg_hold_days: { type: number }
                        win_rate_pct: { type: number }

  /strategy/benchmark/trades:
    get:
      summary: Panel 3 trade log for the Strategy Benchmark page
      description: |
        Returns backtest_trades and actual_trades separately. The frontend renders
        the appropriate subset based on the selected toggle mode (backtest only /
        actual only / side-by-side). ST-11 (BLG-FEAT-53, EPIC-03, v6.3)
      tags: [Strategy Benchmark]
      security:
        - ApiKey: []
      parameters:
        - name: year
          in: query
          required: false
          schema: { type: integer }
          description: Filter to a specific entry year
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [US, UK, ALL] }
          description: Filter by market
      responses:
        "200":
          description: Trade log data
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    type: object
                    properties:
                      year: { type: integer, nullable: true }
                      market: { type: string }
                  backtest_trades:
                    type: array
                    items:
                      type: object
                      properties:
                        ticker: { type: string }
                        entry_date: { type: string, format: date }
                        exit_date: { type: string, format: date }
                        holding_days: { type: integer, nullable: true }
                        entry_price: { type: number, nullable: true }
                        exit_price: { type: number, nullable: true }
                        pnl_gbp: { type: number, nullable: true }
                        pnl_pct: { type: number, nullable: true }
                        market: { type: string }
                        exit_reason: { type: string, nullable: true }
                        was_profitable: { type: boolean, nullable: true }
                        entry_year: { type: integer }
                  actual_trades:
                    type: array
                    items:
                      type: object
                      properties:
                        ticker: { type: string }
                        entry_date: { type: string, format: date, nullable: true }
                        exit_date: { type: string, format: date, nullable: true }
                        holding_days: { type: integer, nullable: true }
                        pnl_gbp: { type: number, nullable: true }
                        pnl_pct: { type: number, nullable: true }
                        market: { type: string }
                        exit_reason: { type: string, nullable: true }
                        was_profitable: { type: boolean, nullable: true }
                        entry_year: { type: integer, nullable: true }

  /strategy/benchmark/open-positions:
    get:
      summary: Panel 0 open (unrealized) positions for the Strategy Benchmark page
      description: |
        Returns current open positions with unrealized P&L, sourced from
        backtest_open_positions (fully replaced on each nightly import, same
        pattern as backtest_trades). No year parameter — open positions are
        current-state, not historical-per-year data. ST-08 (BLG-FEAT-54, EPIC-03, v6.4)
      tags: [Strategy Benchmark]
      security:
        - ApiKey: []
      parameters:
        - name: market
          in: query
          required: false
          schema: { type: string, enum: [US, UK, ALL] }
          description: Filter by market
      responses:
        "200":
          description: Open positions data
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    type: object
                    properties:
                      market: { type: string }
                  open_positions:
                    type: array
                    items:
                      type: object
                      properties:
                        ticker: { type: string }
                        market: { type: string }
                        entry_date: { type: string, format: date }
                        entry_price: { type: number, nullable: true }
                        current_price: { type: number, nullable: true }
                        unrealized_pnl_gbp: { type: number, nullable: true }
                        unrealized_pnl_pct: { type: number, nullable: true }
                        days_held: { type: integer }
                  summary:
                    type: object
                    properties:
                      count: { type: integer }
                      total_unrealized_pnl_gbp: { type: number, nullable: true }

components:
  schemas:
    ApiOk:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [ok]
        data:
          description: Payload varies by endpoint.
          type: object

    BulkTagRequest:
      type: object
      description: Shared shape for bulk-tag endpoints (ST-03, BLG-FE-117, EPIC-03, v7.5). Max 100 ids per call.
      required: [ids, tags]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }

    BulkIdsRequest:
      type: object
      description: Shared shape for bulk-delete/bulk-archive endpoints (ST-03, BLG-FE-117, EPIC-03, v7.5). Max 100 ids per call.
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }

    BulkActionResult:
      type: object
      description: Per-readiness-pass AC-01 shape — every batch mutation returns this, never a single opaque error.
      properties:
        succeeded:
          type: array
          items: { type: string, format: uuid }
        failed:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              reason: { type: string, example: not_found }

    SavedFilter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        filter_state:
          type: object
          description: Serialised filter selection, opaque to the backend.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSavedFilterRequest:
      type: object
      required: [name, filter_state]
      properties:
        name:
          type: string
          description: Max 100 characters.
        filter_state:
          type: object

    AlertRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [stop_loss_approach, grace_period_warning, market_regime_change, daily_portfolio_summary]
        enabled:
          type: boolean
        threshold_percent:
          type: number
          nullable: true
          description: Only for stop_loss_approach. null for other types.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAlertRuleRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [stop_loss_approach, grace_period_warning, market_regime_change, daily_portfolio_summary]
        enabled:
          type: boolean
          default: true
        threshold_percent:
          type: number
          description: Required for stop_loss_approach. Must be > 0 and <= 100.
          nullable: true

    UpdateAlertRuleRequest:
      type: object
      description: At least one field required.
      properties:
        enabled:
          type: boolean
        threshold_percent:
          type: number
          nullable: true
          description: Only applicable for stop_loss_approach. Must be > 0 and <= 100.

    PriceAlert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticker:
          type: string
        condition:
          type: string
          enum: [above, below]
        threshold_price:
          type: number
        active:
          type: boolean
        triggered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePriceAlertRequest:
      type: object
      required: [ticker, condition, threshold_price]
      properties:
        ticker:
          type: string
          description: 1-10 alphanumeric characters, uppercased server-side.
        condition:
          type: string
          enum: [above, below]
        threshold_price:
          type: number
          description: Must be > 0.

    AlertEvaluationResult:
      type: object
      properties:
        rules_evaluated:
          type: integer
        notifications_created:
          type: integer
        delivery_tasks_enqueued:
          type: integer
        redelivery_tasks_enqueued:
          type: integer
        evaluations_persisted:
          type: integer
        custom_price_alerts:
          type: object
          description: Summary of the custom price alert evaluation step (ST-02, BLG-FE-116, v7.5).
          properties:
            evaluated:
              type: integer
            triggered:
              type: integer
            errors:
              type: integer
            notifications_created:
              type: integer
            delivery_tasks_enqueued:
              type: integer

    AlertEvaluationRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        evaluation_timestamp:
          type: string
          format: date-time
        rule_type:
          type: string
          enum: [stop_loss_approach, grace_period_warning, market_regime_change, daily_portfolio_summary]
        symbol:
          type: string
          nullable: true
          example: "AAPL"
        triggered:
          type: boolean
        notification_sent:
          type: boolean
        values_compared:
          type: object
          additionalProperties: true

    AlertHistoryResponse:
      type: object
      properties:
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/AlertEvaluationRecord"
        total:
          type: integer
          description: Total number of records matching the query

    NotificationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        alert_type:
          type: string
          enum: [stop_loss_approach, grace_period_warning, market_regime_change, daily_portfolio_summary]
        title:
          type: string
          example: "Stop Loss Approach — AAPL"
        message:
          type: string
        read:
          type: boolean
        created_at:
          type: string
          format: date-time

    NotificationFeedResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
          example: 50
        has_more:
          type: boolean

    NotificationPreferenceItem:
      type: object
      properties:
        alert_type:
          type: string
          enum: [stop_loss_approach, grace_period_warning, market_regime_change, daily_portfolio_summary]
        email_enabled:
          type: boolean

    NotificationPreferencesResponse:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/NotificationPreferenceItem"

    UpdateNotificationPreferencesRequest:
      type: object
      description: >
        Map of alert_type keys to preference updates. Include only types to change.
        Example: { "stop_loss_approach": { "email_enabled": false } }
      additionalProperties:
        type: object
        properties:
          email_enabled:
            type: boolean

    ReflectionRequest:
      type: object
      description: "Upsert payload for a trade reflection. All fields optional (500-char max each)."
      properties:
        trade_rationale:
          type: string
          nullable: true
          maxLength: 500
        what_worked:
          type: string
          nullable: true
          maxLength: 500
        what_didnt_work:
          type: string
          nullable: true
          maxLength: 500
        discipline_assessment:
          type: string
          nullable: true
          maxLength: 500
        key_takeaway:
          type: string
          nullable: true
          maxLength: 500

    ReflectionData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trade_id:
          type: string
          format: uuid
        trade_rationale:
          type: string
          nullable: true
        what_worked:
          type: string
          nullable: true
        what_didnt_work:
          type: string
          nullable: true
        discipline_assessment:
          type: string
          nullable: true
        key_takeaway:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OkReflection:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        data:
          $ref: "#/components/schemas/ReflectionData"

    ApiError:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string

    PortfolioOverview:
      type: object
      properties:
        cash: { type: number }
        cash_balance: { type: number }
        total_value: { type: number }
        open_positions_value: { type: number }
        total_pnl: { type: number }
        initial_value: { type: number }
        net_deposits: { type: number }
        live_fx_rate: { type: number }
        last_updated: { type: string, format: date-time }
        current_drawdown_percent:
          type: number
          format: float
          description: "Percentage decline from all-time peak portfolio value. Result is <= 0.0; zero means portfolio is at peak. Defaults to 0.0 when no portfolio_history exists."
        peak_portfolio_value:
          type: number
          format: float
          description: "All-time high total_value from portfolio_history (GBP, all-time, not period-scoped). Defaults to 0.0 when no portfolio_history exists."
        positions:
          type: array
          items: { $ref: "#/components/schemas/PositionSummary" }

    PositionSummary:
      type: object
      description: >
        Portfolio position summary object as returned by GET /portfolio.
        v1.9.0 field list per docs/specs/api_contracts/portfolio_endpoints.md.
        current_price is always GBP (USD converted via live_fx_rate for US positions).
        entry_price is in the instrument's native currency (USD for US, GBP for UK).
        pnl_pct is the percentage return relative to entry price (signed %).
        grace_days_remaining is max(0, 10 - holding_days) when grace_period is true; null otherwise.
      properties:
        id: { type: string, format: uuid }
        ticker: { type: string }
        market: { type: string, enum: [US, UK] }
        entry_date: { type: string, format: date }
        entry_price: { type: number }
        shares: { type: number }
        current_price: { type: number, description: "Always GBP regardless of instrument currency" }
        current_value: { type: number, description: "current_price × shares, in GBP" }
        pnl: { type: number }
        pnl_pct: { type: number, description: "Percentage return relative to entry price (signed %)" }
        current_stop: { type: number, description: "Current stop loss price in GBP" }
        holding_days: { type: integer }
        status: { type: string, enum: [open, closed] }
        display_status: { type: string, enum: [GRACE, PROFITABLE, LOSING] }
        fx_rate: { type: number, description: "FX rate stored at time of position entry" }
        grace_period: { type: boolean }
        grace_days_remaining: { type: integer, nullable: true }
        live_fx_rate: { type: number, description: "FX rate used for current price conversion" }

    Position:
      allOf:
        - $ref: "#/components/schemas/PositionSummary"
        - type: object
          properties:
            initial_stop: { type: number }
            atr_value: { type: number }
            fx_rate: { type: number }
            live_fx_rate: { type: number }
            entry_note: { type: string, nullable: true }
            exit_note: { type: string, nullable: true }
            tags:
              type: array
              items: { type: string }
            last_reviewed_at:
              type: string
              format: date-time
              nullable: true
              description: v7.0 ST-15 (BLG-FEAT-68) — null means never marked reviewed. Set by PATCH /positions/{id}/mark-reviewed.

    PortfolioSnapshot:
      type: object
      properties:
        id: { type: string, format: uuid }
        snapshot_date: { type: string, format: date }
        total_value: { type: number }
        cash_balance: { type: number }
        positions_value: { type: number }
        total_pnl: { type: number }
        position_count: { type: integer }
        created_at: { type: string, format: date-time }

    AddPositionRequest:
      type: object
      required: [ticker, entry_date, shares, entry_price]
      properties:
        ticker: { type: string, maxLength: 20 }
        market: { type: string, enum: [US, UK] }
        entry_date: { type: string, format: date }
        shares: { type: number, minimum: 0.0001 }
        entry_price: { type: number, minimum: 0.01 }
        fx_rate: { type: number, nullable: true }
        atr_value: { type: number, nullable: true }
        stop_price: { type: number, nullable: true }
        entry_note: { type: string, maxLength: 500, nullable: true }
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 20
            pattern: "^[a-z0-9-]+$"
        trade_plan_id: { type: string, format: uuid, nullable: true }
        idempotency_key: { type: string, maxLength: 200, nullable: true }

    AddPositionResponse:
      type: object
      properties:
        ticker: { type: string }
        total_cost: { type: number }
        fees_paid: { type: number }
        entry_price: { type: number }
        initial_stop: { type: number }
        remaining_cash: { type: number }
        position_id: { type: string, format: uuid }
        trade_plan_linked:
          type: boolean
          description: ST-03 (BLG-BE-91, v8.6) — true if this position was linked to a trade plan at creation (explicit trade_plan_id or ticker/market auto-match).
        trade_plan_id:
          type: string
          format: uuid
          nullable: true
          description: ST-03 (BLG-BE-91, v8.6) — UUID of the linked trade plan, or null when trade_plan_linked is false.

    SizePositionRequest:
      type: object
      required: [entry_price, stop_price, risk_percent]
      properties:
        entry_price:
          type: number
          minimum: 0.0001
          description: Prospective entry price in instrument's native currency (GBP for UK, USD for US)
        stop_price:
          type: number
          minimum: 0.0001
          description: Intended initial stop price in instrument's native currency
        risk_percent:
          type: number
          minimum: 0.0001
          description: Percentage of portfolio value to risk (e.g. 1.0 = 1%)
        market:
          type: string
          enum: [US, UK]
          description: Market determines fee schedule and FX conversion
        fx_rate:
          type: number
          nullable: true
          description: Override FX rate (USD/GBP). If omitted, live rate is fetched.
        ticker:
          type: string
          nullable: true
          description: >-
            Candidate ticker (ST-04, BLG-BE-104). When provided, enables
            sector-concentration-aware size adjustment. Omitting it preserves
            pre-ST-04 sizing behaviour exactly.

    PositionSizeResponse:
      type: object
      description: |
        Intentionally broad to avoid drift. Canonical nested field definitions live in:
        docs/specs/api_contracts/portfolio_endpoints.md
      additionalProperties: true

    ExitPositionRequest:
      type: object
      required: [shares, exit_price, exit_date]
      properties:
        shares: { type: number, minimum: 0.0001 }
        exit_price: { type: number, minimum: 0.0001 }
        exit_date: { type: string, format: date }
        exit_reason: { type: string, nullable: true }
        exit_fx_rate: { type: number, nullable: true }
        exit_note: { type: string, maxLength: 500, nullable: true }

    ExitPositionResponse:
      type: object
      properties:
        ticker: { type: string }
        shares_exited: { type: number }
        realized_pnl: { type: number }
        exit_price: { type: number }
        fees_paid: { type: number }
        remaining_shares: { type: number }
        cash_received: { type: number }

    UpdateNoteRequest:
      type: object
      properties:
        entry_note: { type: string, nullable: true, maxLength: 500 }
        exit_note: { type: string, nullable: true, maxLength: 500 }

    UpdateNoteResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        entry_note: { type: string, nullable: true }
        exit_note: { type: string, nullable: true }

    UpdateTagsRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 20
            pattern: "^[a-z0-9-]+$"

    UpdateTagsResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }

    TagsListResponse:
      type: object
      properties:
        tags:
          type: array
          items: { type: string }

    TradeHistoryResponse:
      type: object
      description: |
        Canonical nested field definitions: docs/specs/api_contracts/trade_endpoints.md
        v1.9.0: trade objects include holding_days; both pnl_pct and pnl_percent returned for compatibility.
        v2.1.0 (ST-14): avg_slippage_pct added to top-level summary; fill_price and slippage_pct added per trade.
        v2.2.0 (ST-09): avg_fee_drag_pct added to top-level summary; fee_drag_pct added per trade.
      properties:
        total_trades: { type: integer }
        win_rate: { type: number }
        total_pnl: { type: number }
        avg_slippage_pct:
          type: number
          nullable: true
          description: "Mean slippage across all trades with fill_price recorded. null when no trades have fill_price."
        avg_fee_drag_pct:
          type: number
          nullable: true
          description: "Mean fee drag across all trades where gross_proceeds > 0. exit_fees / gross_proceeds * 100. null when no qualifying trades."
        trades:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              ticker: { type: string }
              market: { type: string, enum: [US, UK] }
              entry_date: { type: string, format: date }
              exit_date: { type: string, format: date }
              shares: { type: number }
              entry_price: { type: number }
              exit_price: { type: number }
              fill_price:
                type: number
                nullable: true
                description: "Actual fill price in native currency. null for trades entered before v2.1."
              slippage_pct:
                type: number
                nullable: true
                description: "(fill_price − entry_price) / entry_price * 100. Negative = favourable. null when fill_price is null."
              fee_drag_pct:
                type: number
                nullable: true
                description: "exit_fees / gross_proceeds * 100. Always non-negative. null when gross_proceeds is null or zero."
              pnl: { type: number }
              pnl_pct: { type: number }
              pnl_percent: { type: number, description: "Alias of pnl_pct for backward compatibility" }
              holding_days: { type: integer }
              exit_reason: { type: string, nullable: true }
              entry_note: { type: string, nullable: true }
              exit_note: { type: string, nullable: true }
              tags: { type: array, items: { type: string } }
              planned_entry_price:
                type: number
                nullable: true
                description: "Planned entry price snapshotted from linked signal at trade close. null for trades without a linked trade plan or pre-Arc4 trades."

    CashTransactionRequest:
      type: object
      required: [type, amount, date]
      properties:
        type: { type: string, enum: [deposit, withdrawal] }
        amount: { type: number, minimum: 0.01 }
        date: { type: string, format: date }
        note: { type: string, nullable: true }

    CashTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [deposit, withdrawal] }
        amount: { type: number }
        date: { type: string, format: date }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    CashTransactionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }

    CashSummary:
      type: object
      properties:
        total_deposits: { type: number }
        total_withdrawals: { type: number }
        net_cash_flow: { type: number }

    Signal:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticker: { type: string }
        market: { type: string, enum: [US, UK] }
        signal_date: { type: string, format: date }
        status: { type: string, enum: [new, entered, dismissed, expired, already_held, allocation_insufficient] }
        momentum_score: { type: number }
        current_price: { type: number }
        reason: { type: string, nullable: true }
        relative_strength_pct:
          type: number
          format: float
          nullable: true
          description: "ST-09 supplementary. Stock momentum % minus benchmark momentum % over lookback_days. Display-only — does not affect rank."
        week52_high_proximity_pct:
          type: number
          format: float
          nullable: true
          description: "ST-09 supplementary. (current_native_price - 52w_high) / 52w_high * 100. Negative = below 52-week high. Display-only."
        avg_daily_volume_20d:
          type: integer
          nullable: true
          description: "ST-09 supplementary. Average daily trading volume over last 20 trading days (native exchange units). Display-only."
        price_vs_50d_ma:
          type: number
          format: float
          nullable: true
          description: "ST-09 supplementary. (current_native_price - 50d_MA) / 50d_MA * 100. Positive = above MA. Display-only."

    AnalyticsMetricsResponse:
      type: object
      description: |
        Intentionally broad to avoid drift. Canonical nested field definitions live in:
        docs/specs/api_contracts/analytics_endpoints.md
        BLG-SPEC-G6 (v2.1): total_return_pct is now returned.
        Formula: total_pnl / net_cash_flow × 100,
        where net_cash_flow = total_deposits − total_withdrawals.
        ST-02 (v2.3): last_sync_at (string, ISO 8601 UTC) added — timestamp of metrics
        computation time. Used by frontend Metrics Staleness Indicator (4h threshold).
        See analytics_endpoints.md v2.0.0 §last_sync_at.
      additionalProperties: true

    ValidationResponse:
      type: object
      description: |
        Validation payload.
        Intentionally broad to avoid drift. Canonical nested field definitions live in:
        docs/specs/api_contracts/analytics_endpoints.md
        v1.9.0: 14 validated metrics total. Each result includes severity
        (critical | high | medium | low) and optional method field (Sharpe only).
        Critical metrics: sharpe_ratio, max_drawdown_percent, profit_factor,
        sharpe_ratio_trade_method. Summary includes by_severity breakdown.
        See analytics_endpoints.md §POST /validate/calculations for the full
        severity model and per-metric assignments.
      additionalProperties: true

    Settings:
      type: object
      description: |
        Settings object. Canonical field meanings and constraints live in:
        docs/specs/api_contracts/settings_endpoints.md v1.3.0
        Includes default_risk_percent (float, > 0, <= 100) added in v1.8.0
        for Position Sizing Calculator pre-population support.
        Includes concentration_position_threshold_pct (float, default 15.0) and
        concentration_sector_threshold_pct (float, default 30.0) added in v5.0
        for configurable concentration-limit alert thresholds.
      additionalProperties: true

    UpdateSettingsRequest:
      type: object
      description: |
        All fields optional. Only provided fields are updated.
        Canonical field meanings and constraints live in:
        docs/specs/api_contracts/settings_endpoints.md v1.3.0
        Includes default_risk_percent (float, > 0, <= 100) added in v1.8.0.
        Includes concentration_position_threshold_pct and
        concentration_sector_threshold_pct (both float, optional) added in v5.0.
      additionalProperties: true

    MarketStatus:
      type: object
      description: |
        Market status payload. No dedicated canonical Markdown contract exists yet.
        Market regime data is currently surfaced inline via GET /positions/analyze.
        See docs/specs/api_contracts/position_endpoints.md for the analyze response shape.
      additionalProperties: true

    OperationalHealthResponse:
      type: object
      description: |
        Operational health response for GET /health (v2.2, ST-08).
        Returns DB status and last operation timestamps.
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok, error]
        db:
          type: string
          enum: [connected, error]
        last_market_status_check:
          type: string
          format: date-time
          nullable: true
        last_alert_evaluation:
          type: string
          format: date-time
          nullable: true

    DatabaseSizeResponse:
      type: object
      description: |
        Database size monitoring response for GET /health/database (v2.3, ST-08 BLG-OPS-09).
        Returns current DB size, percentage of Render free tier limit (256 MB) used,
        and configured alert threshold. Alert is notification-only (no automated cleanup).
        Contract: docs/specs/api_contracts/health_endpoints.md v1.2
      required: [status, limit_bytes, limit_mb, threshold_percent]
      properties:
        size_bytes:
          type: integer
          nullable: true
          description: Raw database size in bytes (null if query failed).
        size_mb:
          type: number
          nullable: true
          description: Database size in megabytes, 2 d.p. (null if query failed).
        limit_bytes:
          type: integer
          description: Render free tier limit — 268,435,456 bytes (256 MB). Fixed constant.
        limit_mb:
          type: number
          description: Render free tier limit in megabytes — always 256.0.
        used_percent:
          type: number
          nullable: true
          description: Percentage of limit used (2 d.p.). Null if query failed.
        threshold_percent:
          type: number
          description: Alert threshold from DB_SIZE_ALERT_THRESHOLD_PERCENT env var (default 80).
        status:
          type: string
          enum: [ok, warning, error]
          description: |
            "ok" — below threshold.
            "warning" — at or above threshold; Telegram notification sent if credentials configured.
            "error" — database size query failed.
        error:
          type: string
          description: Error message when status is "error". Omitted otherwise.

    HealthResponse:
      type: object
      required: [status, timestamp, version]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string

    HealthDetailedResponse:
      allOf:
        - $ref: "#/components/schemas/HealthResponse"
        - type: object
          properties:
            response_time_ms: { type: number }
            checks:
              type: object
              additionalProperties: true

    EndpointTestResponse:
      type: object
      description: |
        Endpoint test results payload. Canonical structure lives in:
        docs/specs/api_contracts/health_endpoints.md
      additionalProperties: true

  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication via X-API-Key header

  responses:
    BadRequest:
      description: Validation error or business rule violation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    OkPortfolioOverview:
      description: Portfolio overview retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiOk"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PortfolioOverview"

    OkAddPosition:
      description: Position created successfully
      content:
        application/json:
