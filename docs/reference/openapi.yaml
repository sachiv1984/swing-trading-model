  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get notification preferences
      description: >
        Return per-type email delivery preferences. Seeds defaults on first call.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NotificationPreferencesResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Notifications]
      summary: Update notification preferences
      description: >
        Update email preferences for one or more alert types. Partial update.
        Body is a map of alert_type keys to preference objects.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPreferencesRequest"
      responses:
        "200":
          description: Preferences updated — returns full updated preferences list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NotificationPreferencesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions:
    get:
      tags: [Positions]
      summary: Get all open positions
      description: |
        Returns open positions with live prices, stops, and P&L.
        Fetches refreshed market pricing on every call.
      responses:
        "200":
          $ref: "#/components/responses/OkPositions"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/compliance:
    get:
      tags: [Positions]
      summary: Get per-position strategy compliance flags
      description: |
        Returns ATR-based stop compliance, stop age, and size compliance flags
        for all open positions. Display-only — no automated action generated
        (§13.3 constraint). Strategy Rules & System Intent Owner DoQ sign-off
        required at delivery verification (SPS=4, ST-01 BLG-FEAT-11 v2.3).
      responses:
        "200":
          description: Compliance data returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      overall_status:
                        type: string
                        enum: [Compliant, "Needs Attention", "Review Required"]
                      compliant_count:
                        type: integer
                      total_count:
                        type: integer
                      positions:
                        type: array
                        items:
                          type: object
                          properties:
                            position_id:
                              type: string
                              format: uuid
                            ticker:
                              type: string
                            market:
                              type: string
                              enum: [UK, US]
                            stop_compliant:
                              type: boolean
                              nullable: true
                            stop_age_days:
                              type: integer
                              nullable: true
                            size_compliant:
                              type: boolean
                              nullable: true
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/nightly-stop-update:
    post:
      tags: [Positions]
      summary: Recompute trailing stops for all open positions (ST-01 v6.2 BLG-FEAT-46)
      description: |
        Nightly job: recalculates trailing stop for every open position using
        profit-lock logic (INITIAL_ATR_MULT=5, PROFIT_ATR_MULT=2, ATR_PERIOD=14)
        and stores result. Stop only ever moves up (ratchet invariant).
        Result accessible via GET /positions as current_trailing_stop field.
      responses:
        "200":
          description: Stop update summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      run_date: { type: string }
                      positions_processed: { type: integer }
                      updated: { type: integer }
                      skipped: { type: integer }
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/risk-off-alerts:
    post:
      tags: [Positions]
      summary: Flag open positions with risk_off_exit alert per market regime (ST-05 v6.2 BLG-FEAT-49)
      description: |
        Nightly job: checks SPY vs MA200 (US positions) and FTSE vs MA200 (UK positions).
        Sets risk_off_exit=true on positions in risk-off markets; clears when recovered.
        Market isolation: US risk-off does not affect UK positions and vice versa.
        Result accessible via GET /positions as risk_off_exit boolean field.
      responses:
        "200":
          description: Risk-off alert summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      run_date: { type: string }
                      us_risk_off: { type: boolean }
                      uk_risk_off: { type: boolean }
                      us_positions_flagged: { type: integer }
                      uk_positions_flagged: { type: integer }
        "500":
          $ref: "#/components/responses/InternalError"

  /signals/rebalance-exit:
    post:
      tags: [Signals]
      summary: Generate exit_rebalance signals on last trading day of month (ST-03 v6.2 BLG-FEAT-47)
      description: |
        Month-end rebalance: on the last trading day, generates exit_rebalance signals
        for open positions not in the current top-5 momentum list.
        No-op if today is not the last trading day.
        Deduplicates: skips positions already at their trailing stop.
      responses:
        "200":
          description: Rebalance exit signal summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  data:
                    type: object
                    properties:
                      run_date: { type: string }
                      is_last_trading_day: { type: boolean }
                      signals_created: { type: integer }
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/analyze:
    get:
      tags: [Positions]
      summary: Run daily position analysis
      description: |
        Deterministic daily monitoring:
        - Updates all prices
        - Recalculates stops
        - Checks market regime
        - Recommends HOLD/EXIT actions
      responses:
        "200":
          $ref: "#/components/responses/OkPositionAnalysis"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}:
    get:
      tags: [Positions]
      summary: Get single position by ID
      description: |
        Returns a single open or closed position with live prices (for open positions)
        and lifecycle state fields: position_state, state_entered_at, days_in_state.
        Lifecycle state is lazily recalculated on each call. (v3.3 EPIC-01 ST-02)
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
          description: Position UUID
      responses:
        "200":
          description: Position returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  position_state:
                    type: string
                    enum: [GRACE, LOSING, PROFITABLE, "EXIT ZONE", UNKNOWN]
                    nullable: true
                  state_entered_at:
                    type: string
                    format: date-time
                    nullable: true
                  days_in_state:
                    type: integer
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/refresh-state:
    post:
      tags: [Positions]
      summary: Refresh lifecycle state for a position
      description: |
        Explicitly recomputes and persists the lifecycle state for a single position.
        Returns the updated state fields. §13 display-only — no automated action.
        (v3.3 EPIC-01 ST-02)
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
          description: Position UUID
      responses:
        "200":
          description: State refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      position_id:
                        type: string
                        format: uuid
                      position_state:
                        type: string
                        enum: [GRACE, LOSING, PROFITABLE, "EXIT ZONE", UNKNOWN]
                      state_entered_at:
                        type: string
                        format: date-time
                        nullable: true
                      days_in_state:
                        type: integer
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/exit:
    post:
      tags: [Positions]
      summary: Exit a position
      description: |
        Exit full or partial position using user-provided prices.
        Records in trade history and updates cash.
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
          description: Position UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExitPositionRequest"
            example:
              shares: 10.5
              exit_price: 920.0
              exit_date: "2026-02-15"
              exit_reason: "Target Reached"
              exit_fx_rate: 1.365
              exit_note: "Hit target, took profits"
      responses:
        "200":
          $ref: "#/components/responses/OkExitPosition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/note:
    patch:
      tags: [Journal]
      summary: Update position notes
      description: |
