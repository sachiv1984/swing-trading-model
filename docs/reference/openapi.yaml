          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Price alert deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: boolean
                            example: true
                          id:
                            type: string
                            format: uuid
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /alerts/evaluate:
    post:
      tags: [Alerts]
      summary: Trigger alert evaluation
      description: >
        Evaluate all enabled alert rules against current portfolio state. Writes notification records
        and enqueues email delivery as FastAPI BackgroundTasks (ADR-003). Response is immediate.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      responses:
        "200":
          description: Evaluation complete
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AlertEvaluationResult"
        "500":
          $ref: "#/components/responses/InternalError"

  /alerts/history:
    get:
      tags: [Alerts]
      summary: Get alert evaluation history
      description: >
        Return audit log of every alert rule evaluation, newest first.
        Supports last_n_days (default 30) or last_n_records filtering.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.3.
      parameters:
        - in: query
          name: last_n_days
          required: false
          schema:
            type: integer
            minimum: 1
          description: Return evaluations from the last N days (default 30)
        - in: query
          name: last_n_records
          required: false
          schema:
            type: integer
            minimum: 1
          description: Return the last N records regardless of date (takes precedence over last_n_days)
      responses:
        "200":
          description: Alert evaluation history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AlertHistoryResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications:
    get:
      tags: [Notifications]
      summary: Get notification feed
      description: >
        Return notifications newest first. Page-based pagination, 50 items per page.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.6.
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - in: query
          name: since_days
          required: false
          schema:
            type: integer
            minimum: 1
          description: Restrict to notifications created within the last N days. Applied before pagination.
        - in: query
          name: read
          required: false
          schema:
            type: boolean
          description: Restrict to read-only (true) or unread-only (false) items. Applied before pagination.
      responses:
        "200":
          description: Notification feed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NotificationFeedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications/{id}:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      description: >
        Mark a single notification as read. Idempotent.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
