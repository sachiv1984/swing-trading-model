openapi: 3.0.3

info:
  title: Momentum Trading Assistant API
  version: 3.15.0
  # v3.15.0 (2026-08-10, ST-21, EPIC-06, v8.5): added GET /screener/regime-distribution
  # (BLG-FEAT-29) — aggregate risk-on/risk-off regime distribution over screener
  # run history for a rolling 30d/60d/all window.
  # v3.14.1 (2026-08-07, ST-02+ST-07, EPIC-02, v8.4): fixed ~23 endpoints
  # structurally nested inside `components:` instead of `paths:`; added
  # GET /test/quick-health and POST /test/rate-limit-scenarios (pre-existing
  # routes, previously undocumented); corrected two security-scheme gaps —
  # GET /changelog/latest incorrectly marked security:[] (it requires
  # X-API-Key like every route except GET /health), and GET /health/scheduler
  # referencing an undefined `ApiKeyAuth` scheme instead of `ApiKey`.
  description: |
    SUPPORTING REFERENCE FILE (MANUALLY MAINTAINED)

    This OpenAPI specification is a supporting reference representation of the API.
    Canonical API contract truth lives in:
      - docs/specs/api_contracts/

    If this file disagrees with the canonical Markdown API contracts,
    the Markdown contracts take precedence.

    Versioning:
    - This file's version matches the canonical API contract version documented in:
      docs/specs/api_contracts/README.md

    Key principles:
    - Decision-support tool with deterministic server-side logic
    - Backend is single source of truth for calculations
    - Exit prices are user-provided (broker executions)
    - Multi-currency support (GBP base; USD/GBP native values where applicable)

servers:
  - url: https://api.example.com
    description: Production server
  - url: http://localhost:8000
    description: Development server

tags:
  - name: Portfolio
    description: Portfolio management and overview
  - name: Positions
    description: Position entry, exit, and monitoring
  - name: Trades
    description: Trade history and statistics
  - name: Cash
    description: Cash management and transactions
  - name: Signals
    description: Momentum signal generation
  - name: Analytics
    description: Portfolio analytics and validation
  - name: Market
    description: Market regime and status
  - name: Health
    description: System health and diagnostics
  - name: Settings
    description: Strategy configuration
  - name: Journal
    description: Trade journaling and notes
  - name: Reports
    description: Financial reporting (tax-year P&L)
  - name: Alerts
    description: Alert rules configuration and evaluation
  - name: Notifications
    description: Notification feed and delivery preferences
  - name: Screener
    description: Strategy-rules stock screener (DS-01) and screener results
  - name: Changelog
    description: Release changelog summary, backing the in-app "What's New" panel (ST-01, EPIC-01, v7.8)
  - name: External - Alpaca
    description: "External API calls to Alpaca Markets (https://data.alpaca.markets). These are outbound calls FROM this system TO Alpaca — documented here per CLAUDE.md §1 (ST-02, BLG-SPEC-22). Contract: docs/specs/api_contracts/alpaca_integration_contract.md"

paths:
  /portfolio:
    get:
      tags: [Portfolio]
      summary: Get portfolio overview
      description: |
        Returns complete portfolio overview with live prices, cash balance,
        and open positions.
      responses:
        "200":
          $ref: "#/components/responses/OkPortfolioOverview"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/position:
    post:
      tags: [Portfolio]
      summary: Add a new position
      description: |
        Manual position entry supporting fractional shares.
        Auto-calculates fees, ATR, and initial stops if not provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPositionRequest"
            example:
              ticker: NVDA
              market: US
              entry_date: "2026-02-15"
              shares: 10.5
              entry_price: 850.0
              fx_rate: 1.3642
              atr_value: 15.32
              entry_note: "Breakout above $800 resistance"
              tags: ["momentum", "breakout"]
      responses:
        "200":
          $ref: "#/components/responses/OkAddPosition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/size:
    post:
      tags: [Portfolio]
      summary: Calculate position size
      description: |
        Calculate suggested share quantity for a prospective new position.
        Returns sizing result, risk amount, estimated cost, and cash feasibility.
        Idempotent for same inputs. Does not mutate any state.
        All calculations are authoritative and performed server-side.
        Canonical rules: docs/specs/strategy_rules.md §4.1
        Canonical contract: docs/specs/api_contracts/portfolio_endpoints.md
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SizePositionRequest"
            example:
              entry_price: 850.00
              stop_price: 780.00
              risk_percent: 1.00
              market: US
              fx_rate: 1.3642
      responses:
        "200":
          $ref: "#/components/responses/OkPositionSize"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/snapshot:
    post:
      tags: [Portfolio]
      summary: Create daily portfolio snapshot
      description: |
        Idempotent endpoint to create or update the daily snapshot.
        Used for historical tracking and analytics.
      responses:
        "200":
          $ref: "#/components/responses/OkPortfolioSnapshot"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/history:
    get:
      tags: [Portfolio]
      summary: Get portfolio history
      description: Retrieve historical portfolio snapshots for charting.
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
            minimum: 1
          description: Number of days to retrieve
      responses:
        "200":
          $ref: "#/components/responses/OkPortfolioHistory"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/prospective-heat:
    get:
      tags: [Portfolio]
      summary: Calculate prospective portfolio heat
      description: >
        Returns current and prospective portfolio heat percentages given a potential new position.
        Canonical contract: docs/specs/api_contracts/portfolio_endpoints.md v2.0.0.
      parameters:
        - in: query
          name: ticker
          required: true
          schema:
            type: string
          description: Ticker symbol (e.g. AAPL, BARC.L)
        - in: query
          name: shares
          required: true
          schema:
            type: number
          description: Number of shares for the prospective position
        - in: query
          name: entry_price
          required: true
          schema:
            type: number
          description: Proposed entry price
        - in: query
          name: stop_price
          required: true
          schema:
            type: number
          description: Proposed initial stop price
        - in: query
          name: fx_rate
          required: false
          schema:
            type: number
          description: Override FX rate (USD→GBP); omit to use live rate
      responses:
        "200":
          description: Prospective heat calculation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  current_heat_percent:
                    type: number
                  prospective_heat_percent:
                    type: number
                  incremental_heat_percent:
                    type: number
                  prospective_risk_gbp:
                    type: number
                  portfolio_value_gbp:
                    type: number
                  ticker:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/drawdown-status:
    get:
      tags: [Portfolio]
      summary: Get portfolio drawdown status vs threshold
      description: >
        Returns current drawdown % calculated from 30-day portfolio peak, configurable threshold,
        and threshold_breached boolean. When breached, also returns lifecycle state counts,
        portfolio heat %, and regime status. Contract: IT-04 (Arc 3).
      responses:
        "200":
          description: Drawdown status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      current_drawdown_pct:
                        type: number
                      threshold_pct:
                        type: number
                      threshold_breached:
                        type: boolean
                      portfolio_heat_pct:
                        type: number
                      regime_status:
                        type: string
                      positions_by_state:
                        type: object

  /portfolio/concentration-status:
    get:
      tags: [Portfolio]
      summary: Get position and sector concentration breach status
      description: >
        Returns any positions or sectors exceeding configurable concentration thresholds.
        Single-position threshold default 15% of portfolio heat; sector threshold default 30%.
        Uses DS-03 sector data where available. Contract: IT-05 (Arc 3).
      responses:
        "200":
          description: Concentration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      any_breach:
                        type: boolean
                      position_threshold_pct:
                        type: number
                      sector_threshold_pct:
                        type: number
                      breaching_positions:
                        type: array
                        items:
                          type: object
                      breaching_sectors:
                        type: array
                        items:
                          type: object

  /portfolio/sector-weights:
    get:
      tags: [Portfolio]
      summary: Get open-position sector exposure breakdown
      description: >
        Returns sector breakdown by market value: sector name, position count, exposure %,
        and a concentration_alert flag (true when any sector ≥40%). Positions without a
        sector are grouped as "Unclassified". Contract: ST-06, EPIC-03, v6.1.
      responses:
        "200":
          description: Sector weights
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      sectors:
                        type: array
                        items:
                          type: object
                          properties:
                            sector_name:
                              type: string
                            position_count:
                              type: integer
                            exposure_pct:
                              type: number
                      total_positions:
                        type: integer
                      concentration_alert:
                        type: boolean

  /portfolio/sector-regime-trend:
    get:
      tags: [Portfolio]
      summary: Get weekly-bucketed sector concentration + regime status trend
      description: >
        Reads from the sector_regime_history table (new, going-forward-only capture
        via the daily snapshot job — no prior historical sector/regime data existed).
        Returns insufficient_history: true (with weeks_available) until 8 distinct
        weeks of snapshots have accumulated. Contract: ST-02, EPIC-02, v7.9,
        docs/specs/api_contracts/portfolio_endpoints.md v2.5.0 §GET /portfolio/sector-regime-trend.
      parameters:
        - name: weeks
          in: query
          required: false
          schema: { type: integer, default: 12 }
      responses:
        "200":
          description: Sector/regime trend (or insufficient-history state)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      insufficient_history:
                        type: boolean
                      weeks_available:
                        type: integer
                      weeks:
                        type: array
                        items:
                          type: object
                          properties:
                            week_start:
                              type: string
                            sectors:
                              type: array
                              items:
                                type: object
                                properties:
                                  sector_name:
                                    type: string
                                  exposure_pct:
                                    type: number
                            regime_us:
                              type: boolean
                              nullable: true
                            regime_uk:
                              type: boolean
                              nullable: true

  /portfolio/gate-metrics:
    get:
      tags: [Portfolio]
      summary: Get trade count gate progress metrics
      description: >
        Returns closed trade count, closed trades with plans, active positions, AI journal entry
        count (if table exists), oldest and newest trade dates. Used to surface progress toward
        the 20/50/100 closed-trade gates. Contract: ST-04, EPIC-02, v5.5.
      responses:
        "200":
          description: Gate metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      closed_trades_count:
                        type: integer
                      closed_trades_with_plans:
                        type: integer
                      active_positions_count:
                        type: integer
                      ai_journal_entry_count:
                        type: integer
                        nullable: true
                      oldest_trade_date:
                        type: string
                        nullable: true
                      newest_trade_date:
                        type: string
                        nullable: true

  /portfolio/paper-positions:
    get:
      tags: [Portfolio]
      summary: Get Alpaca paper account positions with P&L
      description: >
        Returns current Alpaca paper account positions with unrealised P&L.
        Returns {"paper_tracking_enabled": false} when ALPACA_PAPER_API_KEY is not configured.
        §13 compliant: display-only; no automated order execution. Contract: IT-06 (Arc 3, v3.5).
      responses:
        "200":
          description: Paper positions or disabled flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  paper_tracking_enabled:
                    type: boolean
                  status:
                    type: string
                  positions:
                    type: array
                    items:
                      type: object
                      properties:
                        ticker:
                          type: string
                        paper_entry_price:
                          type: number
                        current_market_price:
                          type: number
                        paper_pnl_usd:
                          type: number
                        paper_pnl_pct:
                          type: number
                        date_opened:
                          type: string
                          nullable: true
                        position_size:
                          type: number
        "500":
          description: Alpaca API error

  /portfolio/pre-entry-validation:
    get:
      tags: [Portfolio]
      summary: Advisory pre-entry rule validation (SI-01)
      description: >
        Non-blocking advisory check of 5 pre-entry rules: regime gate, cash constraint,
        sector concentration, earnings proximity, sizing validity.
        All checks are advisory — results do not block trade plan submission.
        §13 compliant: decision support only. strategy_rules.md §4.2.
        Decision record: docs/product/decisions/decisions--2026-05-19__release-v3.8--SI-01-section13-review.md
        Canonical contract: docs/specs/api_contracts/pre_entry_validation.md v1.0.0.
      parameters:
        - in: query
          name: ticker
          required: true
          schema:
            type: string
          description: Ticker symbol
        - in: query
          name: quantity
          required: true
          schema:
            type: number
          description: Proposed number of shares
        - in: query
          name: market
          required: false
          schema:
            type: string
            enum: [US, UK]
            default: US
          description: Market (US or UK)
        - in: query
          name: entry_price
          required: false
          schema:
            type: number
            nullable: true
          description: Entry price — enables sizing validity check
        - in: query
          name: stop_price
          required: false
          schema:
            type: number
            nullable: true
          description: Stop price — enables sizing validity check
      responses:
        "200":
          description: Advisory validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      ticker:
                        type: string
                      market:
                        type: string
                      quantity:
                        type: number
                      advisory_status:
                        type: string
                        enum: [pass, warn, fail]
                      override_required:
                        type: boolean
                      checks:
                        type: array
                        items:
                          type: object
                          properties:
                            rule:
                              type: string
                            status:
                              type: string
                              enum: [pass, warn, fail, skipped]
                            detail:
                              type: string
                            severity:
                              type: string
        "422":
          description: Missing required query params

  /portfolio/red-flag-journal:
    get:
      tags: [Portfolio]
      summary: Get Red Flag Journal events
      description: >
        Returns a paginated log of strategy deviation events (pre-entry override, checklist skip, prompt dismissal).
        §13 compliance: display-only audit log; no automated decisions.
        Canonical contract: docs/specs/api_contracts/red_flag_journal.md v1.0.0.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: event_type
          schema:
            type: string
            enum: [pre_entry_override, checklist_skipped, stop_prompt_dismissed, drawdown_prompt_dismissed]
        - in: query
          name: ticker
          schema:
            type: string
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: severity
          schema:
            type: string
            enum: [info, warning, critical]
          description: Filter by severity level (v4.6 ST-09)
      responses:
        "200":
          description: Paginated deviation event log
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      page_size:
                        type: integer
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            event_type:
                              type: string
                              enum: [pre_entry_override, checklist_skipped, stop_prompt_dismissed, drawdown_prompt_dismissed]
                            ticker:
                              type: string
                            position_id:
                              type: string
                              format: uuid
                              nullable: true
                            context:
                              type: object
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                            severity:
                              type: string
                              enum: [info, warning, critical]
                              description: Event severity level (v4.6 ST-09)
        "500":
          description: Internal server error

  /reports/tax-year:
    get:
      tags: [Reports]
      summary: Get UK tax-year P&L report
      description: >
        Returns realised P&L for a UK tax year (6 Apr YYYY to 5 Apr YYYY+1),
        including closed trades, summary totals, and estimated unrealised P&L on open positions.
        Pass format=pdf to receive a PDF file download instead of JSON.
        Pass format=csv to receive a CSV file download instead of JSON.
        Canonical contract: docs/specs/api_contracts/reports_endpoints.md v0.3.
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2099
          description: Tax year start year (e.g. 2025 for 2025/26 tax year)
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [pdf, csv]
          description: Response format. Omit for JSON (default). Pass pdf for PDF download. Pass csv for CSV download.
      responses:
        "200":
          description: Tax-year P&L report (JSON) or PDF download
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      tax_year_label:
                        type: string
                        example: "2025/26"
                      tax_year_start:
                        type: string
                        format: date
                      tax_year_end:
                        type: string
                        format: date
                      summary:
                        type: object
                      trades:
                        type: array
                        items:
                          type: object
                      estimated_unrealised_pnl:
                        type: number
                        description: v7.0 ST-14 (BLG-FEAT-70) — sum of pnl across currently open positions, computed on-read at request time (not stored). Same field/computation as GET /reports/monthly-pnl's value.
                        example: 340.50
                      unrealised_note:
                        type: string
                        description: v7.0 ST-14 (BLG-FEAT-70) — static disclaimer text, same value as GET /reports/monthly-pnl's unrealised_note.
                        example: "Reflects current open positions at time of report generation, not positions open during the specified tax year. Indicative only — not a tax liability."
            application/pdf:
              schema:
                type: string
                format: binary
                description: >
                  PDF document containing the tax-year P&L report.
                  Returned when format=pdf query parameter is supplied.
                  Content-Disposition header set to attachment with filename tax-year-{year}-pnl.pdf.
            text/csv:
              schema:
                type: string
                description: >
                  CSV file containing the tax-year P&L report.
                  Returned when format=csv query parameter is supplied.
                  Structure: 5-row metadata block, blank row, 17-column trades table with human-readable headers.
                  Content-Disposition set to attachment with filename tax-year-{year}-pnl.csv.
                  Canonical contract: docs/specs/api_contracts/reports_endpoints.md v0.3.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /reports/monthly-pnl:
    get:
      tags: [Reports]
      summary: Get month-by-month realised P&L
      description: >
        Returns month-by-month realised P&L for the current and prior calendar year.
        Only months with closed trades are included. Sorted descending by year then month.
        Includes optional compliance_summary (30d Arc 5 metrics) when data is available.
        Includes estimated_unrealised_pnl/unrealised_note (v7.0, ST-14) — current-snapshot
        unrealised P&L, same field/computation as GET /reports/tax-year's summary field.
        Pass format=csv to receive a CSV file download instead of JSON (ST-05, v7.8).
        Canonical contract: docs/specs/api_contracts/reports_endpoints.md v0.10. ST-03 (v4.7), ST-14 (v7.0), ST-05 (v7.8).
      parameters:
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [csv]
          description: Response format. Omit for JSON (default). Pass csv for CSV download.
      responses:
        "200":
          description: Monthly P&L summary array with optional compliance summary (JSON), or CSV download when format=csv
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        year:
                          type: integer
                          example: 2026
                        month:
                          type: integer
                          example: 4
                        realised_pnl_gbp:
                          type: number
                          example: 340.50
                        trade_count:
                          type: integer
                          example: 3
                  estimated_unrealised_pnl:
                    type: number
                    nullable: true
                    description: v7.0 ST-14 (BLG-FEAT-70) — sum of pnl across currently open positions. null if no portfolio yet.
                    example: 340.50
                  unrealised_note:
                    type: string
                    description: v7.0 ST-14 (BLG-FEAT-70) — static disclaimer text, same value as GET /reports/tax-year's unrealised_note.
                    example: "Reflects current open positions at time of report generation, not positions open during the specified tax year. Indicative only — not a tax liability."
                  compliance_summary:
                    type: object
                    nullable: true
                    description: Arc 5 pre-entry discipline metrics for the last 30 days. null if data unavailable.
                    properties:
                      period_days:
                        type: integer
                        example: 30
                      validation_pass_rate:
                        type: number
                        nullable: true
                        example: 0.82
                      override_count:
                        type: integer
                        example: 2
                      red_flag_events_count:
                        type: integer
                        example: 5
                      most_frequent_rule_breach:
                        type: string
                        nullable: true
                        example: sector_concentration
        "400":
          description: format query parameter present and not csv
        "500":
          $ref: "#/components/responses/InternalError"

  /reports/daily-pnl:
    get:
      tags: [Reports]
      summary: Get day-by-day realised P&L for a single month
      description: >
        Day-granularity sibling of GET /reports/monthly-pnl for the Trade History
        Calendar View (ST-04, BLG-FE-118, v7.5). Only days with 1+ closed-trade
        exits are included. Same estimated_unrealised_pnl/unrealised_note pattern
        (current-snapshot only, never per-day).
        Canonical contract: docs/specs/api_contracts/reports_endpoints.md v0.9.
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer }
        - name: month
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: Daily P&L summary array
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: integer
                          example: 3
                        realised_pnl_gbp:
                          type: number
                          example: 240.50
                        trade_count:
                          type: integer
                          example: 3
                  estimated_unrealised_pnl:
                    type: number
                    nullable: true
                    example: 340.50
                  unrealised_note:
                    type: string
                    example: "Reflects current open positions at time of report generation, not positions open during the specified tax year. Indicative only — not a tax liability."
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /reports/reconciliation:
