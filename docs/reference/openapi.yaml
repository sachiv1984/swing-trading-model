          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PriceAlert"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /price-alerts/{id}:
    delete:
      tags: [Alerts]
      summary: Delete custom price alert
      description: >
        Delete a custom price alert (active or already-triggered).
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.5.
