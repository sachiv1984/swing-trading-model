openapi: 3.0.3

info:
  title: Momentum Trading Assistant API
  version: 2.9.0
  description: |
    SUPPORTING REFERENCE FILE (MANUALLY MAINTAINED)

    This OpenAPI specification is a supporting reference representation of the API.
    Canonical API contract truth lives in:
      - docs/specs/api_contracts/

    If this file disagrees with the canonical Markdown API contracts,
    the Markdown contracts take precedence.

    Versioning:
    - This file's version matches the canonical API contract version documented in:
      docs/specs/api_contracts/README.md

    Key principles:
    - Decision-support tool with deterministic server-side logic
    - Backend is single source of truth for calculations
    - Exit prices are user-provided (broker executions)
    - Multi-currency support (GBP base; USD/GBP native values where applicable)

servers:
  - url: https://api.example.com
    description: Production server
  - url: http://localhost:8000
    description: Development server

tags:
  - name: Portfolio
    description: Portfolio management and overview
  - name: Positions
    description: Position entry, exit, and monitoring
  - name: Trades
    description: Trade history and statistics
  - name: Cash
    description: Cash management and transactions
  - name: Signals
    description: Momentum signal generation
  - name: Analytics
    description: Portfolio analytics and validation
  - name: Market
    description: Market regime and status
  - name: Health
    description: System health and diagnostics
  - name: Settings
    description: Strategy configuration
  - name: Journal
    description: Trade journaling and notes
  - name: Reports
    description: Financial reporting (tax-year P&L)
  - name: Alerts
    description: Alert rules configuration and evaluation
  - name: Notifications
    description: Notification feed and delivery preferences
  - name: Screener
    description: Strategy-rules stock screener (DS-01) and screener results
  - name: External - Alpaca
    description: "External API calls to Alpaca Markets (https://data.alpaca.markets). These are outbound calls FROM this system TO Alpaca — documented here per CLAUDE.md §1 (ST-02, BLG-SPEC-22). Contract: docs/specs/api_contracts/alpaca_integration_contract.md"

paths:
  /portfolio:
    get:
      tags: [Portfolio]
      summary: Get portfolio overview
      description: |
        Returns complete portfolio overview with live prices, cash balance,
        and open positions.
      responses:
        "200":
          $ref: "#/components/responses/OkPortfolioOverview"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/position:
    post:
      tags: [Portfolio]
      summary: Add a new position
      description: |
        Manual position entry supporting fractional shares.
        Auto-calculates fees, ATR, and initial stops if not provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPositionRequest"
            example:
              ticker: NVDA
              market: US
              entry_date: "2026-02-15"
              shares: 10.5
              entry_price: 850.0
              fx_rate: 1.3642
              atr_value: 15.32
              entry_note: "Breakout above $800 resistance"
              tags: ["momentum", "breakout"]
      responses:
        "200":
          $ref: "#/components/responses/OkAddPosition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/size:
    post:
      tags: [Portfolio]
      summary: Calculate position size
      description: |
        Calculate suggested share quantity for a prospective new position.
        Returns sizing result, risk amount, estimated cost, and cash feasibility.
        Idempotent for same inputs. Does not mutate any state.
        All calculations are authoritative and performed server-side.
        Canonical rules: docs/specs/strategy_rules.md §4.1
        Canonical contract: docs/specs/api_contracts/portfolio_endpoints.md
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SizePositionRequest"
            example:
              entry_price: 850.00
              stop_price: 780.00
              risk_percent: 1.00
              market: US
              fx_rate: 1.3642
      responses:
        "200":
          $ref: "#/components/responses/OkPositionSize"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/snapshot:
    post:
      tags: [Portfolio]
      summary: Create daily portfolio snapshot
      description: |
        Idempotent endpoint to create or update the daily snapshot.
        Used for historical tracking and analytics.
      responses:
        "200":
          $ref: "#/components/responses/OkPortfolioSnapshot"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/history:
    get:
      tags: [Portfolio]
      summary: Get portfolio history
      description: Retrieve historical portfolio snapshots for charting.
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
            minimum: 1
          description: Number of days to retrieve
      responses:
        "200":
          $ref: "#/components/responses/OkPortfolioHistory"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/prospective-heat:
    get:
      tags: [Portfolio]
      summary: Calculate prospective portfolio heat
      description: >
        Returns current and prospective portfolio heat percentages given a potential new position.
        Canonical contract: docs/specs/api_contracts/portfolio_endpoints.md v2.0.0.
      parameters:
        - in: query
          name: ticker
          required: true
          schema:
            type: string
          description: Ticker symbol (e.g. AAPL, BARC.L)
        - in: query
          name: shares
          required: true
          schema:
            type: number
          description: Number of shares for the prospective position
        - in: query
          name: entry_price
          required: true
          schema:
            type: number
          description: Proposed entry price
        - in: query
          name: stop_price
          required: true
          schema:
            type: number
          description: Proposed initial stop price
        - in: query
          name: fx_rate
          required: false
          schema:
            type: number
          description: Override FX rate (USD→GBP); omit to use live rate
      responses:
        "200":
          description: Prospective heat calculation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  current_heat_percent:
                    type: number
                  prospective_heat_percent:
                    type: number
                  incremental_heat_percent:
                    type: number
                  prospective_risk_gbp:
                    type: number
                  portfolio_value_gbp:
                    type: number
                  ticker:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /portfolio/drawdown-status:
    get:
      tags: [Portfolio]
      summary: Get portfolio drawdown status vs threshold
      description: >
        Returns current drawdown % calculated from 30-day portfolio peak, configurable threshold,
        and threshold_breached boolean. When breached, also returns lifecycle state counts,
        portfolio heat %, and regime status. Contract: IT-04 (Arc 3).
      responses:
        "200":
          description: Drawdown status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      current_drawdown_pct:
                        type: number
                      threshold_pct:
                        type: number
                      threshold_breached:
                        type: boolean
                      portfolio_heat_pct:
                        type: number
                      regime_status:
                        type: string
                      positions_by_state:
                        type: object

  /portfolio/concentration-status:
    get:
      tags: [Portfolio]
      summary: Get position and sector concentration breach status
      description: >
        Returns any positions or sectors exceeding configurable concentration thresholds.
        Single-position threshold default 15% of portfolio heat; sector threshold default 30%.
        Uses DS-03 sector data where available. Contract: IT-05 (Arc 3).
      responses:
        "200":
          description: Concentration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      any_breach:
                        type: boolean
                      position_threshold_pct:
                        type: number
                      sector_threshold_pct:
                        type: number
                      breaching_positions:
                        type: array
                        items:
                          type: object
                      breaching_sectors:
                        type: array
                        items:
                          type: object

  /portfolio/paper-positions:
    get:
      tags: [Portfolio]
      summary: Get Alpaca paper account positions with P&L
      description: >
        Returns current Alpaca paper account positions with unrealised P&L.
        Returns {"paper_tracking_enabled": false} when ALPACA_PAPER_API_KEY is not configured.
        §13 compliant: display-only; no automated order execution. Contract: IT-06 (Arc 3, v3.5).
      responses:
        "200":
          description: Paper positions or disabled flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  paper_tracking_enabled:
                    type: boolean
                  status:
                    type: string
                  positions:
                    type: array
                    items:
                      type: object
                      properties:
                        ticker:
                          type: string
                        paper_entry_price:
                          type: number
                        current_market_price:
                          type: number
                        paper_pnl_usd:
                          type: number
                        paper_pnl_pct:
                          type: number
                        date_opened:
                          type: string
                          nullable: true
                        position_size:
                          type: number
        "500":
          description: Alpaca API error

  /reports/tax-year:
    get:
      tags: [Reports]
      summary: Get UK tax-year P&L report
      description: >
        Returns realised P&L for a UK tax year (6 Apr YYYY to 5 Apr YYYY+1),
        including closed trades, summary totals, and estimated unrealised P&L on open positions.
        Pass format=pdf to receive a PDF file download instead of JSON.
        Pass format=csv to receive a CSV file download instead of JSON.
        Canonical contract: docs/specs/api_contracts/reports_endpoints.md v0.3.
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2099
          description: Tax year start year (e.g. 2025 for 2025/26 tax year)
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [pdf, csv]
          description: Response format. Omit for JSON (default). Pass pdf for PDF download. Pass csv for CSV download.
      responses:
        "200":
          description: Tax-year P&L report (JSON) or PDF download
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      tax_year_label:
                        type: string
                        example: "2025/26"
                      tax_year_start:
                        type: string
                        format: date
                      tax_year_end:
                        type: string
                        format: date
                      summary:
                        type: object
                      trades:
                        type: array
                        items:
                          type: object
                      estimated_unrealised_pnl:
                        type: number
                      unrealised_note:
                        type: string
            application/pdf:
              schema:
                type: string
                format: binary
                description: >
                  PDF document containing the tax-year P&L report.
                  Returned when format=pdf query parameter is supplied.
                  Content-Disposition header set to attachment with filename tax-year-{year}-pnl.pdf.
            text/csv:
              schema:
                type: string
                description: >
                  CSV file containing the tax-year P&L report.
                  Returned when format=csv query parameter is supplied.
                  Structure: 5-row metadata block, blank row, 17-column trades table with human-readable headers.
                  Content-Disposition set to attachment with filename tax-year-{year}-pnl.csv.
                  Canonical contract: docs/specs/api_contracts/reports_endpoints.md v0.3.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /reports/monthly-pnl:
    get:
      tags: [Reports]
      summary: Get month-by-month realised P&L
      description: >
        Returns month-by-month realised P&L for the current and prior calendar year.
        Only months with closed trades are included. Sorted descending by year then month.
        Canonical contract: docs/specs/api_contracts/reports_endpoints.md v0.4. ST-11 (v3.1).
      responses:
        "200":
          description: Monthly P&L summary array
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        year:
                          type: integer
                          example: 2026
                        month:
                          type: integer
                          example: 4
                        realised_pnl_gbp:
                          type: number
                          example: 340.50
                        trade_count:
                          type: integer
                          example: 3
        "500":
          $ref: "#/components/responses/InternalError"

  /alerts/rules:
    get:
      tags: [Alerts]
      summary: List alert rules
      description: >
        Return all alert rules for the portfolio. Seeds default rules for all four alert types on first call.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      responses:
        "200":
          description: Alert rules list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AlertRule"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Alerts]
      summary: Create alert rule
      description: >
        Create an alert rule. Returns 400 if a rule for this type already exists.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertRuleRequest"
      responses:
        "200":
          description: Alert rule created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /alerts/rules/{rule_id}:
    patch:
      tags: [Alerts]
      summary: Update alert rule
      description: >
        Update enabled state or threshold_percent for an alert rule. Partial update.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      parameters:
        - in: path
          name: rule_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertRuleRequest"
      responses:
        "200":
          description: Alert rule updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Alerts]
      summary: Delete alert rule
      description: >
        Delete an alert rule. May be recreated via POST /alerts/rules.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      parameters:
        - in: path
          name: rule_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Alert rule deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: boolean
                            example: true
                          id:
                            type: string
                            format: uuid
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /alerts/evaluate:
    post:
      tags: [Alerts]
      summary: Trigger alert evaluation
      description: >
        Evaluate all enabled alert rules against current portfolio state. Writes notification records
        and enqueues email delivery as FastAPI BackgroundTasks (ADR-003). Response is immediate.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      responses:
        "200":
          description: Evaluation complete
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AlertEvaluationResult"
        "500":
          $ref: "#/components/responses/InternalError"

  /alerts/history:
    get:
      tags: [Alerts]
      summary: Get alert evaluation history
      description: >
        Return audit log of every alert rule evaluation, newest first.
        Supports last_n_days (default 30) or last_n_records filtering.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.3.
      parameters:
        - in: query
          name: last_n_days
          required: false
          schema:
            type: integer
            minimum: 1
          description: Return evaluations from the last N days (default 30)
        - in: query
          name: last_n_records
          required: false
          schema:
            type: integer
            minimum: 1
          description: Return the last N records regardless of date (takes precedence over last_n_days)
      responses:
        "200":
          description: Alert evaluation history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AlertHistoryResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications:
    get:
      tags: [Notifications]
      summary: Get notification feed
      description: >
        Return notifications newest first. Page-based pagination, 50 items per page.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
      responses:
        "200":
          description: Notification feed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NotificationFeedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications/{id}:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      description: >
        Mark a single notification as read. Idempotent.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NotificationItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications/mark-all-read:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      description: >
        Mark all unread notifications as read. Idempotent.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      responses:
        "200":
          description: All notifications marked read
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          marked_read_count:
                            type: integer
                            example: 12
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get notification preferences
      description: >
        Return per-type email delivery preferences. Seeds defaults on first call.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NotificationPreferencesResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Notifications]
      summary: Update notification preferences
      description: >
        Update email preferences for one or more alert types. Partial update.
        Body is a map of alert_type keys to preference objects.
        Canonical contract: docs/specs/api_contracts/alerts_endpoints.md v0.1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPreferencesRequest"
      responses:
        "200":
          description: Preferences updated — returns full updated preferences list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiOk"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NotificationPreferencesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions:
    get:
      tags: [Positions]
      summary: Get all open positions
      description: |
        Returns open positions with live prices, stops, and P&L.
        Fetches refreshed market pricing on every call.
      responses:
        "200":
          $ref: "#/components/responses/OkPositions"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/compliance:
    get:
      tags: [Positions]
      summary: Get per-position strategy compliance flags
      description: |
        Returns ATR-based stop compliance, stop age, and size compliance flags
        for all open positions. Display-only — no automated action generated
        (§13.3 constraint). Strategy Rules & System Intent Owner DoQ sign-off
        required at delivery verification (SPS=4, ST-01 BLG-FEAT-11 v2.3).
      responses:
        "200":
          description: Compliance data returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      overall_status:
                        type: string
                        enum: [Compliant, "Needs Attention", "Review Required"]
                      compliant_count:
                        type: integer
                      total_count:
                        type: integer
                      positions:
                        type: array
                        items:
                          type: object
                          properties:
                            position_id:
                              type: string
                              format: uuid
                            ticker:
                              type: string
                            market:
                              type: string
                              enum: [UK, US]
                            stop_compliant:
                              type: boolean
                              nullable: true
                            stop_age_days:
                              type: integer
                              nullable: true
                            size_compliant:
                              type: boolean
                              nullable: true
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/analyze:
    get:
      tags: [Positions]
      summary: Run daily position analysis
      description: |
        Deterministic daily monitoring:
        - Updates all prices
        - Recalculates stops
        - Checks market regime
        - Recommends HOLD/EXIT actions
      responses:
        "200":
          $ref: "#/components/responses/OkPositionAnalysis"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}:
    get:
      tags: [Positions]
      summary: Get single position by ID
      description: |
        Returns a single open or closed position with live prices (for open positions)
        and lifecycle state fields: position_state, state_entered_at, days_in_state.
        Lifecycle state is lazily recalculated on each call. (v3.3 EPIC-01 ST-02)
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
          description: Position UUID
      responses:
        "200":
          description: Position returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  position_state:
                    type: string
                    enum: [GRACE, LOSING, PROFITABLE, "EXIT ZONE", UNKNOWN]
                    nullable: true
                  state_entered_at:
                    type: string
                    format: date-time
                    nullable: true
                  days_in_state:
                    type: integer
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/refresh-state:
    post:
      tags: [Positions]
      summary: Refresh lifecycle state for a position
      description: |
        Explicitly recomputes and persists the lifecycle state for a single position.
        Returns the updated state fields. §13 display-only — no automated action.
        (v3.3 EPIC-01 ST-02)
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
          description: Position UUID
      responses:
        "200":
          description: State refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      position_id:
                        type: string
                        format: uuid
                      position_state:
                        type: string
                        enum: [GRACE, LOSING, PROFITABLE, "EXIT ZONE", UNKNOWN]
                      state_entered_at:
                        type: string
                        format: date-time
                        nullable: true
                      days_in_state:
                        type: integer
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/exit:
    post:
      tags: [Positions]
      summary: Exit a position
      description: |
        Exit full or partial position using user-provided prices.
        Records in trade history and updates cash.
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
          description: Position UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExitPositionRequest"
            example:
              shares: 10.5
              exit_price: 920.0
              exit_date: "2026-02-15"
              exit_reason: "Target Reached"
              exit_fx_rate: 1.365
              exit_note: "Hit target, took profits"
      responses:
        "200":
          $ref: "#/components/responses/OkExitPosition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/note:
    patch:
      tags: [Journal]
      summary: Update position notes
      description: |
        Update entry and/or exit notes for a position.
        Pass null to clear a note.
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkUpdateNote"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/tags:
    patch:
      tags: [Positions]
      summary: Update position tags
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagsRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkUpdateTags"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/tags:
    get:
      tags: [Positions]
      summary: Get all tags
      description: Returns all unique tags in use across open positions.
      responses:
        "200":
          $ref: "#/components/responses/OkTagsList"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/search/tags:
    get:
      tags: [Positions]
      summary: Search positions by tags
      description: Search open and closed positions by one or more tags (OR match, case-insensitive).
      parameters:
        - in: query
          name: tags
          required: true
          schema:
            type: string
          description: Comma-separated list of tags to search for.
      responses:
        "200":
          description: Array of matching position objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Position"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/grace-period-alerts:
    get:
      tags: [Positions]
      summary: Grace period alerts
      description: >
        Returns positions in GRACE lifecycle state where days_in_state >= 8 (nearing end of grace
        period). Includes linked trade plan summary if available.
        §13 display-only — system surfaces context; human decides next action.
        Spec: docs/specs/api_contracts/grace_period_alert_endpoint.md
      responses:
        "200":
          description: Array of grace period alert objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        position_id:
                          type: string
                          format: uuid
                        ticker:
                          type: string
                        market:
                          type: string
                          enum: [US, UK]
                        days_in_state:
                          type: integer
                        trade_plan_id:
                          type: string
                          format: uuid
                          nullable: true
                        trade_plan_summary:
                          type: object
                          nullable: true
                          properties:
                            setup_thesis:
                              type: string
                              nullable: true
                            entry_rationale:
                              type: string
                              nullable: true
                            stop_level:
                              type: number
                              nullable: true
                            r_target:
                              type: number
                              nullable: true
        "500":
          $ref: "#/components/responses/InternalError"

  /positions/{position_id}/stop-trail:
    get:
      tags: [Positions]
      summary: ATR trail stop recommendation
      description: >
        Returns ATR-based trail stop calculation for a single open position.
        trail_multiplier defaults to 2.0.
        §13 display-only — recommendation is informational; human must confirm any stop change.
        Spec: docs/specs/api_contracts/stop_trail_endpoint.md
      parameters:
        - in: path
          name: position_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stop trail calculation result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      position_id:
                        type: string
                        format: uuid
                      ticker:
                        type: string
                      current_price:
                        type: number
                      current_stop:
                        type: number
                        nullable: true
                      atr_trail_stop:
                        type: number
                      trail_difference:
                        type: number
                        nullable: true
                      trail_r_terms:
                        type: number
                        nullable: true
                      recommendation:
                        type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: ATR not available for position.
        "503":
          description: Live price unavailable.
        "500":
          $ref: "#/components/responses/InternalError"

  /trades:
    get:
      tags: [Trades]
      summary: Get trade history
      description: Retrieve all closed trades with statistics.
      responses:
        "200":
          $ref: "#/components/responses/OkTrades"
        "500":
          $ref: "#/components/responses/InternalError"

  /trades/{trade_id}/reflection:
    get:
      tags: [Trades]
      summary: Get trade reflection
      description: "Retrieve saved reflection for a closed trade. Returns 404 if no reflection saved yet. Spec: trade_reflection.md §7."
      parameters:
        - name: trade_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reflection retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkReflection"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Trades]
      summary: Save trade reflection
      description: "Create or update (upsert) the reflection for a closed trade. All fields optional. Idempotent. Spec: trade_reflection.md §7."
      parameters:
        - name: trade_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReflectionRequest"
      responses:
        "200":
          description: Reflection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkReflection"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /trades/export/csv:
    get:
      tags: [Trades]
      summary: Export trade history as CSV
      description: "Export full closed trade history as a downloadable CSV file. Returns all trades; no date filter in v1.6.1. Response is text/csv with attachment disposition. Canonical contract: docs/specs/api_contracts/trade_endpoints.md"
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                description: "UTF-8 CSV with header row. Columns: ticker, market, entry_date, exit_date, shares, entry_price, exit_price, pnl, pnl_pct, holding_days, exit_reason, tags (semicolon-separated), entry_note, exit_note."
        "500":
          $ref: "#/components/responses/InternalError"

  /cash/transaction:
    post:
      tags: [Cash]
      summary: Record cash transaction
      description: Record deposit or withdrawal for accurate P&L.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransactionRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkCashTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /cash/transactions:
    get:
      tags: [Cash]
      summary: List cash transactions
      parameters:
        - in: query
          name: order
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        "200":
          $ref: "#/components/responses/OkCashTransactions"
        "500":
          $ref: "#/components/responses/InternalError"

  /cash/summary:
    get:
      tags: [Cash]
      summary: Get cash flow summary
      responses:
        "200":
          $ref: "#/components/responses/OkCashSummary"
        "500":
          $ref: "#/components/responses/InternalError"

  /signals/generate:
    post:
      tags: [Signals]
      summary: Generate momentum signals
      parameters:
        - in: query
          name: lookback_days
          schema:
            type: integer
            default: 252
            minimum: 1
        - in: query
          name: top_n
          schema:
            type: integer
            default: 5
            minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/OkSignalsGenerate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /signals:
    get:
      tags: [Signals]
      summary: List signals
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [new, entered, dismissed, expired, already_held]
      responses:
        "200":
          $ref: "#/components/responses/OkSignalsList"
        "500":
          $ref: "#/components/responses/InternalError"

  /signals/{signal_id}:
    patch:
      tags: [Signals]
      summary: Update signal status
      parameters:
        - in: path
          name: signal_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [entered, dismissed, expired]
      responses:
        "200":
          $ref: "#/components/responses/OkSignal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Signals]
      summary: Delete signal
      description: |
        Hard delete a signal record. Non-idempotent:
        a second call returns 404.
      parameters:
        - in: path
          name: signal_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/OkDelete"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/metrics:
    get:
      tags: [Analytics]
      summary: Get analytics metrics
      description: |
        Unified analytics endpoint returning all analytics data for a given period.
        All monetary values in analytics are GBP.
        When insufficient data exists (total_trades < min_required), the API returns 200
        with has_enough_data=false and empty metric objects.
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: string
            enum: [all_time, last_7_days, last_month, last_quarter, last_year, ytd]
            default: all_time
      responses:
        "200":
          $ref: "#/components/responses/OkAnalyticsMetrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/cohort:
    get:
      tags: [Analytics]
      summary: Get cohort analysis
      description: |
        Groups all closed trades by entry period (month/quarter/year) and returns
        per-cohort performance metrics: trade count, win rate, avg R-multiple (server-side),
        and total P&L in GBP. Fewer than 3 distinct periods returns has_enough_data=false.
        Canonical contract: docs/specs/api_contracts/analytics_endpoints.md §GET /analytics/cohort
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: string
            enum: [month, quarter, year]
            default: month
      responses:
        "200":
          description: Cohort analysis data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      period:
                        type: string
                        example: month
                      has_enough_data:
                        type: boolean
                      cohorts:
                        type: array
                        items:
                          type: object
                          properties:
                            period_label:
                              type: string
                              example: "Mar 2026"
                            trade_count:
                              type: integer
                            win_rate:
                              type: number
                              format: float
                            avg_r_multiple:
                              type: number
                              format: float
                              nullable: true
                            total_pnl:
                              type: number
                              format: float
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/r-multiple-distribution:
    get:
      tags: [Analytics]
      summary: Get canonical R-multiple distribution
      description: |
        Returns server-side R-multiple distribution across all closed trades.
        Formula: R = (exit_price - entry_price) / (entry_price - initial_stop_price).
        Requires positions.initial_stop via LEFT JOIN. Minimum 5 qualifying trades.
        Canonical contract: docs/specs/api_contracts/analytics_endpoints.md §GET /analytics/r-multiple-distribution
      responses:
        "200":
          description: R-multiple distribution data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      has_enough_data:
                        type: boolean
                      total_qualifying_trades:
                        type: integer
                      buckets:
                        type: array
                        items:
                          type: object
                          properties:
                            range:
                              type: string
                              example: "0R to 1R"
                            count:
                              type: integer
                      median_r:
                        type: number
                        format: float
                        nullable: true
                      pct_above_1r:
                        type: number
                        format: float
                        nullable: true
                      avg_winner_r:
                        type: number
                        format: float
                        nullable: true
                      avg_loser_r:
                        type: number
                        format: float
                        nullable: true
        "500":
          $ref: "#/components/responses/InternalError"

  /analytics/market-correlation:
    get:
      tags: [Analytics]
      summary: Get per-position Pearson correlation vs benchmark
      description: |
        Returns Pearson correlation coefficients between each open position and its
        relevant benchmark (SPY for US, ^FTSE for UK) over a configurable lookback.
        Also returns a portfolio-level equal-weighted average correlation.
        Results are cached with an 8-hour TTL. Yahoo Finance data source — graceful
        partial response if data unavailable for individual tickers.
        Canonical contract: docs/specs/api_contracts/analytics_endpoints.md §GET /analytics/market-correlation
      parameters:
        - name: lookback
          in: query
          required: false
          schema:
            type: integer
            default: 252
            minimum: 30
            maximum: 756
          description: Lookback window in trading days (default 252)
      responses:
        "200":
          description: Market correlation data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      correlations:
                        type: array
                        items:
                          type: object
                          properties:
                            ticker:
                              type: string
                            market:
                              type: string
                              enum: [UK, US]
                            benchmark:
                              type: string
                              enum: [SPY, FTSE]
                            correlation:
                              type: number
                              format: float
                              nullable: true
                            severity:
                              type: string
                              enum: [high, moderate, low, unknown]
                            lookback_days:
                              type: integer
                            data_points:
                              type: integer
                      portfolio_correlation:
                        type: object
                        properties:
                          value:
                            type: number
                            format: float
                            nullable: true
                          severity:
                            type: string
                          method:
                            type: string
                            example: equal_weighted_average
                      lookback_days:
                        type: integer
                      computed_at:
                        type: string
                        format: date-time
                      cached:
                        type: boolean
                      data_source:
                        type: string
                        example: Yahoo Finance
        "500":
          $ref: "#/components/responses/InternalError"

  /ai/journal-summary:
    post:
      tags: [AI]
      summary: Summarise trade journal notes via LLM
      description: |
        Accepts trade IDs or a date range; retrieves entry/exit journal notes from
        closed trades and calls an external LLM API (Anthropic) to produce a plain-text
        summary of themes and patterns. AI output is display-only and must NOT be used
        in any signal, scoring, or recommendation calculation. SRB-v1.7 CONDITIONALLY COMPLIANT.
        Returns summary=null with informational message when LLM unavailable (no 500).
        Canonical contract: docs/specs/api_contracts/ai_endpoints.md v1.0 §POST /ai/journal-summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trade_ids:
                  type: array
                  items:
                    type: integer
                  nullable: true
                  description: Closed trade IDs to summarise. If provided, date range is ignored.
                date_from:
                  type: string
                  format: date
                  nullable: true
                  description: Start date for trade filter (inclusive).
                date_to:
                  type: string
                  format: date
                  nullable: true
                  description: End date for trade filter (inclusive).
      responses:
        "200":
          description: AI journal summary (or null if unavailable/no notes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                    nullable: true
                    description: LLM-generated summary text. Null if unavailable or no notes.
                  trade_count:
                    type: integer
                    description: Number of closed trades whose notes were included.
                  model:
                    type: string
                    nullable: true
                    description: LLM model identifier used.
                  cached:
                    type: boolean
                    description: Reserved for future caching; always false in v1.0.
                  message:
                    type: string
                    nullable: true
                    description: Informational message when summary is null.
        "422":
          description: Neither trade_ids nor a date range provided.
        "500":
          $ref: "#/components/responses/InternalError"

  /digest/weekly:
    get:
      tags: [Digest]
      summary: Get 7-day weekly trading digest
      description: |
        Returns a 7-day summary of realised P&L, unrealised P&L delta, alert counts,
        compliance score (current and 7-day baseline), and data staleness.
        All fields are raw numeric or boolean values — no generated text or interpretation.
        Canonical contract: docs/specs/api_contracts/digest_endpoints.md v0.1
      responses:
        "200":
          description: Weekly digest data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      realised_pnl_7d:
                        type: number
                        format: float
                        description: Sum of P&L for trades closed in the last 7 days (GBP)
                      unrealised_pnl_delta_7d:
                        type: number
                        format: float
                        nullable: true
                        description: Change in unrealised P&L over 7 days from portfolio snapshots
                      alerts_fired_7d:
                        type: integer
                        description: Count of notifications created in the last 7 days
                      alerts_dismissed_7d:
                        type: integer
                        description: Count of notifications marked read in the last 7 days
                      compliance_score_current:
                        type: number
                        format: float
                        description: Journal completion rate across all closed trades (0-100)
                      compliance_score_7d_ago:
                        type: number
                        format: float
                        description: Journal completion rate for trades closed before the 7-day window (0-100)
                      staleness_hours:
                        type: number
                        format: float
                        nullable: true
                        description: Hours since last portfolio snapshot; null if no snapshots
                      as_of_utc:
                        type: string
                        format: date-time
                        description: UTC timestamp this response was computed
        "500":
          $ref: "#/components/responses/InternalError"

  /validate/calculations:
    post:
      tags: [Analytics]
      summary: Validate analytics calculations
      description: |
        Smoke-tests analytics calculations against a fixed internal test dataset.
        Does not write to business data.
        Each validation result includes a severity field (critical/high/medium/low).
        The summary includes a by_severity breakdown.
        Canonical contract: docs/specs/api_contracts/analytics_endpoints.md
      responses:
        "200":
          $ref: "#/components/responses/OkValidation"
        "500":
          $ref: "#/components/responses/InternalError"

  /market/status:
    get:
      tags: [Market]
      summary: Get market regime status
      description: |
        Returns current market regime (SPY and FTSE vs 200-day MA) and live GBP/USD FX rate.
        Canonical contract: docs/specs/api_contracts/market_endpoints.md v0.1
      responses:
        "200":
          $ref: "#/components/responses/OkMarketStatus"
        "500":
          $ref: "#/components/responses/InternalError"

  /settings:
    get:
      tags: [Settings]
      summary: Get strategy settings
      responses:
        "200":
          $ref: "#/components/responses/OkSettings"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Settings]
      summary: Create settings record
      description: |
        Creates a new settings record. Used to initialise settings if none exist.
        Canonical contract: docs/specs/api_contracts/settings_endpoints.md v1.1.0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkUpdateSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /settings/{settings_id}:
    patch:
      tags: [Settings]
      summary: Update strategy settings by ID
      description: |
        Updates one or more settings fields on an existing record.
        Fields not provided remain unchanged.
        Canonical contract: docs/specs/api_contracts/settings_endpoints.md v1.1.0
      parameters:
        - in: path
          name: settings_id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the settings record to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkUpdateSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      tags: [Health]
      summary: Operational health check (v2.2)
      description: |
        Returns DB connectivity and timestamps of last market status check and
        last alert evaluation. Schema updated in v2.2 (ST-08).
      security: []
      responses:
        "200":
          $ref: "#/components/responses/OkOperationalHealth"
        "500":
          $ref: "#/components/responses/InternalError"

  /health/detailed:
    get:
      tags: [Health]
      summary: Detailed health check
      responses:
        "200":
          $ref: "#/components/responses/OkHealthDetailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /health/database:
    get:
      tags: [Health]
      summary: Database size monitoring (BLG-OPS-09)
      description: |
        Returns current database size, percentage of Render free tier limit (256 MB) used,
        and configured alert threshold. Triggers a Telegram notification (notification-only,
        no automated cleanup) if usage is at or above the threshold.
        Contract: docs/specs/api_contracts/health_endpoints.md v1.2
      responses:
        "200":
          $ref: "#/components/responses/OkDatabaseSize"
        "500":
          $ref: "#/components/responses/InternalError"

  /test/endpoints:
    post:
      tags: [Health]
      summary: Test all endpoints
      description: Runs a smoke test against all registered endpoints and returns results.
      responses:
        "200":
          $ref: "#/components/responses/OkEndpointTest"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    ApiOk:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [ok]
        data:
          description: Payload varies by endpoint.
          type: object

    AlertRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [stop_loss_approach, grace_period_warning, market_regime_change, daily_portfolio_summary]
        enabled:
          type: boolean
        threshold_percent:
          type: number
          nullable: true
          description: Only for stop_loss_approach. null for other types.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAlertRuleRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [stop_loss_approach, grace_period_warning, market_regime_change, daily_portfolio_summary]
        enabled:
          type: boolean
          default: true
        threshold_percent:
          type: number
          description: Required for stop_loss_approach. Must be > 0 and <= 100.
          nullable: true

    UpdateAlertRuleRequest:
      type: object
      description: At least one field required.
      properties:
        enabled:
          type: boolean
        threshold_percent:
          type: number
          nullable: true
          description: Only applicable for stop_loss_approach. Must be > 0 and <= 100.

    AlertEvaluationResult:
      type: object
      properties:
        rules_evaluated:
          type: integer
        notifications_created:
          type: integer
        delivery_tasks_enqueued:
          type: integer
        redelivery_tasks_enqueued:
          type: integer
        evaluations_persisted:
          type: integer

    AlertEvaluationRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        evaluation_timestamp:
          type: string
          format: date-time
        rule_type:
          type: string
          enum: [stop_loss_approach, grace_period_warning, market_regime_change, daily_portfolio_summary]
        symbol:
          type: string
          nullable: true
          example: "AAPL"
        triggered:
          type: boolean
        notification_sent:
          type: boolean
        values_compared:
          type: object
          additionalProperties: true

    AlertHistoryResponse:
      type: object
      properties:
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/AlertEvaluationRecord"
        total:
          type: integer
          description: Total number of records matching the query

    NotificationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        alert_type:
          type: string
          enum: [stop_loss_approach, grace_period_warning, market_regime_change, daily_portfolio_summary]
        title:
          type: string
          example: "Stop Loss Approach — AAPL"
        message:
          type: string
        read:
          type: boolean
        created_at:
          type: string
          format: date-time

    NotificationFeedResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
          example: 50
        has_more:
          type: boolean

    NotificationPreferenceItem:
      type: object
      properties:
        alert_type:
          type: string
          enum: [stop_loss_approach, grace_period_warning, market_regime_change, daily_portfolio_summary]
        email_enabled:
          type: boolean

    NotificationPreferencesResponse:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/NotificationPreferenceItem"

    UpdateNotificationPreferencesRequest:
      type: object
      description: >
        Map of alert_type keys to preference updates. Include only types to change.
        Example: { "stop_loss_approach": { "email_enabled": false } }
      additionalProperties:
        type: object
        properties:
          email_enabled:
            type: boolean

    ReflectionRequest:
      type: object
      description: "Upsert payload for a trade reflection. All fields optional (500-char max each)."
      properties:
        trade_rationale:
          type: string
          nullable: true
          maxLength: 500
        what_worked:
          type: string
          nullable: true
          maxLength: 500
        what_didnt_work:
          type: string
          nullable: true
          maxLength: 500
        discipline_assessment:
          type: string
          nullable: true
          maxLength: 500
        key_takeaway:
          type: string
          nullable: true
          maxLength: 500

    ReflectionData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trade_id:
          type: string
          format: uuid
        trade_rationale:
          type: string
          nullable: true
        what_worked:
          type: string
          nullable: true
        what_didnt_work:
          type: string
          nullable: true
        discipline_assessment:
          type: string
          nullable: true
        key_takeaway:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OkReflection:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        data:
          $ref: "#/components/schemas/ReflectionData"

    ApiError:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string

    PortfolioOverview:
      type: object
      properties:
        cash: { type: number }
        cash_balance: { type: number }
        total_value: { type: number }
        open_positions_value: { type: number }
        total_pnl: { type: number }
        initial_value: { type: number }
        net_deposits: { type: number }
        live_fx_rate: { type: number }
        last_updated: { type: string, format: date-time }
        current_drawdown_percent:
          type: number
          format: float
          description: "Percentage decline from all-time peak portfolio value. Result is <= 0.0; zero means portfolio is at peak. Defaults to 0.0 when no portfolio_history exists."
        peak_portfolio_value:
          type: number
          format: float
          description: "All-time high total_value from portfolio_history (GBP, all-time, not period-scoped). Defaults to 0.0 when no portfolio_history exists."
        positions:
          type: array
          items: { $ref: "#/components/schemas/PositionSummary" }

    PositionSummary:
      type: object
      description: >
        Portfolio position summary object as returned by GET /portfolio.
        v1.9.0 field list per docs/specs/api_contracts/portfolio_endpoints.md.
        current_price is always GBP (USD converted via live_fx_rate for US positions).
        entry_price is in the instrument's native currency (USD for US, GBP for UK).
        pnl_pct is the percentage return relative to entry price (signed %).
        grace_days_remaining is max(0, 10 - holding_days) when grace_period is true; null otherwise.
      properties:
        id: { type: string, format: uuid }
        ticker: { type: string }
        market: { type: string, enum: [US, UK] }
        entry_date: { type: string, format: date }
        entry_price: { type: number }
        shares: { type: number }
        current_price: { type: number, description: "Always GBP regardless of instrument currency" }
        current_value: { type: number, description: "current_price × shares, in GBP" }
        pnl: { type: number }
        pnl_pct: { type: number, description: "Percentage return relative to entry price (signed %)" }
        current_stop: { type: number, description: "Current stop loss price in GBP" }
        holding_days: { type: integer }
        status: { type: string, enum: [open, closed] }
        display_status: { type: string, enum: [GRACE, PROFITABLE, LOSING] }
        fx_rate: { type: number, description: "FX rate stored at time of position entry" }
        grace_period: { type: boolean }
        grace_days_remaining: { type: integer, nullable: true }
        live_fx_rate: { type: number, description: "FX rate used for current price conversion" }

    Position:
      allOf:
        - $ref: "#/components/schemas/PositionSummary"
        - type: object
          properties:
            initial_stop: { type: number }
            atr_value: { type: number }
            fx_rate: { type: number }
            live_fx_rate: { type: number }
            entry_note: { type: string, nullable: true }
            exit_note: { type: string, nullable: true }
            tags:
              type: array
              items: { type: string }

    PortfolioSnapshot:
      type: object
      properties:
        id: { type: string, format: uuid }
        snapshot_date: { type: string, format: date }
        total_value: { type: number }
        cash_balance: { type: number }
        positions_value: { type: number }
        total_pnl: { type: number }
        position_count: { type: integer }
        created_at: { type: string, format: date-time }

    AddPositionRequest:
      type: object
      required: [ticker, entry_date, shares, entry_price]
      properties:
        ticker: { type: string, maxLength: 20 }
        market: { type: string, enum: [US, UK] }
        entry_date: { type: string, format: date }
        shares: { type: number, minimum: 0.0001 }
        entry_price: { type: number, minimum: 0.01 }
        fx_rate: { type: number, nullable: true }
        atr_value: { type: number, nullable: true }
        stop_price: { type: number, nullable: true }
        entry_note: { type: string, maxLength: 500, nullable: true }
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 20
            pattern: "^[a-z0-9-]+$"

    AddPositionResponse:
      type: object
      properties:
        ticker: { type: string }
        total_cost: { type: number }
        fees_paid: { type: number }
        entry_price: { type: number }
        initial_stop: { type: number }
        remaining_cash: { type: number }
        position_id: { type: string, format: uuid }

    SizePositionRequest:
      type: object
      required: [entry_price, stop_price, risk_percent]
      properties:
        entry_price:
          type: number
          minimum: 0.0001
          description: Prospective entry price in instrument's native currency (GBP for UK, USD for US)
        stop_price:
          type: number
          minimum: 0.0001
          description: Intended initial stop price in instrument's native currency
        risk_percent:
          type: number
          minimum: 0.0001
          description: Percentage of portfolio value to risk (e.g. 1.0 = 1%)
        market:
          type: string
          enum: [US, UK]
          description: Market determines fee schedule and FX conversion
        fx_rate:
          type: number
          nullable: true
          description: Override FX rate (USD/GBP). If omitted, live rate is fetched.

    PositionSizeResponse:
      type: object
      description: |
        Intentionally broad to avoid drift. Canonical nested field definitions live in:
        docs/specs/api_contracts/portfolio_endpoints.md
      additionalProperties: true

    ExitPositionRequest:
      type: object
      required: [shares, exit_price, exit_date]
      properties:
        shares: { type: number, minimum: 0.0001 }
        exit_price: { type: number, minimum: 0.0001 }
        exit_date: { type: string, format: date }
        exit_reason: { type: string, nullable: true }
        exit_fx_rate: { type: number, nullable: true }
        exit_note: { type: string, maxLength: 500, nullable: true }

    ExitPositionResponse:
      type: object
      properties:
        ticker: { type: string }
        shares_exited: { type: number }
        realized_pnl: { type: number }
        exit_price: { type: number }
        fees_paid: { type: number }
        remaining_shares: { type: number }
        cash_received: { type: number }

    UpdateNoteRequest:
      type: object
      properties:
        entry_note: { type: string, nullable: true, maxLength: 500 }
        exit_note: { type: string, nullable: true, maxLength: 500 }

    UpdateNoteResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        entry_note: { type: string, nullable: true }
        exit_note: { type: string, nullable: true }

    UpdateTagsRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 20
            pattern: "^[a-z0-9-]+$"

    UpdateTagsResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }

    TagsListResponse:
      type: object
      properties:
        tags:
          type: array
          items: { type: string }

    TradeHistoryResponse:
      type: object
      description: |
        Canonical nested field definitions: docs/specs/api_contracts/trade_endpoints.md
        v1.9.0: trade objects include holding_days; both pnl_pct and pnl_percent returned for compatibility.
        v2.1.0 (ST-14): avg_slippage_pct added to top-level summary; fill_price and slippage_pct added per trade.
        v2.2.0 (ST-09): avg_fee_drag_pct added to top-level summary; fee_drag_pct added per trade.
      properties:
        total_trades: { type: integer }
        win_rate: { type: number }
        total_pnl: { type: number }
        avg_slippage_pct:
          type: number
          nullable: true
          description: "Mean slippage across all trades with fill_price recorded. null when no trades have fill_price."
        avg_fee_drag_pct:
          type: number
          nullable: true
          description: "Mean fee drag across all trades where gross_proceeds > 0. exit_fees / gross_proceeds * 100. null when no qualifying trades."
        trades:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              ticker: { type: string }
              market: { type: string, enum: [US, UK] }
              entry_date: { type: string, format: date }
              exit_date: { type: string, format: date }
              shares: { type: number }
              entry_price: { type: number }
              exit_price: { type: number }
              fill_price:
                type: number
                nullable: true
                description: "Actual fill price in native currency. null for trades entered before v2.1."
              slippage_pct:
                type: number
                nullable: true
                description: "(fill_price − entry_price) / entry_price * 100. Negative = favourable. null when fill_price is null."
              fee_drag_pct:
                type: number
                nullable: true
                description: "exit_fees / gross_proceeds * 100. Always non-negative. null when gross_proceeds is null or zero."
              pnl: { type: number }
              pnl_pct: { type: number }
              pnl_percent: { type: number, description: "Alias of pnl_pct for backward compatibility" }
              holding_days: { type: integer }
              exit_reason: { type: string, nullable: true }
              entry_note: { type: string, nullable: true }
              exit_note: { type: string, nullable: true }
              tags: { type: array, items: { type: string } }

    CashTransactionRequest:
      type: object
      required: [type, amount, date]
      properties:
        type: { type: string, enum: [deposit, withdrawal] }
        amount: { type: number, minimum: 0.01 }
        date: { type: string, format: date }
        note: { type: string, nullable: true }

    CashTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [deposit, withdrawal] }
        amount: { type: number }
        date: { type: string, format: date }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    CashTransactionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }

    CashSummary:
      type: object
      properties:
        total_deposits: { type: number }
        total_withdrawals: { type: number }
        net_cash_flow: { type: number }

    Signal:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticker: { type: string }
        market: { type: string, enum: [US, UK] }
        signal_date: { type: string, format: date }
        status: { type: string, enum: [new, entered, dismissed, expired, already_held] }
        momentum_score: { type: number }
        current_price: { type: number }
        reason: { type: string, nullable: true }
        relative_strength_pct:
          type: number
          format: float
          nullable: true
          description: "ST-09 supplementary. Stock momentum % minus benchmark momentum % over lookback_days. Display-only — does not affect rank."
        week52_high_proximity_pct:
          type: number
          format: float
          nullable: true
          description: "ST-09 supplementary. (current_native_price - 52w_high) / 52w_high * 100. Negative = below 52-week high. Display-only."
        avg_daily_volume_20d:
          type: integer
          nullable: true
          description: "ST-09 supplementary. Average daily trading volume over last 20 trading days (native exchange units). Display-only."
        price_vs_50d_ma:
          type: number
          format: float
          nullable: true
          description: "ST-09 supplementary. (current_native_price - 50d_MA) / 50d_MA * 100. Positive = above MA. Display-only."

    AnalyticsMetricsResponse:
      type: object
      description: |
        Intentionally broad to avoid drift. Canonical nested field definitions live in:
        docs/specs/api_contracts/analytics_endpoints.md
        BLG-SPEC-G6 (v2.1): total_return_pct is now returned.
        Formula: total_pnl / net_cash_flow × 100,
        where net_cash_flow = total_deposits − total_withdrawals.
        ST-02 (v2.3): last_sync_at (string, ISO 8601 UTC) added — timestamp of metrics
        computation time. Used by frontend Metrics Staleness Indicator (4h threshold).
        See analytics_endpoints.md v2.0.0 §last_sync_at.
      additionalProperties: true

    ValidationResponse:
      type: object
      description: |
        Validation payload.
        Intentionally broad to avoid drift. Canonical nested field definitions live in:
        docs/specs/api_contracts/analytics_endpoints.md
        v1.9.0: 14 validated metrics total. Each result includes severity
        (critical | high | medium | low) and optional method field (Sharpe only).
        Critical metrics: sharpe_ratio, max_drawdown_percent, profit_factor,
        sharpe_ratio_trade_method. Summary includes by_severity breakdown.
        See analytics_endpoints.md §POST /validate/calculations for the full
        severity model and per-metric assignments.
      additionalProperties: true

    Settings:
      type: object
      description: |
        Settings object. Canonical field meanings and constraints live in:
        docs/specs/api_contracts/settings_endpoints.md
        Includes default_risk_percent (float, > 0, <= 100) added in v1.8.0
        for Position Sizing Calculator pre-population support.
      additionalProperties: true

    UpdateSettingsRequest:
      type: object
      description: |
        All fields optional. Only provided fields are updated.
        Canonical field meanings and constraints live in:
        docs/specs/api_contracts/settings_endpoints.md
        Includes default_risk_percent (float, > 0, <= 100) added in v1.8.0.
      additionalProperties: true

    MarketStatus:
      type: object
      description: |
        Market status payload. No dedicated canonical Markdown contract exists yet.
        Market regime data is currently surfaced inline via GET /positions/analyze.
        See docs/specs/api_contracts/position_endpoints.md for the analyze response shape.
      additionalProperties: true

    OperationalHealthResponse:
      type: object
      description: |
        Operational health response for GET /health (v2.2, ST-08).
        Returns DB status and last operation timestamps.
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok, error]
        db:
          type: string
          enum: [connected, error]
        last_market_status_check:
          type: string
          format: date-time
          nullable: true
        last_alert_evaluation:
          type: string
          format: date-time
          nullable: true

    DatabaseSizeResponse:
      type: object
      description: |
        Database size monitoring response for GET /health/database (v2.3, ST-08 BLG-OPS-09).
        Returns current DB size, percentage of Render free tier limit (256 MB) used,
        and configured alert threshold. Alert is notification-only (no automated cleanup).
        Contract: docs/specs/api_contracts/health_endpoints.md v1.2
      required: [status, limit_bytes, limit_mb, threshold_percent]
      properties:
        size_bytes:
          type: integer
          nullable: true
          description: Raw database size in bytes (null if query failed).
        size_mb:
          type: number
          nullable: true
          description: Database size in megabytes, 2 d.p. (null if query failed).
        limit_bytes:
          type: integer
          description: Render free tier limit — 268,435,456 bytes (256 MB). Fixed constant.
        limit_mb:
          type: number
          description: Render free tier limit in megabytes — always 256.0.
        used_percent:
          type: number
          nullable: true
          description: Percentage of limit used (2 d.p.). Null if query failed.
        threshold_percent:
          type: number
          description: Alert threshold from DB_SIZE_ALERT_THRESHOLD_PERCENT env var (default 80).
        status:
          type: string
          enum: [ok, warning, error]
          description: |
            "ok" — below threshold.
            "warning" — at or above threshold; Telegram notification sent if credentials configured.
            "error" — database size query failed.
        error:
          type: string
          description: Error message when status is "error". Omitted otherwise.

    HealthResponse:
      type: object
      required: [status, timestamp, version]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string

    HealthDetailedResponse:
      allOf:
        - $ref: "#/components/schemas/HealthResponse"
        - type: object
          properties:
            response_time_ms: { type: number }
            checks:
              type: object
              additionalProperties: true

    EndpointTestResponse:
      type: object
      description: |
        Endpoint test results payload. Canonical structure lives in:
        docs/specs/api_contracts/health_endpoints.md
      additionalProperties: true

  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication via X-API-Key header

  responses:
    BadRequest:
      description: Validation error or business rule violation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    OkPortfolioOverview:
      description: Portfolio overview retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiOk"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PortfolioOverview"

    OkAddPosition:
      description: Position created successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiOk"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AddPositionResponse"

    OkPositionSize:
      description: Position size calculated
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiOk"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PositionSizeResponse"

    OkPortfolioSnapshot:
      description: Snapshot created/updated
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiOk"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PortfolioSnapshot"

    OkPortfolioHistory:
      description: Portfolio history retrieved
