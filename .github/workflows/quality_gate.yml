name: "Quality & Governance Gate"

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize]

jobs:
  verify_governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title for ID
        run: |
          # Ensures the PR title includes an EPIC/ST ID or [GOVERNANCE] prefix
          if [[ ! "${{ github.event.pull_request.title }}" =~ \[(EPIC|ST)-[0-9]+\] ]] && \
             [[ ! "${{ github.event.pull_request.title }}" =~ ^\[GOVERNANCE\] ]]; then
            echo "Error: PR title must include a Governance ID (e.g., [EPIC-01]) or start with [GOVERNANCE]."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify QA Evidence (EPIC PRs only)
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"

          # Skip for GOVERNANCE and ST-prefixed PRs (no EPIC-level QA evidence required)
          if [[ "$PR_TITLE" =~ ^\[GOVERNANCE\] ]] || [[ "$PR_TITLE" =~ ^\[ST- ]]; then
            echo "Non-EPIC PR — QA evidence check skipped."
            exit 0
          fi

          # Extract EPIC-xx from title
          EPIC_ID=$(echo "$PR_TITLE" | grep -oP 'EPIC-\d+' | head -1)
          if [ -z "$EPIC_ID" ]; then
            echo "No EPIC ID found — QA evidence check skipped."
            exit 0
          fi

          # Read active cycle from state pointer
          if [ ! -f ".claude_current_state.json" ]; then
            echo "Error: .claude_current_state.json not found."
            exit 1
          fi
          ACTIVE_CYCLE=$(jq -r '.active_cycle' .claude_current_state.json)
          if [ -z "$ACTIVE_CYCLE" ] || [ "$ACTIVE_CYCLE" = "null" ]; then
            echo "Error: active_cycle not set in .claude_current_state.json."
            exit 1
          fi

          QA_FILE="claude/cycles/${ACTIVE_CYCLE}/qa_evidence_${EPIC_ID}.md"

          if [ ! -f "$QA_FILE" ]; then
            echo "Error: QA evidence file not found: $QA_FILE"
            echo "The QA evidence file must be committed to this branch before opening a PR."
            echo "Per PR template §DoQ Sign-Off Confirmation: do not open a PR without committed QA evidence."
            exit 1
          fi

          # Verify sign-off Date: field is non-blank
          if ! grep -qP 'Date:\s*\d{4}-\d{2}-\d{2}' "$QA_FILE"; then
            echo "Error: $QA_FILE has a blank or invalid Date: field in the DoQ sign-off block."
            echo "DoQ sign-off must be applied during sprint execution (date format: YYYY-MM-DD)."
            exit 1
          fi

          echo "QA evidence verified: $QA_FILE"
          grep -P 'Date:\s*\d{4}-\d{2}-\d{2}' "$QA_FILE" | head -3

  api_baseline_drift:
    name: API Performance Baseline Drift Detection (ST-12)
    runs-on: ubuntu-latest

    # [EPIC-03][ST-12] — Flags endpoints present in docs/reference/openapi.yaml
    # that are not yet reflected in docs/ops/api_performance_baseline.md.
    # Complements openapi-drift.yml (which checks openapi.yaml against
    # docs/specs/api_contracts/*.md) with a separate check against the
    # performance baseline record. See CLAUDE.md "API performance baseline
    # advisory (AUD-2026-06-22-006)" — this promotes that advisory to a hard gate.
    #
    # Path parameters are normalised to {id} before comparison (openapi.yaml
    # uses semantic names like {position_id}/{trade_id}; the baseline doc
    # uses a generic {id} placeholder throughout) to avoid false positives.
    #
    # KNOWN_GAPS grandfathers pre-existing endpoints that predate this gate
    # (v6.8) — new entries must not be added to this list; they must be
    # measured and added to api_performance_baseline.md instead (BLG-OPS-61
    # tracks closing the pre-existing gap list itself).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml -q

      - name: Detect baseline drift
        # Delegates to scripts/check_api_performance_baseline_drift.py — the
        # same script execution_prompt.md §3.2.B now runs as a mandatory
        # pre-PR-open step (OA-2, post-ship closure 2026-07-24__release-v7.8),
        # so CI and the pre-PR check can never drift out of sync with each
        # other.
        run: python3 scripts/check_api_performance_baseline_drift.py

  deploy_path_filter_drift:
    name: Staging/Production Deploy Path-Filter Drift Detection (ST-14)
    runs-on: ubuntu-latest

    # [EPIC-03][ST-14] (BLG-OPS-90) — Flags any known runtime-read file
    # (docs/ops/render_build_deploy_path_filter_audit.md's Runtime
    # File-Read Inventory) not covered by EITHER the staging deploy path
    # filter (.github/workflows/staging-deploy.yml, repo-visible) or the
    # production deploy path filter (Render dashboard-only — checked
    # against docs/ops/render_production_build_filter_snapshot.json, the
    # last human-confirmed value). Catches the exact drift class behind
    # BLG-OPS-82 and this item's own gate-clearing incident (commit
    # e9c73f58) before it recurs a third time.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect deploy path-filter drift
        run: python3 scripts/check_deploy_path_filter_drift.py

  doq_signoff_staleness:
    name: DoQ Sign-off Staleness Lint (ST-18)
    runs-on: ubuntu-latest

    # [EPIC-04][ST-18] — Fails if any qa_evidence_EPIC-*.md file in the
    # ACTIVE cycle still carries a "Pending DoQ"/"Awaiting QA" placeholder
    # in its acceptance-criteria table. Catches the case a per-EPIC PR's own
    # "Verify QA Evidence" step above cannot: a cross-EPIC merge conflict
    # resolution (CLAUDE.md §8) touching a DIFFERENT EPIC's qa_evidence file
    # without that EPIC's own PR re-running its per-EPIC check. Scoped to
    # the active cycle only (not repo history) — see
    # scripts/check_doq_signoff_staleness.py's own docstring for why an
    # unscoped scan is not viable (finds legitimate, sealed, historical
    # placeholders in already-closed cycles).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check DoQ sign-off staleness
        run: python3 scripts/check_doq_signoff_staleness.py

  pii_field_pattern_scan:
    name: PII Field-Name Pattern Scan (ST-08)
    runs-on: ubuntu-latest

    # [EPIC-03][ST-08] — Lightweight, name-pattern-only scan of lines added
    # to docs/reference/openapi.yaml for common PII field-name patterns
    # (email, phone, SSN, date of birth, address, full name, payment card,
    # government ID, etc.). Flags for manual review — see
    # scripts/check_pii_field_patterns.py for the pattern list and rationale.
    # This is not a data-classification review; it is a cheap first pass so
    # an obviously PII-shaped new response field does not go unnoticed.
    steps:
      - name: Checkout (full history for base-ref diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan for PII-shaped field names
        run: python3 scripts/check_pii_field_patterns.py --base-ref origin/main

  endpoint_count_drift:
    name: Endpoint Count Drift Check (ST-11)
    runs-on: ubuntu-latest

    # [EPIC-11][ST-11] — Automates the CLAUDE.md §2 rule that
    # src/pages/SystemStatus.js's hardcoded fallback count
    # (`Tests {totalTests || 'N'} endpoints`) must be kept in sync with the
    # actual endpoint total, so the displayed count is never stale before a
    # live test run completes.
    #
    # Design note: the gate compares SystemStatus.js's fallback constant
    # against len(test_cases) in backend/routers/test.py — parsed via the
    # `ast` module (not regex) for exactness. A naive regex count of
    # `"name":` occurrences across the whole file over-counts: it also
    # matches an unrelated nested `"body": {"name": "__test__", ...}` payload
    # (line ~246) and two `"name": test["name"]` lines in a different,
    # smaller `critical_tests` list used by a separate lighter-weight health
    # endpoint elsewhere in the same file. AST-parsing the `test_cases`
    # list's element count sidesteps all of that ambiguity.
    #
    # This gate's introduction (this story) found the fallback constant was
    # already stale: it read 103, but the current, AST-verified test_cases
    # count is 98 — 5 entries had drifted out of sync at some point after
    # v7.6 with no gate to catch it. Corrected to 98 in the same commit as
    # this gate (src/pages/SystemStatus.js + tests/e2e/system-status.spec.js
    # SC-SS-01b), per CLAUDE.md §2 — satisfying "passes on current
    # repository state" against the now-corrected state.
    #
    # Raw `@router.*` decorator counts across backend/routers/*.py are also
    # logged for visibility, but are informational only, not gating — that
    # count (81) is meaningfully lower than test_cases' count (98) since
    # test_cases also exercises several main.py `@app.*`-level routes
    # alongside router-based ones.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect endpoint count drift
        run: |
          python3 - <<'EOF'
          import ast
          import re
          import sys
          from pathlib import Path

          TEST_ROUTER_PATH = Path("backend/routers/test.py")
          SYSTEM_STATUS_PATH = Path("src/pages/SystemStatus.js")
          ROUTERS_DIR = Path("backend/routers")
          TEST_CASES_VAR = "test_cases"

          test_router_text = TEST_ROUTER_PATH.read_text()
          tree = ast.parse(test_router_text, filename=str(TEST_ROUTER_PATH))

          registry_count = None
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == TEST_CASES_VAR:
                          if isinstance(node.value, ast.List):
                              registry_count = len(node.value.elts)

          if registry_count is None:
              print(f"MERGE BLOCKED: could not find a `{TEST_CASES_VAR} = [...]` "
                    f"list assignment in {TEST_ROUTER_PATH}.")
              sys.exit(1)

          system_status_text = SYSTEM_STATUS_PATH.read_text()
          fallback_match = re.search(r"totalTests\s*\|\|\s*'(\d+)'", system_status_text)
          if not fallback_match:
              print("MERGE BLOCKED: could not find the totalTests fallback constant "
                    "(pattern: totalTests || 'N') in src/pages/SystemStatus.js.")
              sys.exit(1)
          fallback_count = int(fallback_match.group(1))

          # Informational only — logged for visibility, not gating (see design note above).
          decorator_count = 0
          for py_file in sorted(ROUTERS_DIR.glob("*.py")):
              decorator_count += len(re.findall(
                  r"@router\.(get|post|put|delete|patch)\(", py_file.read_text()
              ))
          print(f"Informational: {decorator_count} @router.* decorator(s) across "
                f"{ROUTERS_DIR}/*.py (not the gating count — see design note).")

          if registry_count != fallback_count:
              print("MERGE BLOCKED: endpoint count drift detected.")
              print(f"  backend/routers/test.py {TEST_CASES_VAR} entries: {registry_count}")
              print(f"  SystemStatus.js fallback constant:              {fallback_count}")
              print("")
              print("Update the `Tests {totalTests || 'N'} endpoints` fallback in "
                    "src/pages/SystemStatus.js to match the current test_cases "
                    "count (and update SC-SS-01b in tests/e2e/system-status.spec.js "
                    "in the same commit, per CLAUDE.md §2).")
              sys.exit(1)

          print(f"No endpoint count drift detected. test_cases: "
                f"{registry_count}, SystemStatus.js fallback: {fallback_count}.")
          EOF
