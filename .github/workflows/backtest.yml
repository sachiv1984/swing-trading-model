# .github/workflows/backtest.yml
name: Nightly Backtest

# Runs production_strategy.py on the GitHub Actions runner overnight, then
# imports results into the live API via import_backtest.py.
# This mirrors the daily-snapshot.yml pattern: heavy compute runs in CI,
# results are pushed to the API, data persists in the DB.

on:
  schedule:
    - cron: '0 1 * * *'  # 1 AM UTC daily (overnight, after US market close)
  workflow_dispatch:

# ST-09 (EPIC-09, v7.7, BLG-GOV-...): prevent overlapping runs (scheduled +
# manual re-trigger, or a retry while the prior run is still executing).
# Defense-in-depth on top of upsert_backtest_data's own DB-transaction
# serialization (full DELETE+INSERT commits atomically) — this stops two
# runs from both burning ~90 minutes of compute concurrently for no benefit,
# since only the later-committing one's data would end up live anyway.
concurrency:
  group: nightly-backtest
  cancel-in-progress: false

jobs:
  run-backtest:
    name: Run backtest and import results
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance matplotlib requests psycopg2-binary

      - name: Run backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python production_strategy.py

      - name: Wake up API
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          curl --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            -s -o /dev/null -w "%{http_code}" \
            -X GET "${API_URL}/health" || true
          sleep 10

      - name: Import results into API
        id: import
        env:
          API_URL: ${{ secrets.API_URL }}
          RENDER_API_KEY: ${{ secrets.API_KEY }}
        run: |
          set +e
          python import_backtest.py --api-url "${API_URL}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # ST-10 (EPIC-10, v7.7): monitoring/alerting for nightly backtest
      # failures or output anomalies. import_backtest.py exits 1 on a hard
      # failure (non-200 response) and 2 on a detected output anomaly
      # (BACKTEST_DRIFT_ALERT — see check_drift_alert in import_backtest.py,
      # BLG-BE-60/RISK-01) — both are captured above without failing this
      # step immediately so this alert step can distinguish and report them,
      # then the final gate step below still fails the job either way.
      - name: Send failure/anomaly alert
        if: steps.import.outputs.exit_code != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CODE="${{ steps.import.outputs.exit_code }}"
          if [ "$CODE" = "2" ]; then
            KIND="anomaly detected (BACKTEST_DRIFT_ALERT — see run log for details)"
          else
            KIND="failed (exit code ${CODE})"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MESSAGE="Nightly Backtest job ${KIND}. ${RUN_URL}"
          echo "$MESSAGE"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}"
          else
            echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not configured as repo secrets — alert not sent. Message would have been: ${MESSAGE}"
          fi

      - name: Fail job if import step did not succeed
        if: steps.import.outputs.exit_code != '0'
        run: exit 1
