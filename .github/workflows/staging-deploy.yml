name: Deploy to Staging (Render)

# ST-09: BLG-OPS-27 — Automated staging re-deployment on main merge.
#
# Triggers only when backend or frontend source files change.
# Documentation-only commits (docs/, claude/, *.md) do NOT trigger this workflow,
# preserving free-tier build minutes (RISK-03 path-filter design, accepted 2026-05-24).
#
# Prerequisites:
#   - RENDER_STAGING_DEPLOY_HOOK must be set as a GitHub Actions repository secret
#     (repo Settings → Secrets and variables → Actions → New repository secret)
#   - Obtain the deploy hook URL from: Render dashboard → staging service → Settings → Deploy Hook
#   - STAGING_API_URL / STAGING_API_KEY must also be set (ST-13, BLG-OPS-25, EPIC-03, v9.0)
#     for the post-deploy smoke test suite (scripts/staging_smoke_test.py) below.
#   - RENDER_PLATFORM_API_KEY must also be set (already provisioned — same secret
#     .github/workflows/staging-deploy-drift-check.yml uses) for the deploy-status
#     poll (scripts/wait_for_staging_deploy_live.py) below.
#
# Build minute impact: ~1 min/trigger for the deploy-hook call itself, plus up to
# ~8 min worst-case for the deploy-status poll (typically much less — polls every
# 15s until the new commit is confirmed live) and the smoke test suite — see
# docs/ops/staging_deploy_notes.md for the updated assessment.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'backend/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      # ST-01 (v7.8/v7.9 EPIC-01): the "What's New" panel is parsed server-side
      # from this file at request time (backend/services/changelog_service.py),
      # so a docs-only changelog update must still trigger a redeploy or the
      # live panel serves a stale version until the next code-change deploy.
      - 'docs/product/changelog.md'
  workflow_dispatch: {}

jobs:
  deploy-staging:
    name: Trigger Render staging re-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Trigger Render deploy hook
        run: |
          if [[ -z "${RENDER_STAGING_DEPLOY_HOOK:-}" ]]; then
            echo "ERROR: RENDER_STAGING_DEPLOY_HOOK secret is not set."
            echo "Add it at: repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          HTTP_STATUS=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" \
            -X POST "$RENDER_STAGING_DEPLOY_HOOK")
          echo "Render response body:"
          cat /tmp/render_response.txt || true
          echo ""
          echo "HTTP status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" != "200" ]] && [[ "$HTTP_STATUS" != "201" ]]; then
            echo "❌ Deploy hook returned unexpected status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Staging deploy triggered successfully"
        env:
          RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}

      # ST-13 (BLG-OPS-25, EPIC-03, v9.0). The deploy hook above only
      # confirms Render *accepted* the trigger — not that the build
      # succeeded or the new commit is actually live. This step (plus the
      # smoke test after it) is the "staging ready" signal: both must
      # pass for this job to go green, and nothing downstream should
      # treat staging as ready if this job is red.
      #
      # Polls the same Render platform API endpoint
      # scripts/check_staging_deploy_drift.py already uses, via
      # scripts/wait_for_staging_deploy_live.py, until the staging
      # backend's live deploy matches this push's own commit SHA — not a
      # fixed sleep. A timeout here is a hard failure (job stops, smoke
      # test does not run) rather than a soft proceed-anyway, since
      # running the smoke test against an unconfirmed deploy risks it
      # silently passing against the still-running *previous* deploy (a
      # false "staging ready" signal) — exactly the failure class this
      # story exists to prevent.
      - name: Wait for staging backend deploy to go live
        env:
          RENDER_PLATFORM_API_KEY: ${{ secrets.RENDER_PLATFORM_API_KEY }}
        run: python3 scripts/wait_for_staging_deploy_live.py "$GITHUB_SHA"

      - name: Run staging smoke test suite
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: python3 scripts/staging_smoke_test.py
