name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Build
      env:
        REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
        REACT_APP_ANTHROPIC_API_KEY: ${{ secrets.REACT_APP_ANTHROPIC_API_KEY }}
        # GitHub Pages serves this app from a /swing-trading-model subpath, not
        # domain root. .env.production sets PUBLIC_URL=/ for the Render static
        # site (which serves at root) and CRA loads .env.production
        # automatically for any production build, including this one. Without
        # this override, asset paths resolve to /static/... instead of
        # /swing-trading-model/static/..., 404ing on GitHub Pages and leaving
        # the app blank (root cause of the 2026-08-21 white-page incident,
        # introduced by .env.production's PUBLIC_URL=/ in commit 5f80e301,
        # [EPIC-05][ST-16]). An explicit env var here wins over .env.production
        # in CRA's precedence, so this is a build-step-only fix — it does not
        # touch .env.production or affect the Render deploys.
        PUBLIC_URL: /swing-trading-model
      run: CI=false npm run build

    # ST-16 (BLG-OPS-148, EPIC-03, v9.0): fails the deploy fast if a future
    # build regresses to root-relative (or otherwise wrong-subpath) asset
    # paths — the exact class of bug behind the 2026-08-21 white-page
    # incident above. Reproduced and verified locally before adding this
    # step: building without the PUBLIC_URL override (letting
    # .env.production's own PUBLIC_URL=/ apply, the pre-fix regression
    # shape) produces src="/static/..." / href="/static/..." in
    # build/index.html; building with the override above produces
    # src="/swing-trading-model/static/..." — this step checks for exactly
    # that distinction.
    - name: Verify asset paths are scoped to the GitHub Pages subpath
      run: |
        if grep -qE '(src|href)="/static/' build/index.html; then
          echo "::error::build/index.html has root-relative asset paths (/static/...) instead of /swing-trading-model/static/... — the PUBLIC_URL override above is not taking effect. This is the exact regression shape behind the 2026-08-21 GitHub Pages white-page incident (BLG-OPS-148)."
          exit 1
        fi
        if ! grep -qE '(src|href)="/swing-trading-model/static/' build/index.html; then
          echo "::error::build/index.html does not contain the expected /swing-trading-model/static/... asset paths — cannot confirm the build is correctly scoped."
          exit 1
        fi
        echo "Asset paths correctly scoped to /swing-trading-model."

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
        force_orphan: true
