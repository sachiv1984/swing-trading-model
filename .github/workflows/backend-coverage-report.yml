name: Backend Test Coverage Report

# ST-22 (BLG-QA-84, EPIC-04, v9.0). Posts a backend test coverage summary
# (pytest-cov line coverage, not to be confused with
# endpoint-coverage.yml's endpoint-mapping report) as a PR comment, with a
# delta vs. the base branch where feasible. Advisory only — never blocks
# merge, same convention as endpoint-coverage.yml.
#
# Delta computation: runs the same coverage command against the PR head
# AND against the base branch (checked out into a separate worktree, so
# the PR head's own working tree is untouched), then diffs the two totals.
# If the base-branch run fails for any reason, the report still posts with
# just the head total — "if feasible" per the story's own AC wording.

on:
  pull_request:
    branches: [main, develop]

jobs:
  backend-coverage:
    name: Backend Test Coverage Report (ST-22)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_stub

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache backend/.venv (ST-22, BLG-OPS-122)
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-py3.11-backend-venv-${{ hashFiles('backend/requirements.txt') }}

      - name: Create or verify venv (self-heals a missing OR broken/stale cache)
        working-directory: backend
        run: |
          if [ ! -x .venv/bin/python ] || ! .venv/bin/python -m pytest --version > /dev/null 2>&1; then
            echo "::warning::backend/.venv is missing or its cached restore is broken (pytest not importable) -- (re)installing fresh."
            rm -rf .venv
            python -m venv .venv
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Add backend/.venv to PATH
        run: echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Run coverage on PR head
        run: |
          python -m pytest tests/ --ignore=tests/e2e -q \
            --cov=services --cov=routers --cov=utils --cov=models --cov=database --cov=main \
            --cov-report=json:coverage_head.json

      - name: Run coverage on base branch (delta, best-effort)
        id: base_coverage
        continue-on-error: true
        run: |
          git worktree add /tmp/base-checkout "origin/${{ github.event.pull_request.base.ref }}"
          cd /tmp/base-checkout
          "$GITHUB_WORKSPACE/backend/.venv/bin/python" -m pytest tests/ --ignore=tests/e2e -q \
            --cov=services --cov=routers --cov=utils --cov=models --cov=database --cov=main \
            --cov-report=json:"$GITHUB_WORKSPACE/coverage_base.json"

      - name: Generate coverage report
        run: |
          if [ -f coverage_base.json ]; then
            python3 scripts/generate_backend_coverage_report.py --head coverage_head.json --base coverage_base.json
          else
            echo "::warning::Base branch coverage run did not produce a report (see 'Run coverage on base branch' step) -- posting head-only report."
            python3 scripts/generate_backend_coverage_report.py --head coverage_head.json
          fi

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs     = require('fs');
            const body   = fs.readFileSync('coverage_report.md', 'utf8');
            const marker = 'Backend Test Coverage Report';

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Print coverage summary
        run: cat coverage_report.md
