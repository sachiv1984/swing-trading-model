name: Seed Staging Database

on:
  workflow_dispatch:

# Seeds the canonical staging database for v2.3 DoQ sign-off.
# Uses psql directly against the Supabase staging database — bypasses the API layer.
#
# What is seeded:
#   - 12 closed trades (positions + trade_history) — chart interactivity (SC-CHART-IX-*)
#   - settings record (if missing)
#   - 5 alert_evaluations rows — nav badge (SC-ANB-VIS-01 through VIS-05, ST-10)
#
# Prerequisites:
#   - STAGING_DATABASE_URL must be set as a GitHub Actions repository secret
#     (Supabase staging project → Settings → Database → Connection string → URI)
#   - The staging schema must already exist (run staging_setup.md runbook first)
#   - At least one portfolio record must exist in the staging database
#
# Idempotency: skips if [SEED] records already exist in trade_history.
# Re-seeding: delete [SEED] rows from trade_history and alert_evaluations via psql, then re-run.
#
# DoQ test targets after seeding:
#   Analytics:  https://trading-assistant-staging.onrender.com/PerformanceAnalytics
#               Scenarios: docs/testing/chart_interactivity_scenarios.md (SC-CHART-IX-*)
#   Nav badge:  any non-Alerts page — clear alerts-last-visit from sessionStorage first
#               Scenarios: docs/testing/alert_nav_badge_scenarios.md (SC-ANB-VIS-01–05)

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Check for existing seed data
        id: guard
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          COUNT=$(psql "$STAGING_DATABASE_URL" -t -c \
            "SELECT COUNT(*) FROM trade_history WHERE exit_note LIKE '%[SEED]%';" \
            | tr -d ' \n')
          echo "existing_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt "0" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Seed data already present ($COUNT records in trade_history). Skipping."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "No seed data found. Proceeding."
          fi

      - name: Seed trades (chart interactivity)
        if: steps.guard.outputs.skipped == 'false'
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          psql "$STAGING_DATABASE_URL" -f backend/test_data/seed_chart_test_data.sql

      - name: Check for existing alert evaluations
        id: eval_guard
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          COUNT=$(psql "$STAGING_DATABASE_URL" -t -c \
            "SELECT COUNT(*) FROM alert_evaluations;" \
            | tr -d ' \n')
          echo "eval_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt "0" ]; then
            echo "eval_skipped=true" >> "$GITHUB_OUTPUT"
            echo "alert_evaluations already present ($COUNT rows). Skipping eval seed."
          else
            echo "eval_skipped=false" >> "$GITHUB_OUTPUT"
            echo "No alert_evaluations found. Seeding."
          fi

      - name: Seed alert evaluations (nav badge)
        if: steps.eval_guard.outputs.eval_skipped == 'false'
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          psql "$STAGING_DATABASE_URL" <<'SQL'
          DO $$
          DECLARE v_portfolio_id UUID;
          BEGIN
            SELECT id INTO v_portfolio_id FROM portfolios LIMIT 1;
            IF v_portfolio_id IS NULL THEN
              RAISE EXCEPTION 'No portfolio found.';
            END IF;
            INSERT INTO alert_evaluations
              (portfolio_id, evaluation_timestamp, rule_type, symbol, triggered, notification_sent, values_compared)
            VALUES
              (v_portfolio_id, NOW() - INTERVAL '20 hours', 'stop_loss_approach',      'AZN',  true, true, '{"stop_price": 11000, "current_price": 11400, "gap_pct": 3.5, "threshold_pct": 5.0}'),
              (v_portfolio_id, NOW() - INTERVAL '16 hours', 'grace_period_warning',    'HSBA', true, true, '{"days_remaining": 2, "grace_period_days": 7}'),
              (v_portfolio_id, NOW() - INTERVAL '12 hours', 'market_regime_change',    NULL,   true, true, '{"regime": "bearish", "previous_regime": "neutral"}'),
              (v_portfolio_id, NOW() - INTERVAL '6 hours',  'daily_portfolio_summary', NULL,   true, true, '{"positions_count": 3, "total_pnl": -45.50}'),
              (v_portfolio_id, NOW() - INTERVAL '1 hour',   'stop_loss_approach',      'MKS',  true, true, '{"stop_price": 340, "current_price": 355, "gap_pct": 4.2, "threshold_pct": 5.0}');
            RAISE NOTICE 'Seeded 5 alert_evaluations rows.';
          END $$;
          SQL

      - name: Report result
        run: |
          echo "========================================================="
          if [ "${{ steps.guard.outputs.skipped }}" == "true" ]; then
            echo "  Trades:            SKIPPED (${{ steps.guard.outputs.existing_count }} [SEED] rows already present)"
          else
            echo "  Trades:            SEEDED  (12 inserted — Jan×4 / Feb×6 / Mar×2)"
          fi
          if [ "${{ steps.eval_guard.outputs.eval_skipped }}" == "true" ]; then
            echo "  Alert evaluations: SKIPPED (${{ steps.eval_guard.outputs.eval_count }} rows already present)"
          else
            echo "  Alert evaluations: SEEDED  (5 inserted)"
          fi
          echo ""
          echo "  DoQ test targets:"
          echo "  Analytics : .../PerformanceAnalytics"
          echo "              docs/testing/chart_interactivity_scenarios.md"
          echo "  Nav badge : any non-Alerts page"
          echo "              clear 'alerts-last-visit' from sessionStorage first"
          echo "              docs/testing/alert_nav_badge_scenarios.md"
          echo "========================================================="
