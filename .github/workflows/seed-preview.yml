name: Seed Staging Database

on:
  workflow_dispatch:

# Seeds the canonical staging database for v2.3 DoQ sign-off.
# Uses psql directly against the Supabase staging database — bypasses the API layer.
#
# What is seeded:
#   - 12 closed trades (positions + trade_history) — chart interactivity (SC-CHART-IX-*)
#   - settings record (if missing)
#   - 5 alert_evaluations rows — nav badge (SC-ANB-VIS-01 through VIS-05, ST-10)
#
# Prerequisites:
#   - STAGING_DATABASE_URL must be set as a GitHub Actions repository secret
#     (Supabase staging project → Settings → Database → Connection string → URI)
#   - The staging schema must already exist (run staging_setup.md runbook first)
#   - At least one portfolio record must exist in the staging database
#
# Idempotency: skips if [SEED] records already exist in trade_history.
# Re-seeding: delete [SEED] rows from trade_history and alert_evaluations via psql, then re-run.
#
# DoQ test targets after seeding:
#   Analytics:  https://trading-assistant-staging.onrender.com/PerformanceAnalytics
#               Scenarios: docs/testing/chart_interactivity_scenarios.md (SC-CHART-IX-*)
#   Nav badge:  any non-Alerts page — clear alerts-last-visit from sessionStorage first
#               Scenarios: docs/testing/alert_nav_badge_scenarios.md (SC-ANB-VIS-01–05)

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Check for existing seed data
        id: guard
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          COUNT=$(psql "$STAGING_DATABASE_URL" -t -c \
            "SELECT COUNT(*) FROM trade_history WHERE exit_note LIKE '%[SEED]%';" \
            | tr -d ' \n')
          echo "existing_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt "0" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Seed data already present ($COUNT records in trade_history). Skipping."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "No seed data found. Proceeding."
          fi

      - name: Seed database
        if: steps.guard.outputs.skipped == 'false'
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          psql "$STAGING_DATABASE_URL" -f backend/test_data/seed_chart_test_data.sql

      - name: Report result
        run: |
          if [ "${{ steps.guard.outputs.skipped }}" == "true" ]; then
            echo "========================================================="
            echo "  SKIPPED — seed data already present"
            echo "  Existing [SEED] records: ${{ steps.guard.outputs.existing_count }}"
            echo ""
            echo "  To re-seed: delete existing [SEED] rows via psql, then"
            echo "  re-run this workflow."
            echo "========================================================="
          else
            echo "========================================================="
            echo "  SEEDED"
            echo ""
            echo "  Trades: 12 inserted"
            echo "  Jan×4 / Feb×6 / Mar×2 / Apr=0 (zero-tile)"
            echo "  All 7 R-multiple buckets populated."
            echo ""
            echo "  Alert evaluations: 5 inserted (ST-10 nav badge)"
            echo ""
            echo "  DoQ test targets:"
            echo "  Analytics: .../PerformanceAnalytics"
            echo "  Scenarios: docs/testing/chart_interactivity_scenarios.md"
            echo ""
            echo "  Nav badge: any non-Alerts page"
            echo "  (clear alerts-last-visit from sessionStorage first)"
            echo "  Scenarios: docs/testing/alert_nav_badge_scenarios.md"
            echo "========================================================="
          fi
