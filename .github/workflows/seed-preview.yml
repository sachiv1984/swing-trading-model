name: Seed Preview Environment

on:
  pull_request:
    types: [labeled]

jobs:
  seed:
    # Only run when the render-preview label is applied
    if: github.event.label.name == 'render-preview'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set preview URL
        id: url
        run: |
          PR="${{ github.event.pull_request.number }}"
          echo "base=https://trading-assistant-api-staging-pr-${PR}.onrender.com" >> "$GITHUB_OUTPUT"

      - name: Wait for preview to be healthy
        id: wait
        timeout-minutes: 20
        run: |
          URL="${{ steps.url.outputs.base }}/health"
          echo "Polling $URL ..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Preview is healthy."
              exit 0
            fi
            sleep 20
          done
          echo "Preview did not become healthy within 20 minutes."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Seed test data
        id: seed
        run: |
          python backend/test_data/seed_chart_test_data.py "${{ steps.url.outputs.base }}" 2>&1 | tee seed_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('seed_output.txt', 'utf8');
            const previewUrl = '${{ steps.url.outputs.base }}';
            const success = '${{ steps.seed.outputs.exit_code }}' === '0';

            const status = success
              ? '✅ Test data seeded successfully'
              : '⚠️ Seeding completed with errors — check output below';

            const body = [
              `### ${status}`,
              '',
              `**Preview URL:** ${previewUrl}`,
              '',
              '**Analytics page:** ' + previewUrl + '/performance-analytics',
              '',
              '<details>',
              '<summary>Seed script output</summary>',
              '',
              '```',
              output.trim(),
              '```',
              '</details>',
              '',
              '**Test scenarios:** `docs/testing/chart_interactivity_scenarios.md`',
              '',
              success
                ? '_12 trades seeded: Jan×4 / Feb×6 / Mar×2 / Apr=0 (zero-tile). All 7 R-multiple buckets populated._'
                : '_Check the seed output above. Re-run by removing and re-adding the `render-preview` label._',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
