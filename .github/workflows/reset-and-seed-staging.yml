name: Reset and Seed Staging Database

# Manual trigger — run before any QA session against staging.
#
# Steps:
#   1. Reset — TRUNCATE all domain tables + re-insert baseline portfolio + settings
#   2. Migrate — apply any schema migrations that aren't yet on staging (idempotent)
#   3. Seed — insert QA test data (positions, watchlist, alerts/notifications)
#   4. Verify — query row counts so you can confirm data landed in the right DB
#
# Prerequisites:
#   - STAGING_DATABASE_URL must be set as a GitHub Actions repository secret
#     (repo Settings → Secrets and variables → Actions → New repository secret)
#   - The staging schema must already exist (tables must be present)
#
# The workflow uses STAGING_DATABASE_URL (never DATABASE_URL) and rejects URLs
# containing "production" or "/prod" — same guard as the local shell scripts.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Run seed scripts after reset? (uncheck for bare reset only)'
        type: boolean
        required: false
        default: true

jobs:
  reset-and-seed:
    name: Reset staging DB and seed QA data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      PGSSLMODE: require

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Validate STAGING_DATABASE_URL is set
        run: |
          if [[ -z "${STAGING_DATABASE_URL:-}" ]]; then
            echo "ERROR: STAGING_DATABASE_URL secret is not set."
            echo "Add it at: repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [[ "$STAGING_DATABASE_URL" == *"production"* ]] || \
             [[ "$STAGING_DATABASE_URL" == *"/prod"* ]]; then
            echo "ERROR: STAGING_DATABASE_URL appears to point at production. Aborting."
            exit 1
          fi
          DB_HOST=$(echo "$STAGING_DATABASE_URL" | sed -E 's|.*@([^:/]+).*|\1|')
          echo "Target staging host: $DB_HOST"

      # ── Step 1: Reset ─────────────────────────────────────────────────────
      - name: Reset staging database to baseline
        run: |
          echo "=== RESET ==="
          psql "$STAGING_DATABASE_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            -f scripts/reset_staging_db.sql
          echo "Reset complete."

      # ── Step 2: Migrate ───────────────────────────────────────────────────
      # Applies pending schema changes that staging may not have yet.
      # All statements use IF NOT EXISTS — safe to run repeatedly.
      - name: Apply pending schema migrations
        run: |
          echo "=== MIGRATE ==="
          psql "$STAGING_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 -c "
          BEGIN;
          ALTER TABLE positions ADD COLUMN IF NOT EXISTS user_fill_price DECIMAL(10, 4);
          ALTER TABLE trade_history ADD COLUMN IF NOT EXISTS fill_price DECIMAL(10, 4);
          COMMIT;
          "
          echo "Migrations applied."

      # ── Step 3: Seed (optional) ───────────────────────────────────────────
      # ON_ERROR_STOP=1 ensures any SQL error fails the step immediately
      # rather than psql silently continuing past a failed transaction.
      - name: Seed QA test data
        if: ${{ inputs.seed == true }}
        run: |
          echo "=== SEED: portfolio/trades ==="
          psql "$STAGING_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            -f scripts/seeds/seed_portfolio_trades.sql

          echo "=== SEED: watchlist ==="
          psql "$STAGING_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            -f scripts/seeds/seed_watchlist.sql

          echo "=== SEED: alerts ==="
          psql "$STAGING_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 \
            -f scripts/seeds/seed_alerts.sql

      # ── Step 4: Verify what actually landed ───────────────────────────────
      # If these counts don't match what your app shows, STAGING_DATABASE_URL
      # is pointing to a different DB than your staging app.
      - name: Verify seed state
        if: ${{ inputs.seed == true }}
        run: |
          echo "=== DB STATE AFTER SEED ==="
          psql "$STAGING_DATABASE_URL" --no-psqlrc -c "
            SELECT 'portfolios'             AS tbl, COUNT(*)::text AS rows FROM portfolios
            UNION ALL
            SELECT 'portfolio.cash'         , (SELECT cash::text FROM portfolios LIMIT 1)
            UNION ALL
            SELECT 'positions (open)'       , COUNT(*)::text        FROM positions WHERE status = 'open'
            UNION ALL
            SELECT 'cash_transactions'      , COUNT(*)::text        FROM cash_transactions
            UNION ALL
            SELECT 'trade_history'          , COUNT(*)::text        FROM trade_history
            UNION ALL
            SELECT 'watchlist'              , COUNT(*)::text        FROM watchlist
            UNION ALL
            SELECT 'alert_rules'            , COUNT(*)::text        FROM alert_rules
            UNION ALL
            SELECT 'notifications (unread)' , COUNT(*)::text        FROM notifications WHERE is_read = false;
          "
          echo ""
          echo "Expected: portfolios=1, cash=15006.10, positions(open)=2,"
          echo "          cash_transactions=1, trade_history=2,"
          echo "          watchlist=4, alert_rules=4, notifications(unread)=2"
          echo ""
          echo "If these counts are correct but your app shows different data,"
          echo "your staging app DATABASE_URL does not match STAGING_DATABASE_URL."

      - name: Summary
        run: |
          SEEDED="${{ inputs.seed }}"
          echo "========================================================"
          echo "  Staging DB reset complete"
          echo "  Reset:   ✅ domain tables cleared, baseline inserted"
          echo "  Migrate: ✅ schema up to date (v2.0)"
          if [[ "$SEEDED" == "true" ]]; then
            echo "  Seed:    ✅ See 'Verify seed state' step for row counts"
          else
            echo "  Seed:    ⏭  skipped (bare reset only)"
          fi
          echo "========================================================"
