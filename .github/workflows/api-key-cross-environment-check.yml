# .github/workflows/api-key-cross-environment-check.yml
name: API Key Cross-Environment Check

# ST-03 (BLG-OPS-131, EPIC-01, v8.3): recurring check that staging's and
# production's Application X-API-Key remain distinct. ST-06 (BLG-SEC-27,
# v8.2) rotated the two to distinct values and confirmed this live via a
# one-time manual check at rotation time -- there was no ongoing signal if
# a future rotation accidentally re-syncs them. This workflow makes that
# recurring, following the same pattern as staging-deploy-drift-check.yml
# (BLG-OPS-128, v8.2).
#
# The deliberately-cross-wired-test AC for this story is satisfied by
# tests/test_api_key_cross_environment.py (CI-reproducible pure-logic unit
# tests), not by this workflow -- this workflow is the live wiring.
#
# ST-02 (BLG-OPS-134, EPIC-01, v8.5) hardening: a live run's log
# (2026-08-09, run 31299858987) confirmed this workflow genuinely executes
# daily -- secrets ARE configured, the check is not silently skipping. But
# that same run surfaced a real gap: a transient PROD_API_URL read timeout
# crashed the script with an unhandled exception, and the alert step could
# not tell that apart from a genuine cross-wired-keys finding (both produced
# a non-zero exit code) -- it sent a false-positive "check FAILED" Telegram
# alert with no actual [CROSS-WIRED] finding behind it. Hardening decision
# (recorded per this story's AC): fail loud, not silent, for BOTH failure
# classes -- but keep them distinguishable. The missing-secrets bash
# pre-check below now routes through the same EXIT_ERROR=2 path the script
# itself uses for probe failures, instead of silently exiting 0. Two
# separate alert steps below fire on exit_code 1 (cross-wired -- a genuine
# security finding) vs exit_code 2 (probe/config error -- inconclusive,
# needs investigation, NOT implied to be a security incident).

on:
  schedule:
    - cron: '0 6 * * *'  # daily 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: api-key-cross-environment-check
  cancel-in-progress: true

jobs:
  cross-environment-check:
    name: Confirm staging/production API keys remain distinct
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run cross-environment check
        id: check
        shell: bash
        env:
          PROD_API_URL: ${{ secrets.API_URL }}
          PROD_API_KEY: ${{ secrets.API_KEY }}
          STAGING_API_URL: https://trading-assistant-api-staging.onrender.com
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          set -o pipefail
          if [ -z "$PROD_API_URL" ] || [ -z "$PROD_API_KEY" ] || [ -z "$STAGING_API_KEY" ]; then
            # ST-19 (BLG-OPS-136, EPIC-06, v8.6): the alert step below greps
            # cross_env_output.txt for lines starting "[ERROR]" (the same
            # prefix scripts/check_api_key_cross_environment.py's own probe-
            # failure output uses) to populate the Telegram message's error
            # detail. This skip-guard previously wrote only a GitHub Actions
            # "::error::"-prefixed annotation -- visible in the Actions UI,
            # but invisible to that grep, so the missing-secrets alert
            # always sent with an empty error detail. Emit both: the GitHub
            # annotation (for the Actions UI) and a "[ERROR]"-prefixed line
            # (for the alert step's grep) into the tee'd file.
            echo "::error::One or more of API_URL / API_KEY / STAGING_API_KEY not configured as repo secrets — cross-environment check cannot run."
            echo "[ERROR] One or more of API_URL / API_KEY / STAGING_API_KEY not configured as repo secrets — cross-environment check cannot run." | tee cross_env_output.txt
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 scripts/check_api_key_cross_environment.py | tee cross_env_output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Send alert on cross-wired keys
        if: steps.check.outputs.exit_code == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          FINDINGS=$(grep '^\[CROSS-WIRED\]' cross_env_output.txt || true)
          MESSAGE="API key cross-environment check FAILED — keys may be cross-wired: ${FINDINGS} ${RUN_URL}"
          echo "$MESSAGE"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}"
          else
            echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not configured as repo secrets — alert not sent. Message would have been: ${MESSAGE}"
          fi

      - name: Send alert on check error (inconclusive, not a security finding)
        if: steps.check.outputs.exit_code == '2'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ERRORS=$(grep '^\[ERROR\]' cross_env_output.txt || true)
          MESSAGE="API key cross-environment check could not complete (probe/config error — NOT a cross-wiring finding): ${ERRORS} ${RUN_URL}"
          echo "$MESSAGE"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}"
          else
            echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not configured as repo secrets — alert not sent. Message would have been: ${MESSAGE}"
          fi
