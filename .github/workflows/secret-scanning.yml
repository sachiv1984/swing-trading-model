name: Secret Scanning

# [EPIC-02][ST-10] — CI secret scanning gate using gitleaks.
# Scans for accidentally committed secrets on every PR and push to main.
# Configured to detect: Telegram bot tokens, Anthropic API keys,
# Supabase URL/key patterns, and generic high-entropy strings.
# Allowlisted: test fixtures with obvious synthetic placeholder values.
#
# Cycle: 2026-06-08__release-v5.3
# Maps to: ST-10 (BLG-OPS-58, v5.3)
# Authority: Cybersecurity & Trust Lead

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: detect --source . --config .gitleaks.toml --verbose --redact
