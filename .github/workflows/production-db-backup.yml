name: Production Database Backup

# [EPIC-02][ST-02] Recurring manual pg_dump backup schedule for production
# Supabase (BLG-OPS-127). Production is on the Supabase Free tier — no
# automated daily backups, no PITR (confirmed live 2026-07-31, see
# docs/ops/database_backup_disaster_recovery_runbook.md §2). This workflow
# is the only backup mechanism for the production database.
#
# Stores the dump as a GitHub Actions artifact (no new cloud infrastructure
# required). Artifacts require repo-authenticated access to download, even
# on a public repo, but the dump contains real trading/portfolio data —
# treat access to this workflow's artifacts as sensitive.

on:
  schedule:
    - cron: '0 3 * * *'  # daily, 3 AM UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Dump production database
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PROD_DATABASE_URL:-}" ]; then
            echo "::error::PROD_DATABASE_URL secret is not set"
            exit 1
          fi

          DUMP_FILE="backup-$(date -u +%F).sql"
          pg_dump "$PROD_DATABASE_URL" --no-owner --no-acl -f "$DUMP_FILE"

          # Fail loudly on a suspiciously small/empty dump rather than
          # silently uploading a broken backup as if it succeeded.
          SIZE=$(stat -c%s "$DUMP_FILE")
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Backup file is suspiciously small (${SIZE} bytes) — dump may have failed silently"
            exit 1
          fi

          echo "Backup complete: $(du -h "$DUMP_FILE")"
          echo "DUMP_FILE=$DUMP_FILE" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.DUMP_FILE }}
          retention-days: 90
