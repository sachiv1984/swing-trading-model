# .github/workflows/ci-usage-report.yml
name: CI Usage Report (Monthly)

# ST-17 (BLG-OPS-165, EPIC-04, v9.6): generates the previous full UTC
# calendar month's per-workflow CI run-minutes and artifact-storage
# report (scripts/generate_ci_usage_report.py) and commits it to
# docs/ops/ci_usage_reports/. Scheduled for the 1st of each month so the
# report runs while short-retention artifacts (7/14 days) from the
# just-closed month are still live -- see the script's own
# artifact_undercount_caveat() for what happens if this is skipped and the
# report is generated late.
#
# See the script's module docstring for why this tracks wall-clock "run
# minutes" rather than "billable minutes": this repo is public, and GitHub
# Actions does not meter/bill minutes on public repos.
#
# ST-42 (BLG-OPS-188, EPIC-06, v9.14): the only scheduled run (2026-10-01,
# run 36861580190) failed at "Commit report". The step pushed straight to
# main, and main's branch protection requires a pull request with one
# approving review and five status checks, which a GITHUB_TOKEN push cannot
# bypass. The report now goes to its own branch, ci-usage-report/<YYYY-MM>,
# and to a 90-day artifact; the workflow then opens a [GOVERNANCE] PR to
# main for a human to review and merge. If the repository does not allow
# Actions to create pull requests ("Allow GitHub Actions to create and
# approve pull requests" is off), the run still succeeds and writes the
# compare link to open the PR by hand into a warning and the job summary.
# Checks do not start on a PR opened with GITHUB_TOKEN; close and reopen it
# to run them.

on:
  schedule:
    - cron: '0 6 1 * *'  # 06:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      year_month:
        description: 'YYYY-MM to report on (default: previous full UTC calendar month)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-usage-report
  cancel-in-progress: true

jobs:
  generate-report:
    name: Generate monthly CI usage report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate report
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_YEAR_MONTH: ${{ inputs.year_month }}
        run: |
          if [ -n "$INPUT_YEAR_MONTH" ]; then
            YM="$INPUT_YEAR_MONTH"
          else
            YM="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"  # previous full UTC month
          fi
          if ! [[ "$YM" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::year_month must be YYYY-MM, got '$YM'"
            exit 1
          fi
          python3 scripts/generate_ci_usage_report.py --year-month "$YM"
          echo "year_month=$YM" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-usage-report-${{ steps.generate.outputs.year_month }}
          path: docs/ops/ci_usage_reports/${{ steps.generate.outputs.year_month }}.md
          retention-days: 90

      - name: Commit report to its branch and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YM: ${{ steps.generate.outputs.year_month }}
        run: |
          BRANCH="ci-usage-report/${YM}"
          TITLE="[GOVERNANCE] Add monthly CI usage report ${YM}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ops/ci_usage_reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit: docs/ops/ci_usage_reports/${YM}.md on main is current."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "$TITLE"
          # The branch holds only this report, so it is safe to replace on a re-run.
          git push --force origin "$BRANCH"

          COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
          EXISTING="$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url')"
          if [ -n "$EXISTING" ]; then
            echo "Updated the open PR: $EXISTING" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BODY="Monthly CI usage report for ${YM}, generated by ci-usage-report.yml (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          Checks do not start on a PR opened with GITHUB_TOKEN: close and reopen this PR to run them, then review and merge."
          if PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" 2>pr_error.txt)"; then
            echo "Opened $PR_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          elif grep -qi "not permitted to create or approve pull requests" pr_error.txt; then
            # The repository does not allow Actions to create PRs: the report is
            # safe on its branch, so warn with the link instead of failing.
            MSG="Report committed to ${BRANCH}, but Actions may not open pull requests in this repository. Open the PR from ${COMPARE}"
            echo "::warning::${MSG}"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          else
            # Any other failure (auth, network, a wrong base) fails the run.
            cat pr_error.txt
            echo "::error::gh pr create failed; the report is on ${BRANCH} (${COMPARE})"
            exit 1
          fi
