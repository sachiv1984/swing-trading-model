name: Portfolio Integration Tests

# [EPIC-03][ST-05][ST-06] — FastAPI TestClient integration tests for portfolio endpoints.
# Runs GET /portfolio tests with mocked database and pricing calls (CI-safe, no live DB).
# Blocks merge if any integration test fails.
#
# Cycle: 2026-03-15__release-v1.10
# Spec: docs/specs/api_contracts/portfolio_endpoints.md

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - 'exec/**'
      - main
      - develop

jobs:
  portfolio-integration:
    name: Portfolio Integration Tests (ST-05)
    runs-on: ubuntu-latest

    env:
      # DATABASE_URL required at import time by database.py.
      # Tests mock all DB calls — no live Postgres required.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache backend/.venv (ST-22, BLG-OPS-122)
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-py3.11-backend-venv-${{ hashFiles('backend/requirements.txt') }}

      - name: Create or verify venv (self-heals a missing OR broken/stale cache)
        working-directory: backend
        run: |
          if [ ! -x .venv/bin/python ] || ! .venv/bin/python -m pytest --version > /dev/null 2>&1; then
            echo "::warning::backend/.venv is missing or its cached restore is broken (pytest not importable) -- (re)installing fresh. See BLG-OPS gotcha: a restored venv cache can silently lose its interpreter symlink target."
            rm -rf .venv
            python -m venv .venv
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Add backend/.venv to PATH
        run: echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Run portfolio integration tests (ST-05)
        run: |
          python -m unittest tests.test_portfolio_integration -v
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: Summary
        if: always()
        run: |
          echo "Portfolio integration tests complete."
          echo "  tests/test_portfolio_integration.py"
          echo "  Covers: GET /portfolio response shape, GBP conversion (UK + US),"
          echo "          portfolio heat calculation, grace period / display_status."
          echo "  Deviation DEV-ST05-01: GET /portfolio/prospective-heat skipped"
          echo "  (endpoint not in portfolio_endpoints.md)."
