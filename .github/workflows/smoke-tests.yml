name: Critical-Path Smoke Tests (Playwright)

# ST-05: BLG-QA-05 — 3 critical-path smoke tests (add trade, view portfolio, view alerts)
#
# SCOPE CONSTRAINT: Playwright PASS is supporting evidence for non-visual AC only.
# Visual AC (colours, badges, chart rendering) require DoQ manual review.
# Flaky failures are ADVISORY — they do NOT block the PR.
# This workflow does not replace DoQ sign-off.
#
# Runs on every push/PR to main and exec/** branches.
# No path filter — these smoke tests cover the critical application paths
# and must run on every change, not just changes to specific files.

on:
  push:
    branches:
      - main
      - 'exec/**'
  pull_request:
    branches:
      - main

jobs:
  smoke:
    name: Playwright Smoke Tests — 3 Critical Paths
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ST-20 (BLG-OPS-118, EPIC-04, v8.2): cache Playwright browser binaries —
      # this workflow runs on every push with no path filter, same rationale
      # and same measured result as playwright.yml's identical caching
      # addition (see that file for the measured before/after numbers —
      # modest but real per-job saving, not a dramatic one).
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers (cache miss — full install)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        env:
          # Prevents apt/needrestart interactive prompts (e.g. "which services
          # to restart") from silently hanging the runner even under apt -y --
          # observed hang on 2026-08-19, install-deps step never returning.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Install Playwright OS dependencies only (cache hit — browsers already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        env:
          # Prevents apt/needrestart interactive prompts (e.g. "which services
          # to restart") from silently hanging the runner even under apt -y --
          # observed hang on 2026-08-19, this exact step never returning.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Run critical-path smoke tests
        # continue-on-error: true — flaky failures are advisory and MUST NOT block the PR.
        # See ST-05 AC: "Flaky test failures must not block the PR or human review — failures are advisory."
        # DoQ must review the uploaded report artifact even when this step is green.
        # ST-11 (BLG-QA-120): filters by the @smoke tag (docs/team_skills/quality/playwright_patterns.md §6)
        # rather than a hardcoded spec path, so any spec adding a @smoke-tagged test is picked up automatically.
        continue-on-error: true
        run: npx playwright test --grep @smoke
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload Playwright smoke test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 14
