name: Analytics Validation Gate

# [EPIC-01][ST-01] — CI/CD merge gate for analytics calculation integrity.
# Calls POST /validate/calculations on every PR and push to main/develop.
# Blocks merge if any metric with severity: critical has status: fail.
# Posts a structured PR comment with severity breakdown on every PR run.
#
# Cycle: 2026-03-02__release-v1.7
# Maps to: S2-01 (BLG-TECH-04)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate-analytics:
    name: Analytics Calculation Validation
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    env:
      # DATABASE_URL is required at import time by database.py.
      # The /validate/calculations endpoint uses only test data — no DB calls
      # are made during validation. A placeholder satisfies the module check.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend service
        working-directory: backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "Backend ready (attempt $i)"
              break
            fi
            sleep 1
          done

      - name: Run analytics validation
        id: validate
        run: |
          python3 - <<'EOF'
          import json, subprocess, os, sys

          # Call the validation endpoint
          res = subprocess.run(
              ['curl', '-sf', '-X', 'POST', 'http://localhost:8000/validate/calculations'],
              capture_output=True, text=True
          )

          if res.returncode != 0 or not res.stdout:
              print("ERROR: Failed to reach POST /validate/calculations")
              sys.exit(1)

          payload = json.loads(res.stdout)
          data    = payload['data']
          summary = data['summary']
          by_sev  = summary['by_severity']

          critical_failed = by_sev['critical']['failed']

          # ── Build PR comment ──────────────────────────────────────────────
          icons = {'critical': '🔴', 'high': '🟠', 'medium': '🟡', 'low': '🔵'}

          lines = [
              "## 📊 Analytics Validation Report",
              "",
              f"**Cycle:** `2026-03-02__release-v1.7` &nbsp;|&nbsp; "
              f"**Gate:** `[EPIC-01]` CI/CD Merge Gate",
              "",
              f"| Status | Count |",
              f"|--------|-------|",
              f"| ✅ Passed | {summary['passed']} |",
              f"| ⚠️ Warned | {summary['warned']} |",
              f"| ❌ Failed | {summary['failed']} |",
              f"| **Total** | **{summary['total']}** |",
              "",
              "### Severity Breakdown",
              "| Severity | Total | Passed | Warned | Failed |",
              "|----------|:-----:|:------:|:------:|:------:|",
          ]

          for tier in ['critical', 'high', 'medium', 'low']:
              t = by_sev[tier]
              lines.append(
                  f"| {icons[tier]} {tier.capitalize()} "
                  f"| {t['total']} | {t['passed']} | {t['warned']} | {t['failed']} |"
              )

          lines.append("")

          if critical_failed > 0:
              lines.append("### ⛔ MERGE BLOCKED — Critical Failures Detected")
              lines.append("")
              lines.append("The following critical-severity metrics failed validation:")
              lines.append("")
              for v in data['validations']:
                  if v['severity'] == 'critical' and v['status'] == 'fail':
                      lines.append(
                          f"- **`{v['metric']}`** — "
                          f"expected `{v['expected']}`, actual `{v['actual']}` "
                          f"(Δ `{v['diff']:.6f}`, tolerance `{v['tolerance']}`)"
                      )
          else:
              lines.append("### ✅ Merge Gate: PASSED")
              lines.append("")
              lines.append("All critical analytics metrics validated successfully. No merge block.")

          lines += [
              "",
              "---",
              f"> *Generated by `[EPIC-01][ST-01]` validate-analytics · {data['timestamp']}*",
          ]

          report = "\n".join(lines)
          print(report)

          # ── Write outputs ─────────────────────────────────────────────────
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"critical_failed={critical_failed}\n")

          with open('validation_report.md', 'w') as fh:
              fh.write(report)

          with open('validation_full.json', 'w') as fh:
              json.dump(data, fh, indent=2)
          EOF

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const body = fs.readFileSync('validation_report.md', 'utf8');
            const marker = '📊 Analytics Validation Report';

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on critical violations
        if: steps.validate.outputs.critical_failed != '0'
        run: |
          echo "⛔ MERGE BLOCKED: ${{ steps.validate.outputs.critical_failed }} critical validation failure(s)."
          echo "Review the PR comment for metric-level detail."
          exit 1
