name: Service Layer Coverage Gate

# ST-13: Tier 1 Pure-Math Service Coverage
# Runs pytest-cov against Tier 1 services (no DB calls — DB functions mocked).
# Blocks merge if coverage on any Tier 1 service drops below 80%.
#
# Tier 1 scope (v1.9):
#   - services/grace_service.py
#   - services/drawdown_service.py
#
# Threshold: 80% line coverage (--fail-under=80)
# Test file:  tests/test_service_coverage.py

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - 'exec/**'
      - main
      - develop

jobs:
  changes:
    # ST-31 (EPIC-05, v9.15, BLG-OPS-191): governance-only and docs-only pushes
    # skip this workflow's suite. See .github/actions/detect-code-changes.
    name: Detect code changes (ST-31)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout the detector only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/detect-code-changes
            scripts/ci_code_changes.py
          sparse-checkout-cone-mode: false
      - id: detect
        uses: ./.github/actions/detect-code-changes

  service-coverage:
    name: Service Layer Coverage (ST-13)
    needs: changes
    # Skipped (reported as success) only when detection says "false"; runs if
    # detection failed or could not tell (ST-31).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache backend/.venv (ST-22, BLG-OPS-122)
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-py3.11-backend-venv-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}

      - name: Create or verify venv (self-heals a missing OR broken/stale cache)
        working-directory: backend
        run: |
          if [ ! -x .venv/bin/python ] || ! .venv/bin/python -m pytest --version > /dev/null 2>&1; then
            echo "::warning::backend/.venv is missing or its cached restore is broken (pytest not importable) -- (re)installing fresh. See BLG-OPS gotcha: a restored venv cache can silently lose its interpreter symlink target."
            rm -rf .venv
            python -m venv .venv
            .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
          fi

      - name: Add backend/.venv to PATH
        run: echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Tier 1 service coverage (ST-13)
        run: |
          python -m pytest tests/test_service_coverage.py -v \
            --cov=services.grace_service \
            --cov=services.drawdown_service \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Summary
        if: always()
        run: |
          echo "Service layer coverage gate complete."
          echo "  Tier 1: services/grace_service.py + services/drawdown_service.py"
          echo "  Threshold: 80% line coverage"
          echo "If the step failed, check tests/test_service_coverage.py against"
          echo "  position_endpoints.md v1.8.3 (grace) and metrics_definitions.md v1.5.8 (drawdown)."
