name: Update Visual Snapshot Baselines

# Manual trigger only — run this when visual snapshot tests are failing due to
# Chromium version differences between local and CI environments.
#
# What it does:
#   1. Runs visual-snapshots.spec.js with --update-snapshots on the CI runner
#   2. Commits and pushes the regenerated PNGs to the current branch
#
# After running: set continue-on-error: false in playwright.yml to make the
# visual job a blocking gate.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update snapshots on'
        required: false
        default: 'main'

jobs:
  update-snapshots:
    name: Regenerate Visual Snapshot Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Regenerate visual snapshot baselines (CSS-assertion spec)
        run: npx playwright test tests/e2e/visual-snapshots.spec.js --update-snapshots

      - name: Regenerate visual regression baselines (pixel-level spec, ST-18)
        # ST-18 (BLG-QA-81, EPIC-04, v9.0): separate config — see
        # playwright.visual-regression.config.js and playwright.config.js's
        # testIgnore comment for why this spec is excluded from the main
        # config's default glob. Regenerating on the actual CI runner (not
        # locally) is exactly the point of this workflow for this spec.
        run: npx playwright test --config=playwright.visual-regression.config.js --update-snapshots
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Commit and push updated baselines
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tests/e2e/__snapshots__/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "[GOVERNANCE] Regenerate visual snapshot baselines on CI runner ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Upload snapshot diff artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updated-visual-snapshots
          path: tests/e2e/__snapshots__/
          retention-days: 7
