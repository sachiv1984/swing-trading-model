name: OpenAPI Drift Detection

# [EPIC-02][ST-08] — Detect drift between docs/reference/openapi.yaml and
# the canonical markdown API contracts in docs/specs/api_contracts/.
#
# Approach: regex-based path/method extraction and cross-check (no YAML parser).
#   Regex is used deliberately: the YAML parser cannot handle malformed openapi.yaml
#   files — and a malformed file IS a form of drift we want to surface, not crash on.
#   1. Parse markdown contracts for "## METHOD /path" section headings.
#   2. Parse openapi.yaml for "  /path:" blocks and their "    method:" keys.
#   3. Flag: any contract-declared METHOD+PATH missing from openapi.yaml.
#   4. Flag: any openapi.yaml METHOD+PATH missing from all contracts.
#   5. Flag: YAML parse errors in openapi.yaml as a blocking issue.
#
# Canonical truth: markdown contracts take precedence over openapi.yaml.
# See docs/reference/openapi.yaml header for source-of-truth hierarchy.
#
# Dependency: fully meaningful after EPIC-03 (ST-10, openapi.yaml v1.9.0) merges.
# Until then, known pre-v1.9.0 gaps are listed in KNOWN_GAPS below.
#
# Cycle: 2026-03-04__release-v1.8
# Maps to: ST-08 (Automated OpenAPI Drift Detection)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  openapi-drift:
    name: OpenAPI Drift Detection (ST-08)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml -q

      - name: API Contract Heading-Level Compliance Lint (ST-12)
        # Runs AHEAD OF the drift-detection step below (ST-12, EPIC-12, v7.8,
        # BLG-OPS-117). Catches the documented "###-level silent-fail" case
        # from CLAUDE.md §2: the drift regex below only matches literal
        # `##` headings and silently ignores any other depth, so a
        # miscoded `### METHOD /path` heading is invisible to it rather
        # than caught. This step actively scans for ANY endpoint-shaped
        # heading at the wrong depth and fails fast, before drift detection
        # even runs.
        run: python3 scripts/lint_api_contract_headings.py

      - name: Detect drift
        id: drift
        # ST-20 (BLG-QA-173, EPIC-05, v9.6): this step previously carried the
        # drift-detection logic inline as a Python heredoc, which could not be
        # imported by pytest and so had no regression test of its own — a
        # regression in the gate's own logic could silently stop protecting
        # anything. Extracted, byte-for-byte behaviourally identical, into
        # scripts/check_openapi_drift.py (now regression-tested by
        # tests/test_openapi_drift_gate.py, including a deliberate-drift
        # fixture and a mutation check proving the test fails if the gate's
        # own compute_drift() logic is reverted to a no-op).
        run: python3 scripts/check_openapi_drift.py

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const body = fs.readFileSync('drift_report.md', 'utf8');
            const marker = 'OpenAPI Drift Detection Report';

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on drift
        if: steps.drift.outputs.drift_count != '0'
        run: |
          echo "MERGE BLOCKED: ${{ steps.drift.outputs.drift_count }} OpenAPI drift/YAML issue(s) detected."
          echo "Review the PR comment for path-level detail."
          exit 1
