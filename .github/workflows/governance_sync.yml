name: "Governance Sync Loop"

on:
  push:
    branches:
      - 'exec/**' # Triggers when you push to your exec execution branches
      - 'main'    # ST-05 (BLG-GOV-16): also triggers on merge to main so issues are closed even if exec-branch push was missed

permissions:
  issues: write

jobs:
  sync_state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Commits for Governance
        id: parse
        run: |
          # Extract all [EPIC-XX][ST-XX] patterns from all commits in the push range
          # Uses $BEFORE..$AFTER to cover every commit in a batch push (not just the last)
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          # Guard: null SHA (new branch) or non-ancestor BEFORE (force-push/rebase) — range is invalid
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
             ! git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            RANGE_BASE="origin/main"
            ALL_MSGS=$(git log origin/main.."$AFTER" --pretty=%B)
          else
            RANGE_BASE="$BEFORE"
            ALL_MSGS=$(git log "$BEFORE".."$AFTER" --pretty=%B)
          fi
          MSG_ST_IDS=$(echo "$ALL_MSGS" | grep -oE '\[(ST-[0-9]+)\]' | tr -d '[]' | sort -u)

          # ST-19 (BLG-GOV-314): the commit-message scan above misses a story whose
          # completion is recorded in a *separate* follow-up commit tagged only
          # [GOVERNANCE] (execution_prompt.md's own commit→push→get-SHA→
          # separate-governance-commit convention) — that commit's message carries
          # no [ST-xx] tag, so it was never even considered for closing, regardless
          # of what execution_state now says. Fix: separately diff every changed
          # execution_state file (per-EPIC and legacy) in this push range and detect
          # any story whose status newly became done/merged — independent of commit
          # message content — then union with the message-derived set above.
          DIFF_ST_IDS=""
          CHANGED_STATE_FILES=$(git diff --name-only "$RANGE_BASE" "$AFTER" -- 'claude/cycles/*/execution_state/EPIC-*.json' 'claude/cycles/*/execution_state.json' 2>/dev/null || true)
          for f in $CHANGED_STATE_FILES; do
            AFTER_JSON=$(git show "$AFTER:$f" 2>/dev/null || echo '{}')
            BEFORE_JSON=$(git show "$RANGE_BASE:$f" 2>/dev/null || echo '{}')
            # Normalise both per-EPIC (.stories) and legacy (.epics.*.stories) shapes to a flat {st_id: status} map
            AFTER_MAP=$(echo "$AFTER_JSON" | jq -c '
              if has("stories") then .stories
              elif has("epics") then ([.epics[].stories] | add // {})
              else {} end
              | with_entries(.value = .value.status)
            ' 2>/dev/null || echo '{}')
            BEFORE_MAP=$(echo "$BEFORE_JSON" | jq -c '
              if has("stories") then .stories
              elif has("epics") then ([.epics[].stories] | add // {})
              else {} end
              | with_entries(.value = .value.status)
            ' 2>/dev/null || echo '{}')
            NEWLY_DONE=$(jq -n --argjson after "$AFTER_MAP" --argjson before "$BEFORE_MAP" '
              $after
              | to_entries[]
              | select(.value == "done" or .value == "merged")
              | select(($before[.key] // "") != "done" and ($before[.key] // "") != "merged")
              | .key
            ' 2>/dev/null | tr -d '"')
            DIFF_ST_IDS="$DIFF_ST_IDS $NEWLY_DONE"
          done
          DIFF_ST_IDS=$(echo "$DIFF_ST_IDS" | tr ' ' '\n' | sed '/^$/d' | sort -u)

          ST_IDS=$(printf '%s\n%s\n' "$MSG_ST_IDS" "$DIFF_ST_IDS" | sed '/^$/d' | sort -u | tr '\n' ' ')
          if [ -n "$ST_IDS" ]; then
            echo "st_ids=$ST_IDS" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Update State and Close Issues
        if: steps.parse.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ST-18 (BLG-GOV-285, EPIC-03, v8.2): a commit referencing [ST-xx] in its
          # message is not necessarily a completion commit — a delegation-record-only
          # commit (delegation_log.md update) also carries the same [EPIC-xx][ST-xx]
          # tag per the mandatory commit-format rule (CLAUDE.md), and was previously
          # auto-closing the issue prematurely (recurred v8.0 EPIC-02/ST-08, issue
          # #1148; v8.1 EPIC-02/ST-02, issue #1169 — both required a manual reopen).
          #
          # Fix: before closing, cross-check the story's actual status in
          # execution_state — the ground truth of whether it is genuinely done —
          # rather than trusting the commit message alone. Tries the current
          # per-EPIC mechanism (shared_standards.md §12.1) first, falls back to the
          # legacy single execution_state.json for cycles that predate it.
          ACTIVE_CYCLE=$(jq -r '.active_cycle // empty' .claude_current_state.json 2>/dev/null || echo "")

          is_story_done() {
            local st_id="$1"
            if [ -z "$ACTIVE_CYCLE" ]; then
              echo "unknown"; return
            fi
            local state_dir="claude/cycles/${ACTIVE_CYCLE}/execution_state"
            local status=""
            if [ -d "$state_dir" ]; then
              for epic_file in "$state_dir"/EPIC-*.json; do
                [ -f "$epic_file" ] || continue
                status=$(jq -r --arg st "$st_id" '.stories[$st].status // empty' "$epic_file" 2>/dev/null)
                [ -n "$status" ] && break
              done
            fi
            if [ -z "$status" ]; then
              local legacy_file="claude/cycles/${ACTIVE_CYCLE}/execution_state.json"
              if [ -f "$legacy_file" ]; then
                status=$(jq -r --arg st "$st_id" '(.epics // {}) | to_entries[] | .value.stories[$st].status? // empty' "$legacy_file" 2>/dev/null | head -1)
              fi
            fi
            if [ -z "$status" ]; then
              echo "unknown"
            elif [ "$status" = "done" ] || [ "$status" = "merged" ]; then
              echo "yes"
            else
              echo "no"
            fi
          }

          # Close all issues referenced in the push range (handles batch pushes)
          for ST_ID in ${{ steps.parse.outputs.st_ids }}; do
            DONE=$(is_story_done "$ST_ID")
            if [ "$DONE" = "no" ]; then
              echo "Skipping close for ${ST_ID} — execution_state status is not done/merged (likely a delegation-record-only commit)"
              continue
            fi
            # ST-19 (BLG-GOV-314): "unknown" (no ACTIVE_CYCLE, or no execution_state
            # entry found for this ST_ID at all) now SKIPS rather than closes
            # unconditionally. The prior "unknown = close" default was added to
            # preserve pre-per-EPIC-mechanism-cycle behaviour, but under the
            # mechanism actually in use, "unknown" much more often means "this
            # story's tracking entry hasn't landed yet" (e.g. its work commit was
            # pushed before any execution_state entry exists for it) than "this is
            # a genuinely untracked reference" — closing in that case is a false
            # positive with a real consequence: a story that later turns out
            # blocked_backend/blocked_decision reads as wrongly-closed-done with
            # nothing to reopen it (confirmed live, ST-02/#1463, v9.0). A story
            # with a real execution_state entry that already reads done/merged is
            # still found and closed via the "yes" branch above — this change only
            # removes the unconditional-close fallback for the genuinely-unknown case.
            if [ "$DONE" = "unknown" ]; then
              echo "Skipping close for ${ST_ID} — no execution_state entry found (tracking commit may not have landed yet, or this is a genuinely untracked reference)"
              continue
            fi
            # DONE = "yes" (confirmed complete via execution_state). Use exact
            # title prefix match to prevent fuzzy search returning wrong issues
            # (e.g. a second [ST-14] commit must not close [ST-10] when [ST-14] is already closed)
            ISSUE_NUMBER=$(gh issue list --search "[${ST_ID}] in:title" --state open --json number,title \
              --jq "[.[] | select(.title | startswith(\"[${ST_ID}]\"))] | .[0].number // empty")
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER"
              echo "Closed issue #${ISSUE_NUMBER} for ${ST_ID}"
            else
              echo "No open issue found for ${ST_ID} — may already be closed or never created"
            fi
          done

          # 2. Update the local state.json (Optional: can be done by Claude locally)
          echo "Syncing state for all referenced ST items..."
