name: "Governance Sync Loop"

on:
  push:
    branches:
      - 'exec/**' # Triggers when you push to your exec execution branches
      - 'main'    # ST-05 (BLG-GOV-16): also triggers on merge to main so issues are closed even if exec-branch push was missed

permissions:
  issues: write

jobs:
  sync_state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Commits for Governance
        id: parse
        run: |
          # Extract all [EPIC-XX][ST-XX] patterns from all commits in the push range
          # Uses $BEFORE..$AFTER to cover every commit in a batch push (not just the last)
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          # Guard: null SHA (0000…) means new branch first push — git log range is invalid
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            ALL_MSGS=$(git log "$AFTER" --pretty=%B --not --remotes=origin/main)
          else
            ALL_MSGS=$(git log "$BEFORE".."$AFTER" --pretty=%B)
          fi
          ST_IDS=$(echo "$ALL_MSGS" | grep -oE '\[(ST-[0-9]+)\]' | tr -d '[]' | sort -u | tr '\n' ' ')
          if [ -n "$ST_IDS" ]; then
            echo "st_ids=$ST_IDS" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Update State and Close Issues
        if: steps.parse.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Close all issues referenced in the push range (handles batch pushes)
          for ST_ID in ${{ steps.parse.outputs.st_ids }}; do
            # Use exact title prefix match to prevent fuzzy search returning wrong issues
            # (e.g. a second [ST-14] commit must not close [ST-10] when [ST-14] is already closed)
            ISSUE_NUMBER=$(gh issue list --search "[${ST_ID}] in:title" --state open --json number,title \
              --jq "[.[] | select(.title | startswith(\"[${ST_ID}]\"))] | .[0].number // empty")
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER"
              echo "Closed issue #${ISSUE_NUMBER} for ${ST_ID}"
            else
              echo "No open issue found for ${ST_ID} — may already be closed or never created"
            fi
          done

          # 2. Update the local state.json (Optional: can be done by Claude locally)
          echo "Syncing state for all referenced ST items..."
