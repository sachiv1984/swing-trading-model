# .github/workflows/si05-digest-staleness-check.yml
name: SI-05 Digest Staleness Check

# ST-02 (BLG-OPS-130, EPIC-01, v8.3): recurring check that the SI-05 weekly
# digest is actually being delivered. Exists because the digest silently
# stopped sending for ~7 weeks (BLG-OPS-129) with no mechanism to catch a
# similar gap before the next multi-week effectiveness review. Queries
# si05_digest_log directly (same pattern as check_staging_deploy_drift.py
# querying the Render API directly, ST-07/BLG-OPS-128, v8.2) rather than
# adding a new backend endpoint solely for this check.
#
# Alert pattern reused from staging-deploy-drift-check.yml / health-check-
# alert.yml (curl + Telegram + ::warning:: graceful fallback when secrets
# aren't configured).
#
# The deliberately-stale-test AC for this story is satisfied by
# tests/test_si05_digest_staleness.py (CI-reproducible pure-logic unit
# tests), not by this workflow -- this workflow is the live wiring, not the
# AC evidence itself. See docs/ops/si05_digest_delivery_root_cause_2026-08-05.md.

on:
  schedule:
    - cron: '0 8 * * *'  # daily 08:00 UTC — frequent enough to catch a missed weekly send within a day
  workflow_dispatch: {}

concurrency:
  group: si05-digest-staleness-check
  cancel-in-progress: true

jobs:
  staleness-check:
    name: Check si05_digest_log for an overdue digest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Run staleness check
        id: check
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -o pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::PROD_DATABASE_URL not configured as a repo secret — staleness check skipped."
            exit 0
          fi
          set +e
          python3 scripts/check_si05_digest_staleness.py | tee staleness_output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Send alert on overdue digest
        if: steps.check.outputs.exit_code == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REASON=$(grep '^\[OVERDUE\]' staleness_output.txt || true)
          MESSAGE="SI-05 digest overdue: ${REASON} ${RUN_URL}"
          echo "$MESSAGE"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}"
          else
            echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not configured as repo secrets — alert not sent. Message would have been: ${MESSAGE}"
          fi
