# .github/workflows/render-si05-log-query.yml
# On-demand (workflow_dispatch only) Render internal log query for
# POST /digest/si05/send invocation timings — ST-21 (BLG-OPS-54, EPIC-05,
# v8.4). Standard external HTTP timing (the §1.2 methodology used
# elsewhere in api_performance_baseline.md) does not apply to this
# endpoint: it sends a real Telegram message on every successful
# invocation, so firing 5-7 live test calls just to measure latency would
# spam the actual digest channel. Render's own internal request logs
# (already recorded for every real invocation — scheduled cron + any
# manual triggers) give durations without firing new sends.
#
# Uses the Render Platform API (RENDER_PLATFORM_API_KEY secret) — same
# auth pattern already established in scripts/check_staging_deploy_drift.py
# (BLG-OPS-128, v8.2).

name: Render SI-05 Log Query (ST-21, one-off diagnostic)

on:
  workflow_dispatch:
    inputs:
      hours_back:
        description: 'How many hours of log history to search'
        required: false
        default: '168'

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      RENDER_PLATFORM_API_KEY: ${{ secrets.RENDER_PLATFORM_API_KEY }}
      SERVICE_ID: srv-d6rtdg94tr6s73ce2j6g
      HOURS_BACK: ${{ inputs.hours_back }}

    steps:
      - name: Discover ownerId and query logs
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          api_key = os.environ["RENDER_PLATFORM_API_KEY"]
          service_id = os.environ["SERVICE_ID"]
          hours_back = int(os.environ.get("HOURS_BACK") or "168")
          headers = {"Authorization": f"Bearer {api_key}", "Accept": "application/json"}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read())

          print("--- Step 1: service details (to get ownerId) ---")
          svc = get(f"https://api.render.com/v1/services/{service_id}")
          owner_id = svc.get("ownerId") or svc.get("owner", {}).get("id")
          print(f"ownerId: {owner_id}")

          end = datetime.now(timezone.utc)
          start = end - timedelta(hours=hours_back)
          start_iso = start.strftime("%Y-%m-%dT%H:%M:%SZ")
          end_iso = end.strftime("%Y-%m-%dT%H:%M:%SZ")

          print(f"\n--- Step 2: logs query ({start_iso} to {end_iso}) ---")
          logs_url = (
              "https://api.render.com/v1/logs"
              f"?ownerId={owner_id}"
              f"&resource={service_id}"
              f"&startTime={start_iso}"
              f"&endTime={end_iso}"
              "&direction=backward"
              "&limit=100"
              "&text=si05"
          )
          try:
              logs = get(logs_url)
              print("RAW_LOGS_RESPONSE_START")
              print(json.dumps(logs, indent=2)[:8000])
              print("RAW_LOGS_RESPONSE_END")
          except Exception as e:
              print(f"Logs query failed: {e}")
          PYEOF
