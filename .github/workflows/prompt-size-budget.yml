name: "Prompt Size Budget"

# [GOVERNANCE] (AUD-2026-11-03-003) — shared_standards.md §11's engine prompt
# size budget relied on each bump citing a split item; most bumps did not and
# the over-cap prompts kept growing. scripts/check_prompt_size_budget.py fails
# when a prompt crosses 68,500 bytes, or when an over-cap prompt grows past
# its entry in scripts/prompt_size_baseline.json. Raising a baseline is a
# deliberate edit in the same PR.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'claude/system/**'
      - 'scripts/prompt_size_baseline.json'
      - 'scripts/check_prompt_size_budget.py'

jobs:
  prompt_size_budget:
    name: Engine prompt size budget (AUD-2026-11-03-003)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check engine prompt sizes
        run: python3 scripts/check_prompt_size_budget.py
