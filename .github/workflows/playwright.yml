name: Risk Dashboard Acceptance Tests (Playwright)

# ST-11: Canonical Test Scenario Library Phase 1
# Runs 17 previously-blocked Risk Dashboard acceptance scenarios using
# Playwright network interception (mock layer). No live backend required.

on:
  push:
    branches:
      - main
      - 'exec/**'
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'

jobs:
  playwright:
    name: Playwright E2E — Risk Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Risk Dashboard acceptance tests
        run: npx playwright test tests/e2e/risk-dashboard.spec.js
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
