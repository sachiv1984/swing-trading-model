name: Playwright E2E Acceptance Tests

# ST-15 (BLG-OPS-97, EPIC-03, v9.3): playwright-e2e's shard count increased
# 4 -> 8. docs/ops/ci_pipeline_baseline.md §8.1 (2026-09-07) measured the
# 4-way critical path (slowest shard) at 210.6s mean / 235s max — comfortably
# under the 480s alert budget, but backend/frontend jobs were already fully
# parallel with each other (separate workflow files, no `needs:` dependency
# anywhere in .github/workflows/ except 2 unrelated maintenance workflows)
# and Playwright's own shard balance was already confirmed healthy (§7).
# With no serial bottleneck left to remove, the remaining lever for reducing
# the critical path itself is more shards — each shard is an independent
# runner VM (public repo, no concurrency/cost limit), so doubling shard count
# roughly halves the test-execution portion of each shard's wall-clock while
# its fixed per-shard setup cost (npm ci + browser install, ~70s) stays flat.
# Before/after evidence: docs/ops/ci_pipeline_baseline.md §10.
#
# Two jobs:
#
# 1. playwright-e2e  — behavioural acceptance tests (blocking gate)
#    All spec files under tests/e2e/**/*.spec.js discovered automatically via glob.
#    No live backend required (page.route() interception).
#    New spec files added to tests/e2e/ are automatically included — no manual registration.
#
# 2. playwright-visual — CSS class/attribute assertions for visual AC (blocking gate)
#    visual-snapshots.spec.js — 14 element-level tests verifying colours and structure
#    via CSS class assertions (no pixel comparison — reliable across Chromium versions).
#
# 3. playwright-visual-regression — pixel-level toHaveScreenshot() baselines
#    (ST-18, BLG-QA-81, EPIC-04, v9.0), advisory only (continue-on-error: true).
#    visual-regression-baselines.spec.js — dual-theme baselines for 4 representative
#    contrast-sensitive pages plus a chart-heavy component (PerformanceAnalytics).
#    Uses playwright.visual-regression.config.js — the main config testIgnores this
#    spec (see that config's comment) because baselines committed with the story were
#    generated locally, not on this runner, and are likely to diff on font-rendering
#    on their first CI run. Advisory until baselines are regenerated on-runner via the
#    "Update Visual Snapshot Baselines" workflow and someone deliberately promotes
#    this job to blocking (drop continue-on-error), matching how visual-snapshots.spec.js
#    itself was handled before it became a blocking gate.
#
# ST-36 (BLG-OPS-206, EPIC-06, v9.18): the production bundle is built once per
# run by the build-e2e-bundle job (scripts/build_e2e_bundle.js, which reads
# playwright.config.js's webServer.env so the env has one source) and uploaded
# as the e2e-bundle artifact. The 8 E2E shards and both visual jobs download it
# and only run `npx serve -s build -l 3000` (E2E_PREBUILT_BUNDLE=1), instead of
# each running `npm run build`. Before/after timings: docs/ops/ci_pipeline_baseline.md.
#
# Spec registration: automatic via glob (BLG-QA-62, v6.2 ST-13), except the one
# explicit testIgnore exception above.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - 'exec/**'
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'src/pages/Screener.js'
      - 'src/Layout.js'
      - 'src/pages/**'
      - 'src/components/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'playwright.visual-regression.config.js'
      - '.github/workflows/playwright.yml'
      - 'scripts/build_e2e_bundle.js'
      # ST-06 (BLG-OPS-149, EPIC-03, v9.2): a dependency bump can change
      # resolved package versions the E2E suite exercises (Playwright itself
      # included) without touching any src/ or tests/e2e/ file — the job must
      # still run so a bad bump is caught before merge, not just on the next
      # unrelated frontend PR.
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'src/pages/Screener.js'
      - 'src/Layout.js'
      - 'src/pages/**'
      - 'src/components/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'playwright.visual-regression.config.js'
      - '.github/workflows/playwright.yml'
      - 'scripts/build_e2e_bundle.js'
      # ST-06 (BLG-OPS-149, EPIC-03, v9.2): see push.paths comment above.
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-e2e-bundle:
    name: Build E2E bundle (once per run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build the bundle with playwright.config.js's webServer.env
        run: node scripts/build_e2e_bundle.js

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bundle
          path: build/
          if-no-files-found: error
          # Kept 7 days so "Re-run failed jobs" on a shard (which does not
          # re-run this job) still finds the bundle.
          retention-days: 7

  playwright-e2e:
    needs: build-e2e-bundle
    # Runs when the build failed too, so the download step fails this job
    # instead of the job being skipped (a skipped job passes a required check).
    if: ${{ !cancelled() }}
    name: Playwright E2E Acceptance Tests (${{ matrix.shardIndex }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the E2E bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: build/

      - name: Confirm the bundle is present
        run: test -f build/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ST-20 (BLG-OPS-118, EPIC-04, v8.2): cache Playwright browser binaries
      # across runs, keyed on the resolved @playwright/test version from
      # package-lock.json. OS-level apt dependencies (--with-deps) are not
      # part of this cache and are re-installed every run regardless.
      #
      # Measured result (cache-miss vs cache-hit run of the same job, shard
      # 1/4, 2026-08-04): the browser-install step itself dropped from 19s to
      # 12s (a real ~37% reduction for that step) — smaller than initially
      # expected, because GitHub-hosted ubuntu-latest runners already install
      # Chromium quickly (no slow cold download observed even on the
      # cache-miss run). Total job duration was effectively unchanged
      # (~220s vs ~219s) since `npm ci` (~55-60s) and the test run itself
      # (~2m10s) dominate and vary run-to-run by more than this step's
      # savings. The optimisation is still correct and worth keeping (it
      # eliminates a real redundant download on every run, which matters more
      # under network variance than this one measurement shows), but it is
      # not the dramatic win the story's title implied — documented honestly
      # per the AC's "measurable" (not "large") requirement.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers (cache miss — full install)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        env:
          # Prevents apt/needrestart interactive prompts (e.g. "which services
          # to restart") from silently hanging the runner even under apt -y --
          # observed hang on 2026-08-19, install-deps step never returning.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Install Playwright OS dependencies only (cache hit — browsers already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        env:
          # Prevents apt/needrestart interactive prompts (e.g. "which services
          # to restart") from silently hanging the runner even under apt -y --
          # observed hang on 2026-08-19, this exact step never returning.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Run E2E acceptance tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true
          # Serves the prebuilt bundle. Build-time env (REACT_APP_*) belongs in
          # playwright.config.js webServer.env, which the build job reads.
          E2E_PREBUILT_BUNDLE: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 14

  playwright-visual:
    needs: build-e2e-bundle
    # Runs when the build failed too, so the download step fails this job
    # instead of the job being skipped (a skipped job passes a required check).
    if: ${{ !cancelled() }}
    name: Playwright Visual Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the E2E bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: build/

      - name: Confirm the bundle is present
        run: test -f build/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ST-20 (BLG-OPS-118, EPIC-04, v8.2): cache Playwright browser binaries
      # across runs, keyed on the resolved @playwright/test version from
      # package-lock.json. OS-level apt dependencies (--with-deps) are not
      # part of this cache and are re-installed every run regardless.
      #
      # Measured result (cache-miss vs cache-hit run of the same job, shard
      # 1/4, 2026-08-04): the browser-install step itself dropped from 19s to
      # 12s (a real ~37% reduction for that step) — smaller than initially
      # expected, because GitHub-hosted ubuntu-latest runners already install
      # Chromium quickly (no slow cold download observed even on the
      # cache-miss run). Total job duration was effectively unchanged
      # (~220s vs ~219s) since `npm ci` (~55-60s) and the test run itself
      # (~2m10s) dominate and vary run-to-run by more than this step's
      # savings. The optimisation is still correct and worth keeping (it
      # eliminates a real redundant download on every run, which matters more
      # under network variance than this one measurement shows), but it is
      # not the dramatic win the story's title implied — documented honestly
      # per the AC's "measurable" (not "large") requirement.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers (cache miss — full install)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        env:
          # Prevents apt/needrestart interactive prompts (e.g. "which services
          # to restart") from silently hanging the runner even under apt -y --
          # observed hang on 2026-08-19, install-deps step never returning.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Install Playwright OS dependencies only (cache hit — browsers already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        env:
          # Prevents apt/needrestart interactive prompts (e.g. "which services
          # to restart") from silently hanging the runner even under apt -y --
          # observed hang on 2026-08-19, this exact step never returning.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Run visual snapshot tests
        run: npx playwright test tests/e2e/visual-snapshots.spec.js
        env:
          CI: true
          # Serves the prebuilt bundle. Build-time env (REACT_APP_*) belongs in
          # playwright.config.js webServer.env, which the build job reads.
          E2E_PREBUILT_BUNDLE: '1'

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshot-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  playwright-visual-regression:
    needs: build-e2e-bundle
    # Runs when the build failed too, so the download step fails this job
    # instead of the job being skipped (a skipped job passes a required check).
    if: ${{ !cancelled() }}
    name: Playwright Visual Regression Baselines (pixel-level, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the E2E bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: build/

      - name: Confirm the bundle is present
        run: test -f build/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers (cache miss — full install)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Install Playwright OS dependencies only (cache hit — browsers already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      # Advisory only (ST-18, BLG-QA-81, EPIC-04, v9.0) — baselines committed with
      # this story were generated locally, not on this runner; see playwright.yml's
      # header comment and playwright.config.js's testIgnore comment for why a
      # first-run diff here is expected, not a real regression.
      - name: Run visual regression baseline tests
        continue-on-error: true
        run: npx playwright test --config=playwright.visual-regression.config.js
        env:
          CI: true
          # Serves the prebuilt bundle. Build-time env (REACT_APP_*) belongs in
          # playwright.config.js webServer.env, which the build job reads.
          E2E_PREBUILT_BUNDLE: '1'

      - name: Upload visual regression diff artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
