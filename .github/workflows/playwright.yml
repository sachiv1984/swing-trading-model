name: Playwright E2E Acceptance Tests

# Two jobs:
#
# 1. playwright-e2e  — behavioural acceptance tests (blocking gate)
#    All spec files under tests/e2e/**/*.spec.js discovered automatically via glob.
#    No live backend required (page.route() interception).
#    New spec files added to tests/e2e/ are automatically included — no manual registration.
#
# 2. playwright-visual — CSS class/attribute assertions for visual AC (blocking gate)
#    visual-snapshots.spec.js — 14 element-level tests verifying colours and structure
#    via CSS class assertions (no pixel comparison — reliable across Chromium versions).
#
# Spec registration: automatic via glob (BLG-QA-62, v6.2 ST-13).
# No manual spec inventory maintained here — add spec files to tests/e2e/ and they run.

on:
  push:
    branches:
      - main
      - 'exec/**'
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'src/pages/Screener.js'
      - 'src/Layout.js'
      - 'src/pages/**'
      - 'src/components/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'src/pages/Screener.js'
      - 'src/Layout.js'
      - 'src/pages/**'
      - 'src/components/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - '.github/workflows/playwright.yml'

jobs:
  playwright-e2e:
    name: Playwright E2E Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run all E2E acceptance tests
        run: npx playwright test
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  playwright-visual:
    name: Playwright Visual Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual snapshot tests
        run: npx playwright test tests/e2e/visual-snapshots.spec.js
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshot-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
