name: Playwright E2E Acceptance Tests

# ST-11: Canonical Test Scenario Library Phase 1 — Risk Dashboard (17 scenarios)
# ST-06: Chart Interactivity E2E — SC-CHART-IX-01 through SC-CHART-IX-06 (16 sub-scenarios)
# All suites use Playwright network interception (mock layer). No live backend required.

on:
  push:
    branches:
      - main
      - 'exec/**'
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'

jobs:
  playwright-risk-dashboard:
    name: Playwright E2E — Risk Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Risk Dashboard acceptance tests
        run: npx playwright test tests/e2e/risk-dashboard.spec.js
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-risk-dashboard
          path: playwright-report/
          retention-days: 14

  playwright-chart-interactivity:
    name: Playwright E2E — Chart Interactivity (ST-06)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Chart Interactivity acceptance tests
        run: npx playwright test tests/e2e/chart-interactivity.spec.js
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-chart-interactivity
          path: playwright-report/
          retention-days: 14
