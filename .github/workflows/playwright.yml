name: Playwright E2E Acceptance Tests

# Two jobs:
#
# 1. playwright-e2e  — behavioural acceptance tests (blocking gate)
#    All spec files under tests/e2e/**/*.spec.js discovered automatically via glob.
#    No live backend required (page.route() interception).
#    New spec files added to tests/e2e/ are automatically included — no manual registration.
#
# 2. playwright-visual — CSS class/attribute assertions for visual AC (blocking gate)
#    visual-snapshots.spec.js — 14 element-level tests verifying colours and structure
#    via CSS class assertions (no pixel comparison — reliable across Chromium versions).
#
# 3. playwright-visual-regression — pixel-level toHaveScreenshot() baselines
#    (ST-18, BLG-QA-81, EPIC-04, v9.0), advisory only (continue-on-error: true).
#    visual-regression-baselines.spec.js — dual-theme baselines for 4 representative
#    contrast-sensitive pages plus a chart-heavy component (PerformanceAnalytics).
#    Uses playwright.visual-regression.config.js — the main config testIgnores this
#    spec (see that config's comment) because baselines committed with the story were
#    generated locally, not on this runner, and are likely to diff on font-rendering
#    on their first CI run. Advisory until baselines are regenerated on-runner via the
#    "Update Visual Snapshot Baselines" workflow and someone deliberately promotes
#    this job to blocking (drop continue-on-error), matching how visual-snapshots.spec.js
#    itself was handled before it became a blocking gate.
#
# Spec registration: automatic via glob (BLG-QA-62, v6.2 ST-13), except the one
# explicit testIgnore exception above.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - 'exec/**'
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'src/pages/Screener.js'
      - 'src/Layout.js'
      - 'src/pages/**'
      - 'src/components/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'playwright.visual-regression.config.js'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'src/pages/Screener.js'
      - 'src/Layout.js'
      - 'src/pages/**'
      - 'src/components/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'playwright.visual-regression.config.js'
      - '.github/workflows/playwright.yml'

jobs:
  playwright-e2e:
    name: Playwright E2E Acceptance Tests (${{ matrix.shardIndex }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ST-20 (BLG-OPS-118, EPIC-04, v8.2): cache Playwright browser binaries
      # across runs, keyed on the resolved @playwright/test version from
      # package-lock.json. OS-level apt dependencies (--with-deps) are not
      # part of this cache and are re-installed every run regardless.
      #
      # Measured result (cache-miss vs cache-hit run of the same job, shard
      # 1/4, 2026-08-04): the browser-install step itself dropped from 19s to
      # 12s (a real ~37% reduction for that step) — smaller than initially
      # expected, because GitHub-hosted ubuntu-latest runners already install
      # Chromium quickly (no slow cold download observed even on the
      # cache-miss run). Total job duration was effectively unchanged
      # (~220s vs ~219s) since `npm ci` (~55-60s) and the test run itself
      # (~2m10s) dominate and vary run-to-run by more than this step's
      # savings. The optimisation is still correct and worth keeping (it
      # eliminates a real redundant download on every run, which matters more
      # under network variance than this one measurement shows), but it is
      # not the dramatic win the story's title implied — documented honestly
      # per the AC's "measurable" (not "large") requirement.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers (cache miss — full install)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        env:
          # Prevents apt/needrestart interactive prompts (e.g. "which services
          # to restart") from silently hanging the runner even under apt -y --
          # observed hang on 2026-08-19, install-deps step never returning.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Install Playwright OS dependencies only (cache hit — browsers already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        env:
          # Prevents apt/needrestart interactive prompts (e.g. "which services
          # to restart") from silently hanging the runner even under apt -y --
          # observed hang on 2026-08-19, this exact step never returning.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Run E2E acceptance tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 14

  playwright-visual:
    name: Playwright Visual Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ST-20 (BLG-OPS-118, EPIC-04, v8.2): cache Playwright browser binaries
      # across runs, keyed on the resolved @playwright/test version from
      # package-lock.json. OS-level apt dependencies (--with-deps) are not
      # part of this cache and are re-installed every run regardless.
      #
      # Measured result (cache-miss vs cache-hit run of the same job, shard
      # 1/4, 2026-08-04): the browser-install step itself dropped from 19s to
      # 12s (a real ~37% reduction for that step) — smaller than initially
      # expected, because GitHub-hosted ubuntu-latest runners already install
      # Chromium quickly (no slow cold download observed even on the
      # cache-miss run). Total job duration was effectively unchanged
      # (~220s vs ~219s) since `npm ci` (~55-60s) and the test run itself
      # (~2m10s) dominate and vary run-to-run by more than this step's
      # savings. The optimisation is still correct and worth keeping (it
      # eliminates a real redundant download on every run, which matters more
      # under network variance than this one measurement shows), but it is
      # not the dramatic win the story's title implied — documented honestly
      # per the AC's "measurable" (not "large") requirement.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers (cache miss — full install)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        env:
          # Prevents apt/needrestart interactive prompts (e.g. "which services
          # to restart") from silently hanging the runner even under apt -y --
          # observed hang on 2026-08-19, install-deps step never returning.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Install Playwright OS dependencies only (cache hit — browsers already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        env:
          # Prevents apt/needrestart interactive prompts (e.g. "which services
          # to restart") from silently hanging the runner even under apt -y --
          # observed hang on 2026-08-19, this exact step never returning.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Run visual snapshot tests
        run: npx playwright test tests/e2e/visual-snapshots.spec.js
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshot-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  playwright-visual-regression:
    name: Playwright Visual Regression Baselines (pixel-level, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers (cache miss — full install)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Install Playwright OS dependencies only (cache hit — browsers already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      # Advisory only (ST-18, BLG-QA-81, EPIC-04, v9.0) — baselines committed with
      # this story were generated locally, not on this runner; see playwright.yml's
      # header comment and playwright.config.js's testIgnore comment for why a
      # first-run diff here is expected, not a real regression.
      - name: Run visual regression baseline tests
        continue-on-error: true
        run: npx playwright test --config=playwright.visual-regression.config.js
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload visual regression diff artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
