name: Playwright E2E Acceptance Tests

# Two jobs:
#
# 1. playwright-e2e  — behavioural acceptance tests (blocking gate)
#    All 23 spec files using page.route() interception. No live backend required.
#
# 2. playwright-visual — CSS class/attribute assertions for visual AC (blocking gate)
#    visual-snapshots.spec.js — 14 element-level tests verifying colours and structure
#    via CSS class assertions (no pixel comparison — reliable across Chromium versions).
#
# Spec inventory:
#   risk-dashboard.spec.js       — ST-11: Risk Dashboard (17 scenarios)
#   chart-interactivity.spec.js  — ST-06: Chart Interactivity
#   market-correlation.spec.js   — ST-01 (EPIC-01, v2.8): Market Correlation
#   screener.spec.js             — ST-05/ST-06/ST-07 (EPIC-02, v3.0): Screener page
#   keyboard-shortcuts.spec.js   — ST-11 (EPIC-03, v3.0): Keyboard shortcuts
#   sidebar-nav-groups.spec.js   — ST-13 (BLG-UX-01, v2.3): Nav group collapse
#   alert-nav-badge.spec.js      — ST-10 (BLG-FE-05, v2.3): Alert badge
#   alert-thresholds-empty-state.spec.js  — alert thresholds empty state
#   compliance-panel.spec.js     — compliance panel
#   fee-drag-trade-history.spec.js        — fee drag in trade history
#   loading-states.spec.js       — loading state skeletons
#   notifications.spec.js        — notifications page
#   positions-pnl-columns.spec.js         — positions P&L columns
#   reports-performance-tab.spec.js       — reports performance tab
#   signals-cash-balance.spec.js          — signals cash balance
#   slippage-tracking.spec.js    — slippage tracking
#   smoke-critical-paths.spec.js — critical path smoke tests
#   staleness-indicator.spec.js  — staleness indicator
#   system-status.spec.js        — system status page
#   weekly-digest.spec.js        — weekly digest page
#   screener-uk-suffix.spec.js   — ST-06 (EPIC-03, v3.1): UK ticker .L suffix stripping
#   earnings-calendar.spec.js    — ST-08 (EPIC-03, v3.1): Earnings Calendar UI (Screener/Watchlist/Positions)
#   trade-plan.spec.js           — ST-03 (EPIC-01, v3.1): Trade Plan form
#   visual-snapshots.spec.js     — VS-01–VS-14 pixel snapshots (job 2)

on:
  push:
    branches:
      - main
      - 'exec/**'
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'src/pages/Screener.js'
      - 'src/Layout.js'
      - 'src/pages/**'
      - 'src/components/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'src/pages/Screener.js'
      - 'src/Layout.js'
      - 'src/pages/**'
      - 'src/components/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - '.github/workflows/playwright.yml'

jobs:
  playwright-e2e:
    name: Playwright E2E Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run all E2E acceptance tests
        run: |
          npx playwright test \
            tests/e2e/smoke-critical-paths.spec.js \
            tests/e2e/risk-dashboard.spec.js \
            tests/e2e/chart-interactivity.spec.js \
            tests/e2e/market-correlation.spec.js \
            tests/e2e/screener.spec.js \
            tests/e2e/keyboard-shortcuts.spec.js \
            tests/e2e/sidebar-nav-groups.spec.js \
            tests/e2e/alert-nav-badge.spec.js \
            tests/e2e/alert-thresholds-empty-state.spec.js \
            tests/e2e/compliance-panel.spec.js \
            tests/e2e/fee-drag-trade-history.spec.js \
            tests/e2e/loading-states.spec.js \
            tests/e2e/notifications.spec.js \
            tests/e2e/positions-pnl-columns.spec.js \
            tests/e2e/reports-performance-tab.spec.js \
            tests/e2e/signals-cash-balance.spec.js \
            tests/e2e/slippage-tracking.spec.js \
            tests/e2e/staleness-indicator.spec.js \
            tests/e2e/system-status.spec.js \
            tests/e2e/weekly-digest.spec.js \
            tests/e2e/screener-uk-suffix.spec.js \
            tests/e2e/earnings-calendar.spec.js \
            tests/e2e/trade-plan.spec.js
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  playwright-visual:
    name: Playwright Visual Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual snapshot tests
        run: npx playwright test tests/e2e/visual-snapshots.spec.js
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshot-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
