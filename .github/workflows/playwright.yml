name: Playwright E2E Acceptance Tests

# Suites (all use Playwright network interception — no live backend required):
#   risk-dashboard.spec.js       — ST-11: Risk Dashboard (17 scenarios)
#   chart-interactivity.spec.js  — ST-06: Chart Interactivity (SC-CHART-IX-01–06)
#   market-correlation.spec.js   — ST-01 (EPIC-01, v2.8): Market Correlation (SC-CORR-FE-01–08)
#
# Single job: one VM, one npm ci, one browser install — all specs run sequentially.

on:
  push:
    branches:
      - main
      - 'exec/**'
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/RiskDashboard.js'
      - 'src/components/risk/**'
      - 'src/pages/PerformanceAnalytics.js'
      - 'src/components/analytics/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - '.github/workflows/playwright.yml'

jobs:
  playwright-e2e:
    name: Playwright E2E Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run all E2E acceptance tests
        run: npx playwright test tests/e2e/risk-dashboard.spec.js tests/e2e/chart-interactivity.spec.js tests/e2e/market-correlation.spec.js
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000
          REACT_APP_DEV_FAKE_AUTH: 'true'
          BROWSER: none

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
