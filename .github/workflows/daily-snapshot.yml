# .github/workflows/daily-snapshot.yml
name: Daily Portfolio Maintenance

on:
  schedule:
    - cron: '0 16 * * 1-5'  # 4 PM UTC weekdays
  workflow_dispatch:

jobs:
  daily-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Run Position Analysis
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Running position analysis..."
          curl --max-time 120 -X GET "${API_URL}/positions/analyze" -H "X-API-Key: ${API_KEY}"

      - name: Create Portfolio Snapshot
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Creating portfolio snapshot..."
          curl --max-time 120 -X POST "${API_URL}/portfolio/snapshot" -H "X-API-Key: ${API_KEY}"

      - name: Generate Signals
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Generating Signals..."
          curl --max-time 120 -X POST "${API_URL}/signals/generate" -H "X-API-Key: ${API_KEY}"

