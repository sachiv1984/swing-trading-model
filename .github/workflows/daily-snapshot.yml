# .github/workflows/daily-snapshot.yml
name: Daily Portfolio Maintenance

on:
  schedule:
    - cron: '0 16 * * 1-5'  # 4 PM UTC weekdays
  workflow_dispatch:

jobs:
  daily-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up API
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          echo "Waking up API..."
          curl --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            -s -o /dev/null -w "%{http_code}" \
            -X GET "${API_URL}/health" || true
          sleep 10

      - name: Run Position Analysis
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Running position analysis..."
          curl --fail --show-error --max-time 300 -X GET "${API_URL}/positions/analyze" -H "X-API-Key: ${API_KEY}"

      - name: Create Portfolio Snapshot
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Creating portfolio snapshot..."
          curl --fail --show-error --max-time 300 -X POST "${API_URL}/portfolio/snapshot" -H "X-API-Key: ${API_KEY}"

      - name: Generate Signals
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Generating Signals..."
          curl --fail --show-error --max-time 300 -X POST "${API_URL}/signals/generate" -H "X-API-Key: ${API_KEY}"

      - name: Purge AI Audit Logs
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          # ST-13 (BLG-OPS-94, EPIC-03, v9.3): enforces the retention windows
          # in docs/ops/ai_audit_log_retention_policy.md — gemini_audit_log
          # (90 days) and claude_audit_log (730 days). Idempotent; deletes 0
          # rows on a day with nothing past its window.
          echo "Purging AI audit logs past their retention window..."
          curl --fail --show-error --max-time 120 -X POST "${API_URL}/ops/purge-audit-logs" -H "X-API-Key: ${API_KEY}"
